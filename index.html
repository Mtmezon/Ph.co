COURSE.units.push({ id: 'u4', week: 3, num: '4', title: 'الحرارة وحالات المادة والموائع', en: 'Thermal Energy, States of Matter & Fluids', d: 3, ex: ['4.1', '4.2'],
sub: 'درجة الحرارة والحرارة النوعية، تغير الحالة، الديناميكا الحرارية، الضغط والغازات، الموائع الساكنة والمتحركة، التمدد الحراري',
lessons: [
{ n: '4-1', t: 'درجة الحرارة والطاقة الحرارية', parts: [
 { h: 'الطاقة الحرارية ودرجة الحرارة', html: `
<p>جسيمات المادة في حركة دائمة. <b>الطاقة الحرارية</b> مجموع طاقات جسيمات الجسم (الحركية والوضع)، أما <b>درجة الحرارة</b> فتقيس <b>متوسط الطاقة الحركية</b> للجسيمات. لذلك كوب ماء ساخن درجة حرارته أعلى من حوض ماء دافئ، لكن طاقة الحوض الحرارية أكبر.</p>
<p><b>الاتزان الحراري:</b> عند تلامس جسمين تنتقل الطاقة من الأعلى درجة حرارة إلى الأدنى حتى تتساوى درجتا حرارتهما. وعليه يعمل الترمومتر (مقياس الحرارة).</p>
<p><b>مقاييس الحرارة:</b> سلسيوس (يتجمد الماء عند ⟦0 °C⟧ ويغلي عند ⟦100 °C⟧) وكلفن (المطلق): ⟦T_{K} = T_{C} + 273⟧. <b>الصفر المطلق</b> ⟦0 K = −273 °C⟧ أدنى درجة حرارة ممكنة (أقل طاقة حركية). والفرق في درجات الحرارة ⟦ΔT⟧ قيمته بالكلفن تساوي قيمته بالسلسيوس.</p>`,
 q: [['⟦−73 °C⟧ تساوي', ['⟦200 K⟧', '⟦346 K⟧', '⟦−200 K⟧', '⟦73 K⟧'], 0, '⟦−73 + 273 = 200 K⟧.'],
     ['درجة الحرارة مقياس لـ', ['الطاقة الحرارية الكلية', 'متوسط الطاقة الحركية للجسيمات', 'كمية الحرارة', 'كتلة الجسم'], 1, 'درجة الحرارة = متوسط الطاقة الحركية للجسيمات.']] },
 { h: 'انتقال الحرارة', html: `
<ul><li><b>التوصيل:</b> انتقال الطاقة بتصادم الجسيمات المتجاورة، ويحدث أساسًا في الجوامد (الفلزات موصلات جيدة).</li>
<li><b>الحمل:</b> انتقال الطاقة بحركة المائع نفسه (السوائل والغازات)؛ يرتفع المائع الساخن الأقل كثافة ويهبط البارد (تيارات الحمل، النسيم البحري).</li>
<li><b>الإشعاع:</b> انتقال الطاقة بالموجات الكهرومغناطيسية، ولا يحتاج إلى وسط؛ وهكذا تصلنا حرارة الشمس.</li></ul>`,
 q: [['تصل حرارة الشمس إلى الأرض بـ', ['التوصيل', 'الحمل', 'الإشعاع', 'التبخر'], 2, 'الفضاء فراغ، والإشعاع لا يحتاج وسطًا.']] },
 { h: 'الحرارة النوعية والمسعر', html: `
<p><b>الحرارة النوعية</b> ⟦C⟧: كمية الطاقة اللازمة لرفع درجة حرارة ⟦1 kg⟧ من المادة ⟦1 K⟧، وحدتها ⟦J/kg·K⟧ (أو ⟦J/kg·°C⟧). الحرارة المكتسبة أو المفقودة: ⟦Q = mCΔT = mC(T_{f} − T_{i})⟧.</p>
<p>الحرارة النوعية للماء كبيرة (نحو ⟦4180 J/kg·K⟧)، لذلك يسخن الماء ويبرد ببطء ويُستعمل في التبريد، ويعتدل مناخ المدن الساحلية.</p>
<p><b>المسعر:</b> في نظام معزول الطاقة محفوظة: الحرارة التي يفقدها الجسم الساخن = الحرارة التي يكتسبها البارد. ولخلط كتل من المادة نفسها تكون درجة الحرارة النهائية متوسطًا موزونًا بالكتل: ⟦T_{f} = (m_{1}T_{1} + m_{2}T_{2})/(m_{1} + m_{2})⟧.</p>
<div class="box ex"><b>✎ مثال</b>كم جولًا يلزم لتسخين ⟦2 kg⟧ ماء من ⟦20 °C⟧ إلى ⟦70 °C⟧؟ ⟦(C = 4200 J/kg·°C)⟧<span class="sol">الحل: ⟦Q = 2×4200×50 = 420000 J = 420 kJ⟧.</span></div>
<div class="box ex"><b>✎ مثال</b>خُلط ⟦2 kg⟧ ماء عند ⟦10 °C⟧ مع ⟦3 kg⟧ عند ⟦60 °C⟧. ما الدرجة النهائية؟<span class="sol">الحل: ⟦(2×10 + 3×60)/5 = 200/5 = 40 °C⟧.</span></div>`,
 q: [['أُعطي جسمان لهما الكتلة نفسها كمية الحرارة نفسها، فارتفعت حرارة الأول أكثر. الأول', ['حرارته النوعية أكبر', 'حرارته النوعية أصغر', 'كتلته أكبر', 'موصل رديء'], 1, '⟦ΔT = Q/(mC)⟧: C الأصغر ⇐ ΔT أكبر.']] }],
 cards: [['درجة الحرارة', 'متوسط الطاقة الحركية للجسيمات'], ['الكلفن', '⟦T_{K} = T_{C} + 273⟧'], ['الصفر المطلق', '⟦0 K = −273 °C⟧'], ['التوصيل', 'تصادم الجسيمات (الجوامد)'], ['الحمل', 'حركة المائع (سوائل وغازات)'], ['الإشعاع', 'لا يحتاج وسطًا'], ['الحرارة المكتسبة', '⟦Q = mCΔT⟧'], ['المسعر', 'المفقودة = المكتسبة']] },

{ n: '4-2', t: 'تغير الحالة والديناميكا الحرارية', parts: [
 { h: 'تغيرات حالة المادة', html: `
<p>أثناء الانصهار أو الغليان تُستعمل الطاقة في كسر الروابط بين الجسيمات (زيادة طاقة الوضع) لا في رفع درجة الحرارة؛ لذلك <b>تبقى درجة الحرارة ثابتة أثناء تغير الحالة</b> (المنطقة الأفقية في منحنى التسخين).</p>
<ul><li><b>حرارة الانصهار</b> ⟦H_{f}⟧: الطاقة اللازمة لصهر ⟦1 kg⟧ من الصلب عند درجة انصهاره: ⟦Q = mH_{f}⟧ (للجليد نحو ⟦3.34×10^{5} J/kg⟧).</li>
<li><b>حرارة التبخر</b> ⟦H_{v}⟧: الطاقة اللازمة لتبخير ⟦1 kg⟧ من السائل عند درجة غليانه: ⟦Q = mH_{v}⟧ (للماء نحو ⟦2.26×10^{6} J/kg⟧، أكبر بكثير من حرارة الانصهار).</li></ul>
<div class="box ex"><b>✎ مثال</b>كم جولًا يلزم لصهر ⟦2 kg⟧ جليد عند ⟦0 °C⟧؟ ⟦(H_{f} = 3.34×10^{5} J/kg)⟧<span class="sol">الحل: ⟦Q = 2×3.34×10^{5} = 6.68×10^{5} J⟧، وتبقى الدرجة ⟦0 °C⟧ حتى ينصهر كله.</span></div>
<p>لتسخين جليد عند ⟦−10 °C⟧ حتى يصبح بخارًا عند ⟦100 °C⟧ نجمع خمس مراحل: تسخين الجليد ⟦(mC_{جليد}ΔT)⟧ + الانصهار ⟦(mH_{f})⟧ + تسخين الماء ⟦(mC_{ماء}ΔT)⟧ + التبخر ⟦(mH_{v})⟧ + تسخين البخار.</p>`,
 q: [['أثناء غليان الماء تبقى درجة حرارته ثابتة لأن الطاقة', ['تُفقد إلى الهواء', 'تُستعمل في تغيير الحالة', 'تزيد الطاقة الحركية للجزيئات', 'تتحول إلى ضوء'], 1, 'الطاقة تكسر الروابط (تزيد طاقة الوضع) فلا ترتفع الدرجة.']] },
 { h: 'قوانين الديناميكا الحرارية', html: `
<p><b>القانون الأول:</b> ⟦ΔU = Q − W⟧؛ التغير في الطاقة الداخلية للنظام = الحرارة المضافة إليه − الشغل الذي يبذله النظام. وهو صورة من قانون حفظ الطاقة.</p>
<p><b>المحرك الحراري</b> يحول الطاقة الحرارية إلى شغل: يأخذ ⟦Q_{H}⟧ من مستودع ساخن، ويبذل شغلًا ⟦W = Q_{H} − Q_{L}⟧، ويطرد ⟦Q_{L}⟧ إلى مستودع بارد. كفاءته ⟦e = W/Q_{H}⟧ وهي أقل من ⟦100٪⟧ دائمًا (محرك السيارة). و<b>الثلاجة والمضخة الحرارية</b> تنقلان الحرارة من البارد إلى الساخن ببذل شغل.</p>
<p><b>القانون الثاني:</b> تنتقل الحرارة تلقائيًا من الجسم الساخن إلى البارد لا العكس، ولا يمكن تحويل الطاقة الحرارية كلها إلى شغل. والعمليات الطبيعية تجري في اتجاه زيادة <b>الإنتروبي</b> (مقياس العشوائية): ⟦ΔS = Q/T⟧.</p>`,
 q: [['أضيف ⟦500 J⟧ حرارة إلى غاز فبذل شغلًا ⟦200 J⟧. التغير في طاقته الداخلية', ['⟦700 J⟧', '⟦300 J⟧', '⟦−300 J⟧', '⟦200 J⟧'], 1, '⟦ΔU = 500 − 200 = 300 J⟧.'],
     ['محرك حراري يأخذ ⟦1000 J⟧ من المستودع الساخن ويطرد ⟦700 J⟧. كفاءته', ['⟦30٪⟧', '⟦70٪⟧', '⟦43٪⟧', '⟦100٪⟧'], 0, '⟦W = 300 J ⇒ e = 300/1000 = 30٪⟧.']] }],
 cards: [['أثناء تغير الحالة', 'درجة الحرارة ثابتة'], ['حرارة الانصهار', '⟦Q = mH_{f}⟧'], ['حرارة التبخر', '⟦Q = mH_{v}⟧'], ['القانون الأول للديناميكا', '⟦ΔU = Q − W⟧'], ['كفاءة المحرك الحراري', '⟦e = W/Q_{H}⟧'], ['القانون الثاني', 'الحرارة تنتقل تلقائيًا من الساخن إلى البارد'], ['الإنتروبي', 'مقياس العشوائية ⟦ΔS = Q/T⟧']] },

{ n: '4-3', t: 'الضغط وقوانين الغازات', parts: [
 { h: 'الضغط', html: `
<p><b>الضغط</b> القوة العمودية المؤثرة في وحدة المساحة: ⟦P = F/A⟧، ووحدته الباسكال ⟦Pa = N/m^{2}⟧، و⟦1 kPa = 1000 Pa⟧. الضغط الجوي عند سطح البحر نحو ⟦101 kPa⟧، ويُقاس بالبارومتر، ويقل بالارتفاع لأن عمود الهواء فوقك يقل.</p>
<p>القوة نفسها على مساحة أصغر تعطي ضغطًا أكبر؛ لذلك السكين الحاد يقطع بسهولة، والأحذية الثلجية العريضة تمنع الغوص في الثلج.</p>`,
 q: [['قوة ⟦600 N⟧ تؤثر عموديًا على مساحة ⟦3 m^{2}⟧. الضغط', ['⟦200 Pa⟧', '⟦1800 Pa⟧', '⟦603 Pa⟧', '⟦0.005 Pa⟧'], 0, '⟦P = 600/3 = 200 Pa⟧.']] },
 { h: 'قوانين الغازات', html: `
<p>درجات الحرارة في قوانين الغازات <b>بالكلفن دائمًا</b>.</p>
<table class="tbl"><tr><th>القانون</th><th>الثابت</th><th>الصيغة</th></tr>
<tr><td>بويل</td><td>درجة الحرارة</td><td>⟦P_{1}V_{1} = P_{2}V_{2}⟧ (P عكسي مع V)</td></tr>
<tr><td>شارل</td><td>الضغط</td><td>⟦V_{1}/T_{1} = V_{2}/T_{2}⟧ (V طردي مع T)</td></tr>
<tr><td>القانون العام</td><td>كمية الغاز</td><td>⟦P_{1}V_{1}/T_{1} = P_{2}V_{2}/T_{2}⟧</td></tr>
<tr><td>الغاز المثالي</td><td>—</td><td>⟦PV = nRT⟧، ⟦R = 8.31 Pa·m^{3}/mol·K⟧</td></tr></table>
<div class="box ex"><b>✎ مثال</b>غاز حجمه ⟦2 L⟧ عند ⟦27 °C⟧ سُخّن إلى ⟦327 °C⟧ مع ثبوت الضغط. ما حجمه الجديد؟<span class="sol">الحل: ⟦T_{1} = 300 K⟧ و⟦T_{2} = 600 K⟧، فـ ⟦V_{2} = 2×600/300 = 4 L⟧. (لو استعملت السلسيوس لأخطأت!)</span></div>`,
 q: [['غاز ضغطه ⟦100 kPa⟧ وحجمه ⟦6 L⟧ ضُغط عند درجة حرارة ثابتة إلى ⟦2 L⟧. ضغطه', ['⟦33 kPa⟧', '⟦200 kPa⟧', '⟦300 kPa⟧', '⟦600 kPa⟧'], 2, '⟦P_{2} = 100×6/2 = 300 kPa⟧.']] },
 { h: 'التمدد الحراري وقوى التماسك والبلازما', html: `
<p><b>التمدد الحراري:</b> تتمدد معظم المواد بالتسخين. التمدد الطولي ⟦ΔL = αL_{i}ΔT⟧ والحجمي ⟦ΔV = βV_{i}ΔT⟧ (⟦β ≈ 3α⟧ للجوامد). لذلك تُترك فواصل في الجسور وسكك الحديد. و<b>الشريط ثنائي الفلز</b> ينحني عند التسخين لاختلاف معامل تمدد فلزيه، ويستعمل في منظمات الحرارة. و<b>الماء شاذ</b>: كثافته أكبر ما يمكن عند ⟦4 °C⟧، ويتمدد عند تجمده فيطفو الجليد.</p>
<p><b>قوى التماسك</b> بين جزيئات المادة نفسها تفسر <b>التوتر السطحي</b> (كرويّة القطرات، ووقوف بعض الحشرات على الماء)، و<b>قوى التلاصق</b> بين جزيئات مواد مختلفة تفسر <b>الخاصية الشعرية</b> (صعود الماء في أنبوب رفيع). والسائل المتطاير يتبخر بسرعة فيبرّد السطح (التبريد بالتبخر).</p>
<p><b>البلازما:</b> الحالة الرابعة للمادة، غاز متأين من أيونات وإلكترونات موصل للكهرباء (البرق، الشمس، مصابيح النيون). وللجوامد <b>مرونة</b>: قدرتها على العودة إلى شكلها بعد زوال القوة.</p>
<div class="box ex"><b>✎ مثال</b>قضيب فولاذي ⟦20 m⟧ ⟦(α = 12×10^{−6} °C^{−1})⟧ ارتفعت حرارته ⟦50 °C⟧. كم يتمدد؟<span class="sol">الحل: ⟦ΔL = 12×10^{−6}×20×50 = 0.012 m = 12 mm⟧.</span></div>`,
 q: [['صعود الماء في أنبوب زجاجي رفيع يُفسَّر بـ', ['التوتر السطحي فقط', 'قوى التلاصق (الخاصية الشعرية)', 'الضغط الجوي فقط', 'التمدد الحراري'], 1, 'قوى التلاصق بين الماء والزجاج أكبر من قوى تماسكه.']] }],
 cards: [['الضغط', '⟦P = F/A⟧ ⟦(Pa)⟧'], ['بويل', '⟦P_{1}V_{1} = P_{2}V_{2}⟧'], ['شارل', '⟦V_{1}/T_{1} = V_{2}/T_{2}⟧ بالكلفن'], ['الغاز المثالي', '⟦PV = nRT⟧'], ['التمدد الطولي', '⟦ΔL = αL_{i}ΔT⟧'], ['التوتر السطحي', 'قوى التماسك'], ['الخاصية الشعرية', 'قوى التلاصق'], ['البلازما', 'غاز متأين موصل']] },

{ n: '4-4', t: 'الموائع الساكنة والمتحركة', parts: [
 { h: 'ضغط السائل ومبدأ باسكال', html: `
<p>ضغط عمود سائل عند عمق h: ⟦P = ρhg⟧، يزداد بالعمق ويعتمد على كثافة السائل، ولا يعتمد على شكل الإناء أو مساحة قاعه. والضغط الكلي ⟦P = P_{جوي} + ρhg⟧.</p>
<p><b>الكثافة</b> ⟦ρ = m/V⟧ بوحدة ⟦kg/m^{3}⟧ (الماء ⟦1000 kg/m^{3}⟧).</p>
<p><b>مبدأ باسكال:</b> الضغط المؤثر في مائع محصور ينتقل بالتساوي إلى جميع أجزائه. وعليه يعمل المكبس الهيدروليكي وكوابح السيارة: ⟦F_{1}/A_{1} = F_{2}/A_{2}⟧؛ قوة صغيرة على مكبس صغير تعطي قوة كبيرة على مكبس كبير (لكن المكبس الصغير يتحرك مسافة أكبر).</p>
<div class="box ex"><b>✎ مثال</b>مكبس هيدروليكي مساحتا مكبسيه ⟦5 cm^{2}⟧ و⟦500 cm^{2}⟧. ما القوة اللازمة لرفع سيارة وزنها ⟦12000 N⟧؟<span class="sol">الحل: ⟦F_{1} = 12000×5/500 = 120 N⟧.</span></div>`,
 q: [['الضغط عند قاع حوض ماء عمقه ⟦3 m⟧ الناتج عن الماء فقط', ['⟦3000 Pa⟧', '⟦30000 Pa⟧', '⟦300 Pa⟧', '⟦3×10^{6} Pa⟧'], 1, '⟦P = 1000×3×10 = 30000 Pa⟧.']] },
 { h: 'مبدأ أرخميدس والطفو', html: `
<p><b>قوة الطفو</b> قوة رأسية إلى أعلى يؤثر بها المائع في الجسم المغمور فيه، تساوي <b>وزن المائع الذي يزيحه الجسم</b>: ⟦F_{الطفو} = ρ_{مائع}Vg⟧، حيث V حجم الجزء المغمور.</p>
<ul><li>إذا كانت كثافة الجسم أقل من كثافة المائع يطفو (ويغمر جزء منه حتى يساوي الطفو وزنه).</li><li>إذا كانت أكبر يغوص، ويبدو وزنه أقل: الوزن الظاهري = الوزن الحقيقي − قوة الطفو.</li>
<li>السفن الفولاذية تطفو لأن شكلها المجوف يزيح حجمًا كبيرًا من الماء. والغواصة تغوص وتطفو بتغيير كمية الماء في خزاناتها.</li></ul>
<div class="box ex"><b>✎ مثال</b>جسم حجمه ⟦0.002 m^{3}⟧ ووزنه ⟦50 N⟧ غُمر كليًا في الماء. ما قوة الطفو ووزنه الظاهري؟<span class="sol">الحل: ⟦F_{الطفو} = 1000×0.002×10 = 20 N⟧، والوزن الظاهري ⟦50 − 20 = 30 N⟧.</span></div>`,
 q: [['قطعة خشب كثافتها ⟦600 kg/m^{3}⟧ في الماء. الجزء المغمور منها', ['كلها', '⟦60٪⟧ من حجمها', '⟦40٪⟧ من حجمها', 'لا شيء'], 1, 'تطفو حين يساوي الطفو الوزن ⇐ نسبة المغمور = ⟦ρ_{جسم}/ρ_{ماء} = 0.6⟧.']] },
 { h: 'الموائع المتحركة: الاستمرارية وبرنولي', html: `
<p><b>معادلة الاستمرارية:</b> لمائع غير قابل للانضغاط يتدفق في أنبوب: ⟦A_{1}v_{1} = A_{2}v_{2}⟧؛ يضيق المقطع فتزداد السرعة (كما يحدث حين تضغط على فوهة خرطوم الماء).</p>
<p><b>مبدأ برنولي:</b> كلما زادت سرعة المائع قل ضغطه. ويفسر: رفع جناح الطائرة (الهواء فوق الجناح أسرع فضغطه أقل)، وانحناء مسار الكرة الدوارة، وعمل البخاخ والمكربن، واندفاع الستارة نحو تيار الهواء. وخطوط الانسياب تمثل مسار المائع؛ وتقاربها يعني سرعة أكبر.</p>
<div class="box ex"><b>✎ مثال</b>ماء يتدفق بـ ⟦2 m/s⟧ في أنبوب مقطعه ⟦40 cm^{2}⟧ ثم يضيق إلى ⟦10 cm^{2}⟧. ما سرعته في الجزء الضيق؟<span class="sol">الحل: ⟦v_{2} = 40×2/10 = 8 m/s⟧، وضغطه هناك أقل.</span></div>`,
 q: [['يرتفع جناح الطائرة لأن الهواء فوقه', ['أبطأ وضغطه أكبر', 'أسرع وضغطه أقل', 'أكثف', 'أبرد'], 1, 'برنولي: سرعة أكبر ⇐ ضغط أقل فوق الجناح.']] }],
 cards: [['ضغط السائل', '⟦P = ρhg⟧'], ['الكثافة', '⟦ρ = m/V⟧'], ['مبدأ باسكال', '⟦F_{1}/A_{1} = F_{2}/A_{2}⟧'], ['قوة الطفو', '⟦F_{الطفو} = ρ_{مائع}Vg⟧'], ['أرخميدس', 'الطفو = وزن المائع المزاح'], ['الوزن الظاهري', 'الحقيقي − الطفو'], ['الاستمرارية', '⟦A_{1}v_{1} = A_{2}v_{2}⟧'], ['برنولي', 'سرعة أكبر ⇐ ضغط أقل']] }
]});

COURSE.units.push({ id: 'u5', week: 3, num: '5', title: 'الاهتزازات والموجات والصوت', en: 'Vibrations, Waves & Sound', d: 4, ex: ['5.1', '5.2'],
sub: 'الحركة الدورية والبندول، خصائص الموجات وسلوكها، الصوت وخصائصه، الرنين والأنابيب والضربات وتأثير دوبلر',
lessons: [
{ n: '5-1', t: 'الحركة الدورية', parts: [
 { h: 'الحركة التوافقية البسيطة والنابض', html: `
<p><b>الحركة الدورية</b> حركة تتكرر في فترات زمنية متساوية. <b>الزمن الدوري</b> ⟦T⟧ زمن الدورة الكاملة، و<b>التردد</b> ⟦f⟧ عدد الدورات في الثانية: ⟦f = 1/T⟧ بوحدة الهيرتز ⟦Hz⟧. و<b>السعة</b> أقصى إزاحة عن موضع الاتزان.</p>
<p><b>الحركة التوافقية البسيطة</b> تحدث عندما تكون قوة الإرجاع متناسبة طرديًا مع الإزاحة ومعاكسة لها؛ مثالها النابض: <b>قانون هوك</b> ⟦F = −kx⟧، وطاقة الوضع المرونية ⟦PE_{sp} = ½kx^{2}⟧. والزمن الدوري لكتلة على نابض ⟦T = 2π√(m/k)⟧.</p>
<div class="box ex"><b>✎ مثال</b>جسم يهتز ⟦40⟧ اهتزازة في ⟦10 s⟧. ما زمنه الدوري وتردده؟<span class="sol">الحل: ⟦T = 10/40 = 0.25 s⟧ و⟦f = 1/0.25 = 4 Hz⟧.</span></div>`,
 q: [['جسم تردده ⟦5 Hz⟧. زمنه الدوري', ['⟦5 s⟧', '⟦0.2 s⟧', '⟦0.5 s⟧', '⟦2 s⟧'], 1, '⟦T = 1/f = 0.2 s⟧.']] },
 { h: 'البندول البسيط والرنين', html: `
<p><b>البندول البسيط</b> ثقل معلق بخيط طوله l يتأرجح بزاوية صغيرة: ⟦T = 2π√(l/g)⟧. الزمن الدوري يعتمد على طول الخيط وتسارع الجاذبية فقط، ولا يعتمد على الكتلة ولا على السعة الصغيرة. لذلك يُستعمل لقياس g. وتكبير الطول أربعة أمثاله يضاعف الزمن الدوري.</p>
<p><b>الرنين</b>: عندما تؤثر قوى صغيرة متكررة بتردد يساوي <b>التردد الطبيعي</b> للنظام تزداد السعة كثيرًا (دفع الأرجوحة في اللحظة المناسبة، اهتزاز الجسور، كسر كأس بالصوت).</p>`,
 q: [['إذا زيد طول خيط بندول بسيط إلى أربعة أمثاله فإن زمنه الدوري', ['يتضاعف', 'يصبح أربعة أمثاله', 'يقل للنصف', 'لا يتغير'], 0, '⟦T ∝ √l⟧ ⇐ ⟦√4 = 2⟧.']] }],
 cards: [['التردد والزمن الدوري', '⟦f = 1/T⟧'], ['قانون هوك', '⟦F = −kx⟧'], ['البندول البسيط', '⟦T = 2π√(l/g)⟧'], ['زمن البندول لا يعتمد على', 'الكتلة والسعة الصغيرة'], ['الرنين', 'تردد القوة = التردد الطبيعي']] },

{ n: '5-2', t: 'خصائص الموجات', parts: [
 { h: 'أنواع الموجات', html: `
<p><b>الموجة</b> اضطراب ينقل الطاقة دون أن ينقل المادة. <b>الموجات الميكانيكية</b> تحتاج إلى وسط (الصوت، موجات الماء، موجات الحبل)، أما <b>الكهرومغناطيسية</b> فلا تحتاج إلى وسط (الضوء).</p>
<ul><li><b>المستعرضة:</b> تهتز جسيمات الوسط عموديًا على اتجاه انتشار الموجة (موجات الحبل، الضوء)، ولها قمم وقيعان.</li>
<li><b>الطولية:</b> تهتز الجسيمات موازية لاتجاه الانتشار (الصوت، موجات النابض الطولية)، ولها تضاغطات وتخلخلات.</li>
<li><b>السطحية:</b> مزيج منهما (موجات سطح الماء).</li></ul>`,
 q: [['الصوت موجة', ['مستعرضة كهرومغناطيسية', 'طولية ميكانيكية', 'مستعرضة ميكانيكية', 'لا تحتاج وسطًا'], 1, 'الصوت تضاغطات وتخلخلات في وسط مادي.']] },
 { h: 'مقاييس الموجة', html: `
<p><b>الطول الموجي</b> ⟦λ⟧: المسافة بين قمتين (أو تضاغطين) متتاليين. <b>السعة</b>: أقصى إزاحة عن موضع الاتزان، وتتعلق بالطاقة التي تنقلها الموجة (الطاقة تتناسب مع مربع السعة). <b>سرعة الموجة</b>: ⟦v = λf = λ/T⟧.</p>
<p>سرعة الموجة <b>يحددها الوسط</b>، أما التردد فيحدده المصدر؛ لذلك عند انتقال الموجة إلى وسط آخر يبقى التردد ثابتًا وتتغير السرعة والطول الموجي. وفي الوسط نفسه زيادة التردد تقصّر الطول الموجي.</p>
<div class="box ex"><b>✎ مثال</b>موجة صوتية ترددها ⟦170 Hz⟧ في هواء سرعة الصوت فيه ⟦340 m/s⟧. ما طولها الموجي؟<span class="sol">الحل: ⟦λ = 340/170 = 2 m⟧.</span></div>`,
 q: [['عند انتقال موجة من وسط إلى آخر فإن الذي لا يتغير', ['السرعة', 'الطول الموجي', 'التردد', 'الاتجاه'], 2, 'التردد يحدده المصدر.'],
     ['موجة ترددها ⟦50 Hz⟧ وطولها الموجي ⟦4 m⟧. سرعتها', ['⟦12.5 m/s⟧', '⟦54 m/s⟧', '⟦200 m/s⟧', '⟦0.08 m/s⟧'], 2, '⟦v = 4×50 = 200 m/s⟧.']] },
 { h: 'سلوك الموجات', html: `
<ul><li><b>الانعكاس عند حد:</b> النبضة المنعكسة عن طرف مثبت تنقلب، وعن طرف حر لا تنقلب. وعند الانتقال من وسط إلى آخر ينعكس جزء وينفذ جزء.</li>
<li><b>مبدأ التراكب:</b> عند التقاء موجتين تكون الإزاحة المحصلة مجموع إزاحتيهما. <b>التداخل البنّاء</b>: تلتقي قمة بقمة فتكبر السعة، و<b>الهدام</b>: قمة بقاع فتقل السعة.</li>
<li><b>الموجات الموقوفة:</b> تنشأ من تداخل موجتين متماثلتين متعاكستين؛ فيها <b>عقد</b> لا تهتز و<b>بطون</b> اهتزازها أكبر ما يمكن. المسافة بين عقدتين متتاليتين ⟦λ/2⟧.</li>
<li><b>في بعدين:</b> الانعكاس (زاوية السقوط = زاوية الانعكاس)، والانكسار (تغير اتجاه الموجة لتغير سرعتها في وسط جديد)، والحيود (انحناء الموجة حول العوائق والفتحات، ويكون واضحًا إذا كانت الفتحة قريبة من الطول الموجي).</li></ul>`,
 q: [['النقاط التي لا تهتز في الموجة الموقوفة', ['البطون', 'العقد', 'القمم', 'التضاغطات'], 1, 'العقد: تداخل هدام دائم.'],
     ['المسافة بين بطنين متتاليين في موجة موقوفة طولها الموجي ⟦1.2 m⟧', ['⟦0.3 m⟧', '⟦0.6 m⟧', '⟦1.2 m⟧', '⟦2.4 m⟧'], 1, 'بين بطنين (أو عقدتين) متتاليين ⟦λ/2 = 0.6 m⟧.']] }],
 cards: [['الموجة', 'تنقل الطاقة لا المادة'], ['المستعرضة', 'الاهتزاز عمودي على الانتشار'], ['الطولية', 'الاهتزاز موازٍ للانتشار'], ['سرعة الموجة', '⟦v = λf⟧'], ['سرعة الموجة يحددها', 'الوسط'], ['التداخل البنّاء', 'قمة مع قمة'], ['بين عقدتين متتاليتين', '⟦λ/2⟧'], ['الانعكاس عن طرف مثبت', 'النبضة تنقلب']] },

{ n: '5-3', t: 'الصوت', parts: [
 { h: 'خصائص الصوت', html: `
<p>الصوت موجة طولية ميكانيكية تنتقل بتغيرات في الضغط، ولا تنتقل في الفراغ. سرعته في الهواء عند ⟦20 °C⟧ نحو ⟦343 m/s⟧ (تُقرّب ⟦340 m/s⟧ في الأسئلة)، وتزداد بارتفاع درجة الحرارة، وهي أكبر في السوائل وأكبر منها في الجوامد.</p>
<table class="tbl"><tr><th>ما نُدركه</th><th>الخاصية الفيزيائية</th></tr>
<tr><td>حدة الصوت</td><td>التردد (تردد أعلى ⇐ صوت أحدّ)</td></tr>
<tr><td>علو الصوت</td><td>السعة (الشدة)، ويُقاس مستوى الصوت بالديسبل ⟦dB⟧</td></tr>
<tr><td>نوع الصوت (طابعه)</td><td>التوافقيات المصاحبة للتردد الأساسي</td></tr></table>
<p>الأذن البشرية تسمع ⟦20 Hz⟧ إلى ⟦20000 Hz⟧ تقريبًا؛ وما فوقها فوق صوتي، وما دونها تحت صوتي. وزيادة مستوى الصوت ⟦10 dB⟧ تزيد الشدة عشرة أمثالها وتُدرك كأن علو الصوت تضاعف. والتعرض الطويل لأكثر من نحو ⟦85 dB⟧ يضر السمع.</p>
<p><b>الصدى</b> انعكاس الصوت عن حاجز: ⟦2d = vt⟧ لأن الصوت يقطع المسافة ذهابًا وإيابًا (السونار وتحديد الأعماق).</p>
<div class="box ex"><b>✎ مثال</b>أُرسلت نبضة سونار فعاد صداها من قاع البحر بعد ⟦2 s⟧، وسرعة الصوت في الماء ⟦1500 m/s⟧. ما العمق؟<span class="sol">الحل: ⟦d = 1500×2/2 = 1500 m⟧.</span></div>`,
 q: [['ترتبط حدة الصوت بـ', ['السعة', 'التردد', 'السرعة', 'الطاقة'], 1, 'الحدة = التردد، والعلو = السعة.']] },
 { h: 'تأثير دوبلر', html: `
<p>تغير التردد المُدرَك بسبب الحركة النسبية بين المصدر والمراقب: <b>الاقتراب يرفع التردد المدرَك</b> (صوت أحدّ)، و<b>الابتعاد يخفضه</b>. لذلك يتغير صوت سيارة الإسعاف عند مرورها بك.</p>
<p>الصيغة في كتاب المنهج: ⟦f_{d} = f_{s}(v − v_{d})/(v − v_{s})⟧، حيث v سرعة الصوت، و⟦v_{d}⟧ سرعة المراقب، و⟦v_{s}⟧ سرعة المصدر، والاتجاه الموجب من المراقب نحو المصدر.</p>
<p>تطبيقاته: رادار مراقبة السرعة، وقياس سرعة تدفق الدم، ومعرفة اقتراب النجوم أو ابتعادها (الانزياح نحو الأحمر يعني الابتعاد).</p>`,
 q: [['سيارة إسعاف تبتعد عن شخص ساكن. التردد الذي يسمعه', ['أعلى من تردد الصفارة', 'أقل من تردد الصفارة', 'مساوٍ له', 'صفر'], 1, 'الابتعاد ⇐ تردد مُدرَك أقل.']] },
 { h: 'الرنين في الأعمدة الهوائية والأوتار والضربات', html: `
<table class="tbl"><tr><th>المرنان</th><th>أطوال الرنين</th><th>التردد الأساسي</th></tr>
<tr><td>أنبوب مغلق من طرف</td><td>⟦L = λ/4 ، 3λ/4 ، 5λ/4 …⟧</td><td>⟦f = v/(4L)⟧ والتوافقيات الفردية فقط</td></tr>
<tr><td>أنبوب مفتوح الطرفين</td><td>⟦L = λ/2 ، λ ، 3λ/2 …⟧</td><td>⟦f = v/(2L)⟧ وكل التوافقيات</td></tr>
<tr><td>وتر مثبت الطرفين</td><td>⟦L = λ/2 ، λ …⟧</td><td>⟦f = v/(2L)⟧</td></tr></table>
<p>في الأنبوب المغلق: عقدة عند الطرف المغلق وبطن عند المفتوح. والفرق بين طولي رنين متتاليين ⟦λ/2⟧ في النوعين.</p>
<p><b>الضربات (النبضات):</b> تداخل صوتين ترددهما متقاربان فيعلو الصوت وينخفض دوريًا: ⟦f_{ضربات} = |f_{A} − f_{B}|⟧؛ وتُستعمل في ضبط الآلات الموسيقية.</p>
<div class="box ex"><b>✎ مثال</b>أنبوب مغلق طوله ⟦0.85 m⟧. ما تردده الأساسي؟ ⟦(v = 340 m/s)⟧<span class="sol">الحل: ⟦λ = 4L = 3.4 m⟧، و⟦f = 340/3.4 = 100 Hz⟧.</span></div>`,
 q: [['أنبوب مفتوح الطرفين طوله ⟦0.5 m⟧ ⟦(v = 340 m/s)⟧. تردده الأساسي', ['⟦170 Hz⟧', '⟦340 Hz⟧', '⟦680 Hz⟧', '⟦85 Hz⟧'], 1, '⟦f = 340/(2×0.5) = 340 Hz⟧.'],
     ['شوكتان ترددهما ⟦256 Hz⟧ و⟦260 Hz⟧. تردد الضربات', ['⟦4 Hz⟧', '⟦258 Hz⟧', '⟦516 Hz⟧', '⟦2 Hz⟧'], 0, '⟦|260 − 256| = 4 Hz⟧.']] }],
 cards: [['سرعة الصوت في الهواء', '⟦≈ 343 m/s⟧ (340 في الأسئلة)'], ['حدة الصوت', 'التردد'], ['علو الصوت', 'السعة، بالديسبل'], ['الصدى', '⟦2d = vt⟧'], ['دوبلر — اقتراب', 'تردد مُدرَك أعلى'], ['أنبوب مغلق', '⟦f = v/(4L)⟧'], ['أنبوب مفتوح', '⟦f = v/(2L)⟧'], ['الضربات', '⟦|f_{A} − f_{B}|⟧'], ['مدى السمع', '⟦20 Hz⟧ – ⟦20 kHz⟧']] }
]});

COURSE.units.push({ id: 'u6', week: 4, num: '6', title: 'الضوء والبصريات', en: 'Light & Optics', d: 5, ex: ['6.1', '6.2'],
sub: 'أساسيات الضوء والاستضاءة واللون والاستقطاب، الانعكاس والمرايا، الانكسار، العدسات والعين، التداخل والحيود',
lessons: [
{ n: '6-1', t: 'أساسيات الضوء', parts: [
 { h: 'طبيعة الضوء والاستضاءة', html: `
<p>ينتشر الضوء في الوسط المتجانس في <b>خطوط مستقيمة</b> (نموذج الشعاع)، ويفسر ذلك تكوّن الظلال. سرعته في الفراغ ⟦c = 3×10^{8} m/s⟧، و⟦c = λf⟧. والضوء المرئي جزء صغير من الطيف الكهرومغناطيسي بين نحو ⟦400 nm⟧ (بنفسجي) و⟦700 nm⟧ (أحمر).</p>
<p><b>الأجسام:</b> المضيء يبعث الضوء (الشمس، المصباح)، والمستضاء يعكسه (القمر). والشفاف ينفذ الضوء فيُرى ما خلفه بوضوح، وشبه الشفاف ينفذه دون وضوح، والمعتم لا ينفذه.</p>
<p><b>التدفق الضوئي</b> ⟦P⟧ معدل انبعاث الضوء من المصدر بوحدة اللومن ⟦lm⟧. و<b>الاستضاءة</b> ⟦E⟧ التدفق الساقط على وحدة المساحة بوحدة اللوكس ⟦lx = lm/m^{2}⟧: ⟦E = P/(4πr^{2})⟧ لسطح عمودي على الضوء من مصدر نقطي. الاستضاءة تتناسب عكسيًا مع مربع البعد.</p>
<div class="box ex"><b>✎ مثال</b>إذا ابتعد كتاب عن مصباح من ⟦1 m⟧ إلى ⟦2 m⟧ فماذا يحدث لاستضاءته؟<span class="sol">الحل: ⟦E ∝ 1/r^{2}⟧ فتصبح ربع ما كانت.</span></div>`,
 q: [['إذا ضاعفنا البعد بين سطح ومصباح فإن الاستضاءة', ['تتضاعف', 'تقل للنصف', 'تقل للربع', 'لا تتغير'], 2, '⟦E = P/(4πr^{2})⟧.']] },
 { h: 'اللون والاستقطاب', html: `
<p>الضوء الأبيض مزيج من ألوان الطيف. <b>الألوان الأساسية للضوء</b>: الأحمر والأخضر والأزرق، ومجموعها أبيض. والألوان الثانوية: الأصفر (أحمر + أخضر)، والسيان (أخضر + أزرق)، والماجنتا (أحمر + أزرق). واللونان المتتامان مجموعهما أبيض (الأصفر والأزرق). <b>الأصباغ</b> تمتص ألوانًا وتعكس غيرها، وأصباغها الأساسية: السيان والماجنتا والأصفر. يبدو الجسم أحمر لأنه يعكس الأحمر ويمتص الباقي.</p>
<p><b>الاستقطاب:</b> الضوء العادي تهتز مجالاته في كل المستويات، والمستقطب يهتز في مستوى واحد. يثبت الاستقطاب أن الضوء <b>موجات مستعرضة</b>. وقانون مالوس: ⟦I_{2} = I_{1} cos^{2}θ⟧؛ مرشحان متعامدان ⟦(θ = 90°)⟧ يمنعان الضوء كليًا. وتستعمل النظارات المستقطبة لتقليل الوهج المنعكس.</p>`,
 q: [['مجموع الضوء الأحمر والأخضر يعطي', ['الأبيض', 'الأصفر', 'السيان', 'الماجنتا'], 1, 'أحمر + أخضر = أصفر.'],
     ['ظاهرة الاستقطاب تثبت أن الضوء', ['جسيمات', 'موجات طولية', 'موجات مستعرضة', 'يحتاج وسطًا'], 2, 'الموجات الطولية لا تُستقطب.']] }],
 cards: [['سرعة الضوء', '⟦c = 3×10^{8} m/s⟧'], ['الاستضاءة', '⟦E = P/(4πr^{2})⟧ ⟦(lx)⟧'], ['الألوان الأساسية للضوء', 'أحمر، أخضر، أزرق'], ['الأصباغ الأساسية', 'سيان، ماجنتا، أصفر'], ['الاستقطاب يثبت', 'الضوء موجات مستعرضة'], ['قانون مالوس', '⟦I_{2} = I_{1} cos^{2}θ⟧']] },

{ n: '6-2', t: 'الانعكاس والمرايا', parts: [
 { h: 'قانون الانعكاس والمرآة المستوية', html: `
<p><b>قانون الانعكاس:</b> ⟦θ_{r} = θ_{i}⟧، والزاويتان تقاسان من <b>العمود المقام</b> على السطح، والشعاع الساقط والمنعكس والعمود في مستوى واحد. الانعكاس <b>المنتظم</b> عن سطح أملس يكوّن صورًا، و<b>غير المنتظم</b> عن سطح خشن يشتت الضوء.</p>
<p><b>المرآة المستوية:</b> الصورة تقديرية (لا تُستقبل على حاجز)، معتدلة، مساوية للجسم، معكوسة جانبيًا، و⟦d_{i} = d_{o}⟧. فالمسافة بين الجسم وصورته ⟦2d_{o}⟧. والزاوية بين الشعاع الساقط والمنعكس ⟦2θ_{i}⟧.</p>`,
 q: [['سقط شعاع على مرآة مستوية بزاوية ⟦35°⟧ مع سطحها. زاوية الانعكاس', ['⟦35°⟧', '⟦55°⟧', '⟦70°⟧', '⟦110°⟧'], 1, 'الزاوية مع السطح ⟦35°⟧ ⇐ مع العمود ⟦55°⟧.']] },
 { h: 'المرايا الكروية', html: `
<p><b>المرآة المقعرة</b> (مجمّعة): تجمع الأشعة الموازية للمحور الرئيس في البؤرة F. <b>المحدبة</b> (مفرّقة): تفرقها كأنها صادرة من بؤرة خلفها. البعد البؤري ⟦f = r/2⟧.</p>
<p><b>معادلة المرايا:</b> ⟦1/f = 1/d_{i} + 1/d_{o}⟧، و<b>التكبير</b> ⟦m = h_{i}/h_{o} = −d_{i}/d_{o}⟧. الإشارات: ⟦d_{i}⟧ موجب للصورة الحقيقية (أمام المرآة) وسالب للتقديرية، و f سالب للمرآة المحدبة، وm سالب ⇐ صورة مقلوبة.</p>
<table class="tbl"><tr><th>موضع الجسم أمام المرآة المقعرة</th><th>الصورة</th></tr>
<tr><td>أبعد من مركز التكور C ⟦(d_{o} > 2f)⟧</td><td>حقيقية مقلوبة مصغرة بين F وC</td></tr>
<tr><td>عند C ⟦(d_{o} = 2f)⟧</td><td>حقيقية مقلوبة مساوية عند C</td></tr>
<tr><td>بين C وF</td><td>حقيقية مقلوبة مكبرة أبعد من C</td></tr>
<tr><td>عند البؤرة</td><td>لا تتكون صورة (أشعة متوازية)</td></tr>
<tr><td>بين البؤرة والمرآة</td><td>تقديرية معتدلة مكبرة (مرآة الحلاقة والتجميل)</td></tr></table>
<p>المرآة المحدبة تكوّن دائمًا صورة <b>تقديرية معتدلة مصغرة</b>، وتعطي مجال رؤية واسعًا (مرايا السيارات الجانبية ومرايا المراقبة). والمقعرة تُستعمل في عواكس المصابيح (المصباح في البؤرة) والتلسكوبات العاكسة. و<b>الزيغ الكروي</b> عدم تجمع الأشعة في نقطة واحدة في المرايا الكروية، ويُعالج بالمرايا القطعية المكافئة.</p>
<div class="box ex"><b>✎ مثال</b>جسم طوله ⟦2 cm⟧ على بعد ⟦30 cm⟧ من مرآة مقعرة بعدها البؤري ⟦10 cm⟧. أين الصورة وما طولها؟<span class="sol">الحل: ⟦1/d_{i} = 1/10 − 1/30 = 2/30 ⇒ d_{i} = 15 cm⟧ (حقيقية). ⟦m = −15/30 = −0.5⟧ ⇒ ⟦h_{i} = −1 cm⟧ (مقلوبة مصغرة).</span></div>`,
 q: [['جسم على بعد ⟦20 cm⟧ من مرآة مقعرة بعدها البؤري ⟦10 cm⟧. الصورة', ['تقديرية مكبرة', 'حقيقية مقلوبة مساوية على بعد ⟦20 cm⟧', 'حقيقية مصغرة على بعد ⟦10 cm⟧', 'لا تتكون'], 1, 'الجسم عند مركز التكور ⟦(2f)⟧ ⇐ ⟦d_{i} = 20 cm⟧ و⟦m = −1⟧.']] }],
 cards: [['قانون الانعكاس', '⟦θ_{r} = θ_{i}⟧ من العمود المقام'], ['صورة المرآة المستوية', 'تقديرية معتدلة مساوية، ⟦d_{i} = d_{o}⟧'], ['البعد البؤري للمرآة', '⟦f = r/2⟧'], ['معادلة المرايا', '⟦1/f = 1/d_{i} + 1/d_{o}⟧'], ['التكبير', '⟦m = h_{i}/h_{o} = −d_{i}/d_{o}⟧'], ['المرآة المحدبة', 'تقديرية معتدلة مصغرة دائمًا'], ['جسم بين البؤرة والمقعرة', 'تقديرية معتدلة مكبرة'], ['جسم عند البؤرة', 'لا تتكون صورة']] },

{ n: '6-3', t: 'الانكسار', parts: [
 { h: 'قانون سنل ومعامل الانكسار', html: `
<p><b>الانكسار</b> تغير اتجاه الضوء عند انتقاله مائلًا بين وسطين لتغير سرعته. <b>معامل الانكسار</b> ⟦n = c/v⟧ وهو أكبر من 1 لأي وسط مادي (الهواء ⟦≈ 1⟧، الماء ⟦1.33⟧، الزجاج ⟦≈ 1.5⟧، الألماس ⟦2.42⟧).</p>
<p><b>قانون سنل:</b> ⟦n_{1} sinθ_{1} = n_{2} sinθ_{2}⟧. من وسط أقل n إلى أكبر ينكسر الشعاع <b>مقتربًا من العمود المقام</b>، وبالعكس يبتعد عنه. والشعاع العمودي على السطح لا ينكسر. وعند الانتقال يبقى التردد ثابتًا ويقصر الطول الموجي في الوسط الأكبر n: ⟦λ_{وسط} = λ_{0}/n⟧.</p>
<div class="box ex"><b>✎ مثال</b>سقط شعاع من الهواء على زجاج ⟦(n = 1.5)⟧ بزاوية ⟦30°⟧. ما زاوية الانكسار؟ وما سرعة الضوء في الزجاج؟<span class="sol">الحل: ⟦sin θ_{2} = 0.5/1.5 = 1/3 ⇒ θ_{2} ≈ 19.5°⟧. و⟦v = 3×10^{8}/1.5 = 2×10^{8} m/s⟧.</span></div>
<p><b>العمق الظاهري:</b> يبدو قاع البركة أقرب مما هو بسبب الانكسار: العمق الظاهري ⟦≈⟧ الحقيقي ÷ n (للنظر العمودي).</p>`,
 q: [['ينتقل الضوء من الماء إلى الهواء بشكل مائل، فإنه ينكسر', ['مقتربًا من العمود', 'مبتعدًا عن العمود', 'دون انحراف', 'منعكسًا كليًا دائمًا'], 1, 'من n أكبر إلى أصغر ⇐ يبتعد عن العمود.']] },
 { h: 'الانعكاس الكلي الداخلي والتفريق', html: `
<p>عند انتقال الضوء من وسط أكبر n إلى أصغر، تكون <b>الزاوية الحرجة</b> ⟦θ_{c}⟧ هي زاوية السقوط التي تجعل زاوية الانكسار ⟦90°⟧: ⟦sin θ_{c} = n_{2}/n_{1}⟧. إذا زادت زاوية السقوط عنها حدث <b>الانعكاس الكلي الداخلي</b>. شرطاه: (1) من الأكبر n إلى الأصغر، (2) زاوية سقوط أكبر من الحرجة. تطبيقاته: الألياف البصرية، ولمعان الألماس، والمناشير العاكسة. و<b>السراب</b> انكسار تدريجي وانعكاس للضوء في طبقات هواء ساخنة مختلفة الكثافة قرب الأرض.</p>
<p><b>التفريق (التشتت):</b> معامل الانكسار يختلف باختلاف الطول الموجي، فيتحلل الضوء الأبيض في المنشور إلى ألوانه؛ البنفسجي أكثرها انحرافًا والأحمر أقلها. وقوس المطر تفريق وانعكاس للضوء في قطرات الماء.</p>
<div class="box ex"><b>✎ مثال</b>ما الزاوية الحرجة بين الماس ⟦(n = 2)⟧ والهواء؟<span class="sol">الحل: ⟦sin θ_{c} = 1/2 ⇒ θ_{c} = 30°⟧.</span></div>`,
 q: [['تعمل الألياف البصرية بفضل', ['الانكسار فقط', 'الانعكاس الكلي الداخلي', 'الحيود', 'الاستقطاب'], 1, 'الضوء ينعكس كليًا داخل الليف.']] }],
 cards: [['معامل الانكسار', '⟦n = c/v⟧ ⟦(> 1)⟧'], ['قانون سنل', '⟦n_{1} sinθ_{1} = n_{2} sinθ_{2}⟧'], ['من الأقل n إلى الأكبر', 'يقترب من العمود'], ['الزاوية الحرجة', '⟦sin θ_{c} = n_{2}/n_{1}⟧'], ['شرطا الانعكاس الكلي', 'من الأكبر n إلى الأصغر، وزاوية > الحرجة'], ['السراب', 'انكسار في طبقات هواء مختلفة الكثافة'], ['أكثر الألوان انحرافًا في المنشور', 'البنفسجي']] },

{ n: '6-4', t: 'العدسات والأجهزة البصرية', parts: [
 { h: 'العدسات المحدبة والمقعرة', html: `
<p><b>العدسة المحدبة</b> (مجمّعة) سميكة في الوسط، تجمع الأشعة الموازية في بؤرتها. <b>المقعرة</b> (مفرّقة) رقيقة في الوسط، تفرق الأشعة. نستعمل المعادلتين نفسيهما: ⟦1/f = 1/d_{i} + 1/d_{o}⟧ و⟦m = h_{i}/h_{o} = −d_{i}/d_{o}⟧، وf سالب للعدسة المقعرة، و⟦d_{i}⟧ موجب للصورة الحقيقية (خلف العدسة).</p>
<ul><li>المحدبة والجسم أبعد من البؤرة: صورة حقيقية مقلوبة (آلة التصوير، جهاز العرض).</li>
<li>المحدبة والجسم بين البؤرة والعدسة: صورة تقديرية معتدلة مكبرة (العدسة المكبرة).</li>
<li>المقعرة: صورة تقديرية معتدلة مصغرة دائمًا.</li></ul>
<p><b>الزيغ اللوني:</b> اختلاف بؤر الألوان في العدسة بسبب التفريق، ويُصحح بالعدسة اللالونية (عدستان من نوعين من الزجاج).</p>
<div class="box ex"><b>✎ مثال</b>جسم على بعد ⟦6 cm⟧ من عدسة محدبة بعدها البؤري ⟦12 cm⟧. صف الصورة.<span class="sol">الحل: ⟦1/d_{i} = 1/12 − 1/6 = −1/12 ⇒ d_{i} = −12 cm⟧ (تقديرية)، ⟦m = −(−12)/6 = 2⟧: معتدلة مكبرة مرتين.</span></div>`,
 q: [['جسم على بعد ⟦30 cm⟧ من عدسة محدبة بعدها البؤري ⟦15 cm⟧. بعد الصورة', ['⟦15 cm⟧', '⟦30 cm⟧', '⟦10 cm⟧', '⟦45 cm⟧'], 1, '⟦1/d_{i} = 1/15 − 1/30 = 1/30⟧ (الجسم عند ⟦2f⟧).']] },
 { h: 'العين وتصحيح النظر والأجهزة البصرية', html: `
<p>في <b>العين</b> تكوّن القرنية والعدسة صورة حقيقية مقلوبة على الشبكية، وتغير العضلات الهدبية تحدب العدسة لتغيير بعدها البؤري (التكيف).</p>
<table class="tbl"><tr><th>العيب</th><th>أين تتكون الصورة؟</th><th>التصحيح</th></tr>
<tr><td>قصر النظر (يرى القريب بوضوح)</td><td>أمام الشبكية</td><td>عدسة مقعرة (مفرّقة)</td></tr>
<tr><td>طول النظر (يرى البعيد بوضوح)</td><td>خلف الشبكية</td><td>عدسة محدبة (مجمّعة)</td></tr></table>
<p><b>المجهر</b>: عدستان محدبتان (شيئية بعدها البؤري صغير وعينية)، والتكبير الكلي حاصل ضرب تكبيريهما. <b>التلسكوب الكاسر</b>: شيئية بعدها البؤري كبير وعينية. و<b>المنظار</b> يستعمل منشورين للانعكاس الكلي لتعديل الصورة وتقصير الجهاز.</p>`,
 q: [['يُصحَّح قصر النظر بعدسة', ['محدبة', 'مقعرة', 'أسطوانية', 'مستوية'], 1, 'الصورة أمام الشبكية فنحتاج عدسة مفرّقة.']] }],
 cards: [['العدسة المحدبة', 'مجمّعة، سميكة في الوسط'], ['العدسة المقعرة', 'مفرّقة، صورة تقديرية مصغرة دائمًا'], ['معادلة العدسات', '⟦1/f = 1/d_{i} + 1/d_{o}⟧'], ['f للعدسة المقعرة', 'سالب'], ['العدسة المكبرة', 'محدبة والجسم بين البؤرة والعدسة'], ['قصر النظر', 'صورة أمام الشبكية، عدسة مقعرة'], ['طول النظر', 'صورة خلف الشبكية، عدسة محدبة'], ['الزيغ اللوني', 'يُصحح بالعدسة اللالونية']] },

{ n: '6-5', t: 'التداخل والحيود', parts: [
 { h: 'التداخل', html: `
<p>يحدث التداخل للضوء <b>المترابط</b> (موجات متفقة في الطور، مثل الليزر). <b>تجربة الشق المزدوج ليونج</b> أثبتت الطبيعة الموجية للضوء: تظهر هدب مضيئة (تداخل بنّاء) ومعتمة (هدام). والطول الموجي: ⟦λ = xd/L⟧، حيث x المسافة بين الهدبة المركزية والهدبة المضيئة الأولى، وd المسافة بين الشقين، وL البعد عن الشاشة. فاستعمال ضوء أطول موجيًا (أحمر) يباعد الهدب.</p>
<p><b>التداخل في الأغشية الرقيقة:</b> تتداخل الأشعة المنعكسة عن السطحين الأمامي والخلفي للغشاء، فتظهر ألوان فقاعات الصابون وبقع الزيت، وتعتمد على سمك الغشاء. والانعكاس عن وسط أكبر n يقلب الموجة.</p>`,
 q: [['ألوان فقاعات الصابون سببها', ['الانكسار فقط', 'التداخل في الأغشية الرقيقة', 'الاستقطاب', 'الحيود'], 1, 'تداخل الأشعة المنعكسة عن سطحي الغشاء.']] },
 { h: 'الحيود ومحزوز الحيود وقوة التمييز', html: `
<p><b>الحيود</b> انحناء الضوء حول حواف العوائق والفتحات. في حيود <b>الشق المفرد</b> تكون الهدبة المركزية مضيئة وعريضة، وعرضها ⟦2x_{1} = 2λL/w⟧ (w عرض الشق)؛ فكلما ضاق الشق اتسع نمط الحيود.</p>
<p><b>محزوز الحيود</b> عدد كبير من الشقوق المتقاربة يعطي هدبًا حادة: ⟦λ = d sin θ⟧، ويُستعمل في مطياف لقياس الأطوال الموجية بدقة.</p>
<p><b>قوة التمييز:</b> الحيود يحد من قدرة العدسة أو العين على التمييز بين جسمين متقاربين (معيار رايلي)؛ والفتحة الأكبر والطول الموجي الأقصر تعطيان قوة تمييز أفضل.</p>`,
 q: [['عند تضييق عرض الشق المفرد فإن الهدبة المركزية', ['تضيق', 'تتسع', 'تختفي', 'لا تتغير'], 1, '⟦2x_{1} = 2λL/w⟧: عرض أقل ⇐ هدبة أعرض.']] }],

COURSE.units.push({ id: 'u7', week: 4, num: '7', title: 'الكهرباء الساكنة والتيار الكهربائي', en: 'Electrostatics & Electric Current', d: 6, ex: ['7.1', '7.2'],
sub: 'الشحنة وقانون كولوم، المجال وفرق الجهد، المكثفات، التيار وقانون أوم والقدرة، دوائر التوالي والتوازي والسلامة الكهربائية',
lessons: [
{ n: '7-1', t: 'الشحنة الكهربائية وقانون كولوم', parts: [
 { h: 'الشحنة والشحن', html: `
<p>للشحنة نوعان: موجبة وسالبة؛ <b>المتشابهة تتنافر والمختلفة تتجاذب</b>. الشحنة <b>محفوظة</b> (لا تفنى ولا تستحدث بل تنتقل)، و<b>مكمّاة</b>: أي شحنة مضاعفات صحيحة لشحنة الإلكترون ⟦e = 1.6×10^{−19} C⟧. وحدة الشحنة الكولوم ⟦C⟧.</p>
<p>عند الدلك تنتقل <b>الإلكترونات</b> (لا البروتونات المقيدة في النوى)؛ فالجسم الذي يكتسب إلكترونات يصبح سالبًا، والذي يفقدها موجبًا.</p>
<p><b>الموصلات</b> (الفلزات) تتحرك فيها الإلكترونات بحرية، و<b>العوازل</b> (البلاستيك، الزجاج، المطاط) لا تتحرك فيها. وتتوزع الشحنات الزائدة على <b>السطح الخارجي</b> للموصل وتتركز عند الأطراف المدببة.</p>
<p><b>طرق الشحن:</b> الدلك، و<b>التوصيل</b> (بالتلامس، فيكتسب الجسم شحنة من نوع شحنة الجسم المشحون)، و<b>الحث</b> (تقريب جسم مشحون دون تلامس مع التأريض، فيكتسب الجسم شحنة معاكسة). و<b>الكشاف الكهربائي</b> يكشف عن وجود الشحنة ونوعها، وتنفرج ورقتاه لأنهما تحملان شحنة من النوع نفسه. و<b>التأريض</b> توصيل الجسم بالأرض لتفريغ شحنته.</p>`,
 q: [['عند شحن جسم بالحث فإنه يكتسب شحنة', ['من نوع شحنة الجسم المؤثر', 'معاكسة لشحنة الجسم المؤثر', 'متعادلة دائمًا', 'موجبة دائمًا'], 1, 'في الحث تكون الشحنة المكتسبة معاكسة.'],
     ['كم إلكترونًا يجب إزالتها من جسم ليصبح شحنته ⟦+3.2×10^{−19} C⟧؟', ['1', '2', '3', '32'], 1, '⟦3.2×10^{−19}/1.6×10^{−19} = 2⟧.']] },
 { h: 'قانون كولوم', html: `
<p>القوة بين شحنتين نقطيتين: ⟦F = K q_{A}q_{B}/r^{2}⟧، حيث ⟦K = 9×10^{9} N·m^{2}/C^{2}⟧. القوة تتناسب طرديًا مع حاصل ضرب الشحنتين وعكسيًا مع <b>مربع المسافة</b>، وتؤثر على امتداد الخط الواصل بينهما. وإذا أثرت عدة شحنات في شحنة نجمع القوى جمعًا متجهًا.</p>
<div class="box ex"><b>✎ مثال</b>شحنتان ⟦2 μC⟧ و⟦3 μC⟧ المسافة بينهما ⟦0.3 m⟧. ما القوة بينهما؟<span class="sol">الحل: ⟦F = 9×10^{9}×(2×10^{−6})(3×10^{−6})/0.09 = 0.6 N⟧ تنافرًا.</span></div>`,
 q: [['إذا تضاعفت كل من الشحنتين وتضاعفت المسافة بينهما فإن القوة', ['تتضاعف', 'تبقى ثابتة', 'تصبح أربعة أمثالها', 'تقل للنصف'], 1, '⟦(2×2)/2^{2} = 1⟧.']] }],
 cards: [['الشحنات المتشابهة', 'تتنافر'], ['شحنة الإلكترون', '⟦1.6×10^{−19} C⟧'], ['ما الذي ينتقل عند الدلك؟', 'الإلكترونات'], ['الشحن بالتوصيل', 'الشحنة من نوع الجسم المؤثر'], ['الشحن بالحث', 'شحنة معاكسة'], ['الشحنات الزائدة على موصل', 'على سطحه الخارجي'], ['قانون كولوم', '⟦F = K q_{A}q_{B}/r^{2}⟧'], ['⟦K⟧', '⟦9×10^{9} N·m^{2}/C^{2}⟧']] },

{ n: '7-2', t: 'المجال الكهربائي وفرق الجهد', parts: [
 { h: 'المجال الكهربائي', html: `
<p><b>المجال الكهربائي</b> عند نقطة: القوة المؤثرة في وحدة الشحنات من شحنة اختبار موجبة صغيرة ⟦q′⟧: ⟦E = F/q′⟧، بوحدة ⟦N/C⟧، واتجاهه اتجاه القوة على الشحنة الموجبة. فالقوة على أي شحنة q في المجال ⟦F = qE⟧ (على الإلكترون عكس المجال).</p>
<p><b>خطوط المجال</b> تخرج من الشحنة الموجبة وتدخل في السالبة، لا تتقاطع، وتقاربها يدل على مجال أقوى. وبين لوحين متوازيين مشحونين مجال منتظم.</p>`,
 q: [['شحنة ⟦2 μC⟧ في مجال ⟦5000 N/C⟧. القوة عليها', ['⟦0.01 N⟧', '⟦2500 N⟧', '⟦10 N⟧', '⟦0.001 N⟧'], 0, '⟦F = qE = 2×10^{−6}×5000 = 0.01 N⟧.']] },
 { h: 'فرق الجهد وتجربة مليكان', html: `
<p><b>فرق الجهد الكهربائي</b> الشغل المبذول لنقل وحدة الشحنات بين نقطتين: ⟦ΔV = W/q′⟧، ووحدته الفولت ⟦V = J/C⟧. وفي <b>مجال منتظم</b>: ⟦ΔV = Ed⟧. وسطوح تساوي الجهد لا يُبذل شغل لتحريك شحنة عليها. وجهد الأرض يُعد صفرًا مرجعيًا.</p>
<p><b>تجربة قطرة الزيت لمليكان</b> قاست شحنة الإلكترون: قطرة مشحونة معلقة بين لوحين تتزن حين ⟦qE = mg⟧، فوجد أن الشحنات مضاعفات ⟦1.6×10^{−19} C⟧.</p>
<div class="box ex"><b>✎ مثال</b>لوحان متوازيان بينهما ⟦0.02 m⟧ وفرق جهد ⟦100 V⟧. ما المجال بينهما؟<span class="sol">الحل: ⟦E = ΔV/d = 100/0.02 = 5000 N/C⟧.</span></div>`,
 q: [['الشغل اللازم لنقل شحنة ⟦3 C⟧ عبر فرق جهد ⟦12 V⟧', ['⟦4 J⟧', '⟦36 J⟧', '⟦15 J⟧', '⟦0.25 J⟧'], 1, '⟦W = qΔV = 36 J⟧.']] },
 { h: 'المكثفات', html: `
<p><b>المكثف</b> أداة لتخزين الشحنة (والطاقة)، يتكون من موصلين بينهما عازل. <b>السعة الكهربائية</b> ⟦C = q/ΔV⟧ بوحدة الفاراد ⟦F⟧، وتُستعمل أجزاؤه ⟦μF⟧ و⟦pF⟧. تعتمد السعة على مساحة اللوحين والمسافة بينهما ونوع العازل، لا على الشحنة أو الجهد.</p>
<div class="box ex"><b>✎ مثال</b>مكثف ⟦4 μF⟧ وُصل بفرق جهد ⟦9 V⟧. ما شحنته؟<span class="sol">الحل: ⟦q = CΔV = 4×9 = 36 μC⟧.</span></div>`,
 q: [['إذا تضاعف فرق الجهد بين لوحي مكثف فإن سعته', ['تتضاعف', 'تقل للنصف', 'لا تتغير', 'تصبح أربعة أمثالها'], 2, 'السعة خاصية للمكثف نفسه؛ الذي يتضاعف هو الشحنة.']] }],
 cards: [['المجال الكهربائي', '⟦E = F/q′⟧ ⟦(N/C)⟧'], ['خطوط المجال', 'تخرج من الموجبة وتدخل في السالبة'], ['فرق الجهد', '⟦ΔV = W/q′⟧ ⟦(V = J/C)⟧'], ['مجال منتظم', '⟦ΔV = Ed⟧'], ['تجربة مليكان', 'قياس شحنة الإلكترون'], ['السعة', '⟦C = q/ΔV⟧ ⟦(F)⟧']] },

{ n: '7-3', t: 'التيار الكهربائي وقانون أوم والقدرة', parts: [
 { h: 'التيار والدائرة الكهربائية', html: `
<p><b>التيار الكهربائي</b> معدل تدفق الشحنة: ⟦I = q/t⟧ بوحدة الأمبير ⟦A = C/s⟧. <b>التيار الاصطلاحي</b> يتجه من الطرف الموجب إلى السالب خارج المصدر (عكس حركة الإلكترونات). يتطلب مرور التيار دائرة <b>مغلقة</b> ومصدر فرق جهد (بطارية تحول الطاقة الكيميائية إلى كهربائية، أو خلية شمسية، أو مولد).</p>
<div class="box ex"><b>✎ مثال</b>يمر ⟦0.5 A⟧ في مصباح مدة دقيقتين. كم كولومًا تمر؟<span class="sol">الحل: ⟦q = It = 0.5×120 = 60 C⟧.</span></div>`,
 q: [['تمر ⟦30 C⟧ في سلك خلال ⟦10 s⟧. التيار', ['⟦3 A⟧', '⟦300 A⟧', '⟦0.33 A⟧', '⟦40 A⟧'], 0, '⟦I = 30/10 = 3 A⟧.']] },
 { h: 'المقاومة وقانون أوم', html: `
<p><b>المقاومة</b> ممانعة الموصل لمرور التيار: ⟦R = ΔV/I⟧ بوحدة الأوم ⟦Ω = V/A⟧. يكون الموصل <b>أوميًا</b> إذا كانت مقاومته ثابتة عند تغير الجهد (منحنى ⟦I–ΔV⟧ خط مستقيم ميله ⟦1/R⟧).</p>
<p>تعتمد المقاومة على: الطول (طرديًا)، ومساحة المقطع (عكسيًا)، ونوع المادة (المقاومية ⟦ρ⟧)، ودرجة الحرارة (تزداد مقاومة الفلزات بارتفاعها): ⟦R = ρL/A⟧. و<b>الموصلات فائقة التوصيل</b> مقاومتها صفر عند درجات حرارة منخفضة جدًا.</p>
<div class="box ex"><b>✎ مثال</b>سلك مقاومته ⟦8 Ω⟧ ضوعف طوله وضوعفت مساحة مقطعه. ما مقاومته الجديدة؟<span class="sol">الحل: ⟦R ∝ L/A ⇒ 8 × 2/2 = 8 Ω⟧. ولو ضوعف الطول فقط لصارت ⟦16 Ω⟧.</span></div>`,
 q: [['مصباح يمر فيه ⟦0.5 A⟧ عند ⟦12 V⟧. مقاومته', ['⟦6 Ω⟧', '⟦24 Ω⟧', '⟦12.5 Ω⟧', '⟦0.04 Ω⟧'], 1, '⟦R = 12/0.5 = 24 Ω⟧.']] },
 { h: 'القدرة والطاقة الكهربائية', html: `
<p>القدرة الكهربائية: ⟦P = IΔV = I^{2}R = (ΔV)^{2}/R⟧ بالواط. والطاقة المستهلكة ⟦E = Pt = I^{2}Rt⟧. تتحول الطاقة في المقاومة إلى حرارة (المدفأة، السخان، الكاوي).</p>
<p>شركات الكهرباء تحاسب بـ <b>الكيلوواط·ساعة</b> ⟦kWh⟧ (طاقة جهاز قدرته ⟦1 kW⟧ يعمل ساعة) ⟦= 3.6×10^{6} J⟧. التكلفة = ⟦kWh⟧ × سعر الوحدة. ولتقليل الفقد في خطوط النقل يُرفع الجهد ويُخفض التيار لأن الفقد ⟦I^{2}R⟧.</p>
<div class="box ex"><b>✎ مثال</b>سخان ⟦2 kW⟧ يعمل ⟦3 h⟧ يوميًا مدة ⟦30⟧ يومًا، وسعر الكيلوواط·ساعة ⟦18⟧ هللة. ما التكلفة؟<span class="sol">الحل: ⟦E = 2×3×30 = 180 kWh⟧، والتكلفة ⟦180×18 = 3240⟧ هللة ⟦= 32.4⟧ ريالًا.</span></div>`,
 q: [['جهاز يعمل على ⟦220 V⟧ ويمر فيه ⟦5 A⟧. قدرته', ['⟦44 W⟧', '⟦1100 W⟧', '⟦225 W⟧', '⟦11000 W⟧'], 1, '⟦P = IΔV = 5×220 = 1100 W⟧.']] }],
 cards: [['التيار', '⟦I = q/t⟧ ⟦(A)⟧'], ['التيار الاصطلاحي', 'من الموجب إلى السالب خارج المصدر'], ['قانون أوم', '⟦R = ΔV/I⟧'], ['المقاومة والأبعاد', '⟦R = ρL/A⟧'], ['القدرة الكهربائية', '⟦P = IΔV = I^{2}R = (ΔV)^{2}/R⟧'], ['الطاقة الكهربائية', '⟦E = Pt⟧'], ['⟦1 kWh⟧', '⟦3.6×10^{6} J⟧'], ['فائق التوصيل', 'مقاومته صفر']] },

{ n: '7-4', t: 'دوائر التوالي والتوازي', parts: [
 { h: 'التوالي والتوازي', html: `
<table class="tbl"><tr><th></th><th>التوالي</th><th>التوازي</th></tr>
<tr><td>التيار</td><td>واحد في كل الأجزاء</td><td>يتجزأ: ⟦I = I_{1} + I_{2} + …⟧</td></tr>
<tr><td>فرق الجهد</td><td>يتجزأ: ⟦ΔV = ΔV_{1} + ΔV_{2} + …⟧</td><td>واحد على كل الفروع</td></tr>
<tr><td>المقاومة المكافئة</td><td>⟦R = R_{1} + R_{2} + …⟧ (أكبر من أكبرها)</td><td>⟦1/R = 1/R_{1} + 1/R_{2} + …⟧ (أقل من أصغرها)</td></tr>
<tr><td>إضافة مقاومة</td><td>تزيد المقاومة ويقل التيار</td><td>تقل المقاومة ويزداد التيار الكلي</td></tr>
<tr><td>تعطل أحد المصابيح</td><td>تنطفئ كلها</td><td>تبقى البقية مضاءة</td></tr></table>
<p>لمقاومتين على التوازي: ⟦R = R_{1}R_{2}/(R_{1} + R_{2})⟧، ولـ n مقاومات متساوية ⟦R/n⟧. وتوصيلات المنازل على التوازي.</p>
<p><b>مجزئ الجهد</b> (مقاومتان على التوالي): ⟦ΔV_{B} = ΔV_{المصدر} R_{B}/(R_{A} + R_{B})⟧.</p>
<div class="box ex"><b>✎ مثال: دائرة مركبة</b>مقاومتان ⟦6 Ω⟧ و⟦3 Ω⟧ على التوازي، ومعهما ⟦4 Ω⟧ على التوالي، والمصدر ⟦12 V⟧. ما التيار الكلي؟<span class="sol">الحل: التوازي ⟦6×3/9 = 2 Ω⟧، والكلية ⟦2 + 4 = 6 Ω⟧، و⟦I = 12/6 = 2 A⟧. فرق الجهد على مجموعة التوازي ⟦2×2 = 4 V⟧، فيمر في ⟦6 Ω⟧ ⟦0.67 A⟧ وفي ⟦3 Ω⟧ ⟦1.33 A⟧.</span></div>`,
 q: [['ثلاث مقاومات كل منها ⟦9 Ω⟧ على التوازي. مقاومتها المكافئة', ['⟦27 Ω⟧', '⟦9 Ω⟧', '⟦3 Ω⟧', '⟦1/3 Ω⟧'], 2, '⟦9/3 = 3 Ω⟧.'],
     ['في دائرة توالٍ، المقاومة التي يكون فرق الجهد عليها أكبر هي', ['الأصغر', 'الأكبر', 'كلها متساوية', 'الأقرب إلى البطارية'], 1, 'التيار واحد و⟦ΔV = IR⟧.']] },
 { h: 'أجهزة القياس والسلامة الكهربائية', html: `
<ul><li><b>الأميتر</b> يقيس التيار، يوصل <b>على التوالي</b>، مقاومته صغيرة جدًا.</li>
<li><b>الفولتميتر</b> يقيس فرق الجهد، يوصل <b>على التوازي</b>، مقاومته كبيرة جدًا.</li>
<li><b>المنصهر (الفيوز)</b> سلك ينصهر، و<b>القاطع الكهربائي</b> مفتاح آلي يفتح الدائرة، كلاهما عند زيادة التيار عن الحد الآمن.</li>
<li><b>قاطع التفريغ الأرضي (GFCI)</b> يفتح الدائرة عند اختلاف التيار الداخل عن الخارج (تسرب)، ويُستعمل في الحمامات والمطابخ.</li>
<li><b>دائرة القصر</b>: مسار مقاومته صغيرة جدًا فيمر تيار كبير خطر.</li></ul>`,
 q: [['يُوصل الفولتميتر في الدائرة', ['على التوالي ومقاومته صغيرة', 'على التوازي ومقاومته كبيرة', 'على التوالي ومقاومته كبيرة', 'على التوازي ومقاومته صغيرة'], 1, 'كي لا يسحب تيارًا يغير قراءة الدائرة.']] }],
 cards: [['التوالي', 'التيار واحد، الجهد يتجزأ'], ['التوازي', 'الجهد واحد، التيار يتجزأ'], ['مكافئ التوالي', '⟦R = R_{1} + R_{2}⟧'], ['مكافئ التوازي', '⟦1/R = 1/R_{1} + 1/R_{2}⟧'], ['n مقاومات متساوية على التوازي', '⟦R/n⟧'], ['مجزئ الجهد', '⟦ΔV_{B} = ΔV R_{B}/(R_{A} + R_{B})⟧'], ['الأميتر', 'توالٍ، مقاومة صغيرة'], ['الفولتميتر', 'توازٍ، مقاومة كبيرة'], ['GFCI', 'يفصل عند اختلاف التيار الداخل عن الخارج']] }
]});

sub: 'المغانط والمجالات وقواعد اليد اليمنى، القوى المغناطيسية والمحرك، الحث والمولد، المحولات والتيار المتردد، الكهرومغناطيسية',
lessons: [
{ n: '8-1', t: 'المغانط والمجالات المغناطيسية', parts: [
 { h: 'المغانط', html: `
<p>للمغناطيس قطبان: شمالي (N) وجنوبي (S)، ولا يوجد قطب منفرد؛ إذا كُسر مغناطيس صار كل جزء مغناطيسًا كاملًا. <b>الأقطاب المتشابهة تتنافر والمختلفة تتجاذب</b>. والإبرة المغناطيسية (البوصلة) يتجه قطبها الشمالي نحو القطب الجغرافي الشمالي للأرض، الذي هو مغناطيسيًا قطب جنوبي.</p>
<p><b>خطوط المجال المغناطيسي</b> خارج المغناطيس تتجه من الشمالي إلى الجنوبي، وداخله من الجنوبي إلى الشمالي، فهي حلقات مغلقة، وتقاربها يدل على مجال أقوى. وحدة المجال التسلا ⟦T = N/(A·m)⟧، والتدفق المغناطيسي عدد الخطوط التي تخترق سطحًا.</p>
<p><b>المواد المغناطيسية</b> (الحديد، النيكل، الكوبالت) فيها <b>مناطق مغناطيسية</b> صغيرة تترتب في اتجاه واحد عند المغنطة. والمغناطيس المؤقت (حديد مطاوع) يفقد مغناطيسيته بزوال المؤثر، والدائم يحتفظ بها.</p>`,
 q: [['إذا كُسر مغناطيس مستقيم إلى نصفين فإن', ['أحدهما شمالي والآخر جنوبي', 'كل نصف مغناطيس له قطبان', 'تزول المغناطيسية', 'يصبح النصفان قطبين منفردين'], 1, 'لا يوجد قطب مغناطيسي منفرد.']] },
 { h: 'المجال الناتج عن التيار وقواعد اليد اليمنى', html: `
<p>اكتشف أورستد أن التيار الكهربائي يولّد مجالًا مغناطيسيًا.</p>
<ul><li><b>قاعدة اليد اليمنى الأولى</b> (سلك مستقيم): أمسك السلك بيدك اليمنى بحيث يشير الإبهام إلى اتجاه التيار، فتشير الأصابع إلى اتجاه خطوط المجال، وهي دوائر متحدة المركز حول السلك، ويضعف المجال بالبعد عنه.</li>
<li><b>قاعدة اليد اليمنى الثانية</b> (ملف لولبي): لف الأصابع في اتجاه التيار في اللفات، فيشير الإبهام إلى القطب الشمالي.</li></ul>
<p><b>المغناطيس الكهربائي</b> ملف لولبي يمر فيه تيار، ويزداد مجاله بزيادة <b>عدد اللفات</b> أو <b>التيار</b> أو بإدخال <b>قلب حديدي</b>، ويمكن إيقافه بقطع التيار (الرافعات، الأجراس، المرحلات).</p>`,
 q: [['لزيادة قوة المغناطيس الكهربائي', ['نقلل عدد اللفات', 'نزيد التيار أو عدد اللفات أو ندخل قلبًا حديديًا', 'نستعمل قلبًا خشبيًا', 'نعكس اتجاه التيار'], 1, 'كل هذه العوامل تزيد المجال.']] }],
 cards: [['الأقطاب المتشابهة', 'تتنافر'], ['خطوط المجال خارج المغناطيس', 'من الشمالي إلى الجنوبي'], ['وحدة المجال المغناطيسي', 'التسلا ⟦T = N/(A·m)⟧'], ['اليد اليمنى الأولى', 'الإبهام = التيار، الأصابع = المجال حول السلك'], ['اليد اليمنى الثانية', 'الأصابع = التيار في اللفات، الإبهام = القطب الشمالي'], ['تقوية المغناطيس الكهربائي', 'لفات أكثر، تيار أكبر، قلب حديدي']] },

{ n: '8-2', t: 'القوى المغناطيسية', parts: [
 { h: 'القوة على سلك وعلى شحنة متحركة', html: `
<p><b>القوة على سلك</b> يحمل تيارًا I طوله L في مجال B عمودي عليه: ⟦F = ILB⟧ (وإذا صنع زاوية θ: ⟦F = ILB sin θ⟧، وتنعدم إذا كان السلك موازيًا للمجال).</p>
<p><b>القوة على جسيم مشحون</b> يتحرك بسرعة v عموديًا على المجال: ⟦F = qvB⟧. الجسيم الساكن أو المتعادل لا يتأثر. وهذه القوة عمودية على السرعة، فلا تبذل شغلًا ولا تغير مقدار السرعة، بل تجعل الجسيم يتحرك في مسار دائري: ⟦qvB = mv^{2}/r⟧.</p>
<p><b>قاعدة اليد اليمنى الثالثة</b>: الأصابع في اتجاه المجال، والإبهام في اتجاه التيار (أو حركة الشحنة الموجبة)، فتكون القوة خارجة من راحة اليد؛ فالقوة عمودية على التيار والمجال معًا. وللإلكترون نعكس الاتجاه.</p>
<div class="box ex"><b>✎ مثال</b>سلك طوله ⟦0.5 m⟧ يحمل ⟦4 A⟧ عموديًا على مجال ⟦0.3 T⟧. ما القوة عليه؟<span class="sol">الحل: ⟦F = 4×0.5×0.3 = 0.6 N⟧.</span></div>`,
 q: [['إلكترون يتحرك موازيًا لخطوط مجال مغناطيسي. القوة المغناطيسية عليه', ['أكبر ما يمكن', 'صفر', '⟦qvB⟧', 'في اتجاه حركته'], 1, 'القوة ⟦qvB sin θ⟧ و⟦θ = 0⟧.']] },
 { h: 'الجلفانومتر والمحرك الكهربائي', html: `
<p><b>الجلفانومتر</b> ملف يدور في مجال مغناطيس دائم بتأثير عزم القوة المغناطيسية، ويكشف التيارات الصغيرة. ويتحول إلى <b>أميتر</b> بتوصيل مقاومة صغيرة (مجزئ تيار) على التوازي معه، وإلى <b>فولتميتر</b> بتوصيل مقاومة كبيرة على التوالي معه.</p>
<p><b>المحرك الكهربائي</b> يحول الطاقة الكهربائية إلى ميكانيكية: ملف (المنتج) يدور في مجال مغناطيسي، ويعكس <b>المبدّل</b> (عاكس التيار ذو الحلقتين المشقوقتين) اتجاه التيار كل نصف دورة ليستمر الدوران في الاتجاه نفسه.</p>`,
 q: [['يتحول الجلفانومتر إلى فولتميتر بتوصيل', ['مقاومة صغيرة على التوازي', 'مقاومة كبيرة على التوالي', 'مكثف على التوازي', 'ملف على التوالي'], 1, 'المقاومة الكبيرة على التوالي تجعله يقيس الجهد دون سحب تيار كبير.']] }],
 cards: [['القوة على سلك', '⟦F = ILB⟧'], ['القوة على شحنة متحركة', '⟦F = qvB⟧'], ['سلك موازٍ للمجال', 'القوة صفر'], ['اليد اليمنى الثالثة', 'القوة عمودية على التيار والمجال'], ['شغل القوة المغناطيسية على شحنة', 'صفر (مسار دائري)'], ['جلفانومتر ← أميتر', 'مقاومة صغيرة توازيًا'], ['جلفانومتر ← فولتميتر', 'مقاومة كبيرة توالٍ'], ['المحرك', 'كهربائية ← ميكانيكية']] },

{ n: '8-3', t: 'الحث الكهرومغناطيسي', parts: [
 { h: 'قانون فاراداي والقوة الدافعة الحثية', html: `
<p>اكتشف فاراداي أن <b>تغير المجال المغناطيسي</b> عبر ملف (أو حركة سلك عبر خطوط المجال) يولد تيارًا حثيًا. لا يتولد تيار إذا كان المجال ثابتًا والسلك ساكنًا أو متحركًا موازيًا للمجال.</p>
<p><b>القوة الدافعة الكهربائية الحثية</b> لسلك طوله L يتحرك بسرعة v عموديًا على مجال B: ⟦EMF = BLv⟧ (بالفولت)، والتيار الحثي في دائرة مقاومتها R: ⟦I = EMF/R⟧. ويُحدد اتجاه التيار بقاعدة اليد اليمنى.</p>
<div class="box ex"><b>✎ مثال</b>سلك طوله ⟦0.4 m⟧ يتحرك بسرعة ⟦5 m/s⟧ عموديًا على مجال ⟦0.5 T⟧، وطرفاه موصولان بمقاومة ⟦2 Ω⟧. ما التيار؟<span class="sol">الحل: ⟦EMF = 0.5×0.4×5 = 1 V⟧، و⟦I = 1/2 = 0.5 A⟧.</span></div>`,
 q: [['يتولد تيار حثي في ملف عندما', ['يكون المجال ثابتًا والملف ساكنًا', 'يتغير المجال المغناطيسي الذي يخترقه', 'يكون الملف من النحاس', 'يُوضع في الظلام'], 1, 'الحث يحتاج تغيرًا في المجال (التدفق).']] },
 { h: 'قانون لنز والمولد والحث الذاتي', html: `
<p><b>قانون لنز:</b> يكون اتجاه التيار الحثي بحيث يولّد مجالًا مغناطيسيًا <b>يعاكس التغير</b> الذي سببه؛ وهو صورة من حفظ الطاقة. مثال: تقريب قطب شمالي من ملف يجعل طرف الملف القريب شماليًا فيتنافران. وعليه تعمل <b>التيارات الدوامية</b> في الكوابح المغناطيسية.</p>
<p><b>المولد الكهربائي</b> يحول الطاقة الميكانيكية إلى كهربائية بتدوير ملف في مجال مغناطيسي، وينتج تيارًا مترددًا يتغير جيبيًا.</p>
<p><b>الحث الذاتي:</b> تغير التيار في ملف يولد فيه قوة دافعة تعاكس هذا التغير، فيقاوم الملف التغيرات المفاجئة في التيار.</p>`,
 q: [['قانون لنز صورة من قانون', ['حفظ الشحنة', 'حفظ الطاقة', 'حفظ الزخم', 'كولوم'], 1, 'لو دعم التيار الحثي التغير لحصلنا على طاقة من لا شيء.']] },
 { h: 'التيار المتردد والمحولات', html: `
<p>القيمة الفعالة للتيار والجهد المترددين (تعطي التأثير الحراري نفسه للتيار المستمر): ⟦V_{eff} = 0.707 V_{max}⟧ و⟦I_{eff} = 0.707 I_{max}⟧، والقدرة المتوسطة ⟦P = I_{eff}ΔV_{eff} = ½P_{max}⟧.</p>
<p><b>المحول</b> ملفان (ابتدائي وثانوي) على قلب حديدي، ويعمل <b>بالتيار المتردد فقط</b> لأنه يحتاج مجالًا متغيرًا (الحث المتبادل): ⟦V_{s}/V_{p} = N_{s}/N_{p}⟧، وفي المحول المثالي القدرة محفوظة: ⟦V_{p}I_{p} = V_{s}I_{s}⟧ فـ ⟦I_{s}/I_{p} = N_{p}/N_{s}⟧.</p>
<ul><li><b>الرافع</b>: لفات الثانوي أكثر ⇐ جهد ثانوي أكبر وتيار أقل (لنقل الطاقة لمسافات بعيدة بفقد أقل).</li><li><b>الخافض</b>: لفات الثانوي أقل ⇐ جهد أقل وتيار أكبر (قرب المنازل، شواحن الأجهزة).</li></ul>
<div class="box ex"><b>✎ مثال</b>محول عدد لفات ابتدائيه ⟦200⟧ وثانويه ⟦50⟧، والجهد الابتدائي ⟦240 V⟧ والتيار الابتدائي ⟦1 A⟧. احسب الجهد والتيار الثانويين.<span class="sol">الحل: ⟦V_{s} = 240×50/200 = 60 V⟧ (خافض)، و⟦I_{s} = 240×1/60 = 4 A⟧.</span></div>`,
 q: [['جهد متردد قيمته العظمى ⟦100 V⟧. قيمته الفعالة تقريبًا', ['⟦100 V⟧', '⟦70.7 V⟧', '⟦141 V⟧', '⟦50 V⟧'], 1, '⟦0.707×100 = 70.7 V⟧.']] }],
 cards: [['شرط الحث', 'تغير المجال المغناطيسي عبر الملف'], ['القوة الدافعة الحثية', '⟦EMF = BLv⟧'], ['قانون لنز', 'التيار الحثي يعاكس التغير الذي سببه'], ['المولد', 'ميكانيكية ← كهربائية'], ['القيمة الفعالة', '⟦V_{eff} = 0.707 V_{max}⟧'], ['المحول', '⟦V_{s}/V_{p} = N_{s}/N_{p}⟧'], ['المحول المثالي', '⟦V_{p}I_{p} = V_{s}I_{s}⟧'], ['المحول الرافع', 'جهد ثانوي أكبر وتيار أقل'], ['لماذا لا يعمل المحول بالمستمر؟', 'يحتاج مجالًا متغيرًا']] },

{ n: '8-4', t: 'الكهرومغناطيسية', parts: [
 { h: 'تفاعل المجالين وكتلة الإلكترون والمطياف', html: `
<p>في أنبوب أشعة المهبط (تجربة <b>طومسون</b>) يُطبق مجالان كهربائي ومغناطيسي متعامدان، فإذا لم تنحرف الإلكترونات تكون القوتان متساويتين: ⟦qE = qvB ⇒ v = E/B⟧. ثم بالمجال المغناطيسي وحده تتحرك في دائرة: ⟦q/m = v/(Br)⟧. هكذا قاس طومسون نسبة الشحنة إلى الكتلة واكتشف الإلكترون، ومع شحنة مليكان حُسبت كتلته ⟦≈ 9.11×10^{−31} kg⟧.</p>
<p><b>مطياف الكتلة</b> يفصل الأيونات (والنظائر) حسب كتلها: كلما زادت الكتلة كبر نصف قطر المسار في المجال المغناطيسي: ⟦m = qB^{2}r^{2}/(2ΔV)⟧ للأيونات المعجّلة بفرق جهد ⟦ΔV⟧.</p>`,
 q: [['في مطياف الكتلة، الأيون الأثقل (بالشحنة والسرعة نفسيهما) يتحرك في مسار', ['نصف قطره أصغر', 'نصف قطره أكبر', 'مستقيم', 'نصف القطر نفسه'], 1, '⟦r = mv/(qB)⟧.']] },
 { h: 'الموجات الكهرومغناطيسية', html: `
<p>المجال الكهربائي المتغير يولد مجالًا مغناطيسيًا متغيرًا وبالعكس، فتنتشر <b>موجة كهرومغناطيسية</b> فيها المجالان متعامدان على بعضهما وعلى اتجاه الانتشار (موجة مستعرضة)، تنتقل في الفراغ بسرعة الضوء ⟦c = 3×10^{8} m/s⟧ ولا تحتاج وسطًا. وتنتجها الشحنات المتسارعة (الهوائي) وتستقبلها الهوائيات بالرنين.</p>
<p><b>الطيف الكهرومغناطيسي</b> مرتبًا من الأطول موجيًا (الأقل ترددًا وطاقة) إلى الأقصر: الراديو ⇐ الميكروويف ⇐ تحت الحمراء ⇐ المرئي ⇐ فوق البنفسجية ⇐ الأشعة السينية ⇐ غاما. والعلاقة ⟦c = λf⟧ لجميعها. و<b>الكهرباء الضغطية</b> في بلورات الكوارتز تنتج اهتزازات بتردد ثابت تُستعمل في المذبذبات والساعات.</p>`,
 q: [['أقصر الموجات الكهرومغناطيسية طولًا موجيًا', ['الراديو', 'الضوء المرئي', 'الأشعة السينية', 'أشعة غاما'], 3, 'غاما أعلى ترددًا وأقصر طولًا موجيًا.']] }],
 cards: [['منتقي السرعات', '⟦v = E/B⟧'], ['نسبة الشحنة إلى الكتلة', '⟦q/m = v/(Br)⟧ (طومسون)'], ['مطياف الكتلة', 'الأثقل ⇐ نصف قطر أكبر'], ['الموجة الكهرومغناطيسية', 'مجالان متعامدان، مستعرضة، لا تحتاج وسطًا'], ['مصدر الموجات الكهرومغناطيسية', 'الشحنات المتسارعة'], ['الطيف من الأطول للأقصر', 'راديو، ميكروويف، تحت حمراء، مرئي، فوق بنفسجية، سينية، غاما']] }
]});

COURSE.units.push({ id: 'u9', week: 5, num: '9', title: 'الفيزياء الحديثة والذرية والنووية', en: 'Quantum, Atomic & Nuclear Physics', d: 8, ex: ['9.1', '9.2'],
sub: 'النظرية الكمية والتأثير الكهروضوئي، نماذج الذرة وطيفها، إلكترونيات الحالة الصلبة، النواة والإشعاع، التفاعلات النووية والجسيمات',
lessons: [
{ n: '9-1', t: 'النظرية الكمية للضوء والمادة', parts: [
 { h: 'إشعاع الجسم الساخن وفرضية بلانك', html: `
<p>تبعث الأجسام الساخنة إشعاعًا، وكلما ارتفعت درجة حرارتها انزاحت قمة طيفها نحو الترددات الأعلى (من الأحمر نحو الأبيض المزرق) وزادت الطاقة المنبعثة. عجزت الفيزياء الكلاسيكية عن تفسير ذلك، فافترض <b>بلانك</b> أن طاقة الذرات المهتزة <b>مكمّاة</b>: ⟦E = nhf⟧ حيث ⟦h = 6.63×10^{−34} J·s⟧ ثابت بلانك.</p>
<p>وفسر أينشتاين الضوء بأنه حزم من الطاقة تسمى <b>الفوتونات</b>، طاقة كل منها ⟦E = hf = hc/λ⟧؛ فالطاقة تتناسب طرديًا مع التردد وعكسيًا مع الطول الموجي (فوتون البنفسجي أعلى طاقة من الأحمر). ووحدة طاقة مفيدة: الإلكترون فولت ⟦1 eV = 1.6×10^{−19} J⟧.</p>`,
 q: [['أي الفوتونات التالية أعلى طاقة؟', ['الأحمر', 'الأخضر', 'الأزرق', 'تحت الأحمر'], 2, '⟦E = hf⟧ والأزرق أعلى ترددًا.']] },
 { h: 'التأثير الكهروضوئي', html: `
<p><b>التأثير الكهروضوئي:</b> انبعاث إلكترونات من سطح فلز عند سقوط إشعاع كهرومغناطيسي عليه. حقائقه التي لم تفسرها النظرية الموجية:</p>
<ul><li>لكل فلز <b>تردد عتبة</b> ⟦f_{0}⟧؛ تحته لا تتحرر إلكترونات مهما زادت شدة الضوء.</li>
<li>زيادة <b>الشدة</b> (فوق تردد العتبة) تزيد <b>عدد</b> الإلكترونات المتحررة لا طاقتها.</li>
<li>أقصى طاقة حركية للإلكترونات تعتمد على <b>التردد</b>: ⟦KE = hf − hf_{0}⟧، حيث ⟦W = hf_{0}⟧ <b>اقتران الشغل</b> (أقل طاقة لتحرير الإلكترون).</li></ul>
<p>وتُقاس الطاقة الحركية القصوى بجهد الإيقاف: ⟦KE = qΔV_{0}⟧. والخلايا الضوئية والشمسية تطبيقات لهذه الظاهرة.</p>
<div class="box ex"><b>✎ مثال</b>فوتون طاقته ⟦6 eV⟧ سقط على فلز اقتران الشغل له ⟦2.5 eV⟧. ما أقصى طاقة حركية للإلكترون؟<span class="sol">الحل: ⟦KE = 6 − 2.5 = 3.5 eV⟧.</span></div>`,
 q: [['زيادة شدة الضوء الساقط على فلز (فوق تردد العتبة) تزيد', ['أقصى طاقة حركية للإلكترونات', 'عدد الإلكترونات المتحررة', 'تردد العتبة', 'اقتران الشغل'], 1, 'الشدة = عدد الفوتونات.']] },
 { h: 'تأثير كومبتون وموجات المادة', html: `
<p><b>تأثير كومبتون:</b> عند تصادم فوتون أشعة سينية بإلكترون يتشتت الفوتون بطول موجي أكبر (طاقة أقل)، ويُحفظ الزخم والطاقة؛ فللفوتون زخم ⟦p = h/λ⟧ رغم أنه بلا كتلة.</p>
<p><b>دي برولي:</b> للجسيمات المتحركة خصائص موجية، وطولها الموجي ⟦λ = h/(mv) = h/p⟧. وأُثبتت بحيود الإلكترونات (المجهر الإلكتروني). وهذه <b>ازدواجية الموجة والجسيم</b>: الضوء والمادة يُظهران الخصائص الموجية والجسيمية. ومبدأ <b>عدم التحديد لهايزنبرج</b>: لا يمكن قياس موقع الجسيم وزخمه معًا بدقة تامة.</p>`,
 q: [['إذا تضاعفت سرعة إلكترون فإن طول موجة دي برولي المصاحبة له', ['يتضاعف', 'يقل للنصف', 'يصبح أربعة أمثاله', 'لا يتغير'], 1, '⟦λ = h/(mv)⟧.']] }],
 cards: [['فرضية بلانك', '⟦E = nhf⟧ (طاقة مكمّاة)'], ['طاقة الفوتون', '⟦E = hf = hc/λ⟧'], ['⟦1 eV⟧', '⟦1.6×10^{−19} J⟧'], ['التأثير الكهروضوئي', '⟦KE = hf − hf_{0}⟧'], ['اقتران الشغل', '⟦W = hf_{0}⟧'], ['زيادة الشدة', 'تزيد عدد الإلكترونات'], ['دي برولي', '⟦λ = h/(mv)⟧'], ['زخم الفوتون', '⟦p = h/λ⟧']] },

{ n: '9-2', t: 'الذرة', parts: [
 { h: 'نماذج الذرة', html: `
<ul><li><b>طومسون:</b> اكتشف الإلكترون، ونموذجه كرة موجبة تنتشر فيها الإلكترونات.</li>
<li><b>رذرفورد (صفيحة الذهب):</b> معظم جسيمات ألفا نفذت دون انحراف وقليل منها ارتد ⇐ معظم الذرة فراغ، وكتلتها وشحنتها الموجبة مركزة في <b>نواة</b> صغيرة جدًا.</li>
<li><b>بور:</b> الإلكترونات تدور في مستويات طاقة محددة (مكمّاة) دون أن تشع، وتشع أو تمتص فوتونًا فقط عند الانتقال بين المستويات: ⟦E_{فوتون} = hf = E_{i} − E_{f}⟧. وطاقة مستويات ذرة الهيدروجين ⟦E_{n} = −13.6/n^{2} eV⟧، ونصف قطر المدار ⟦r_{n} = n^{2}(5.3×10^{−11} m)⟧.</li>
<li><b>النموذج الكمي:</b> الإلكترون يوجد في <b>سحابة إلكترونية</b> (منطقة احتمال وجود) لا في مدار محدد.</li></ul>
<div class="box ex"><b>✎ مثال</b>انتقل إلكترون الهيدروجين من ⟦n = 3⟧ إلى ⟦n = 2⟧. ما طاقة الفوتون المنبعث؟<span class="sol">الحل: ⟦E_{3} = −13.6/9 ≈ −1.51 eV⟧ و⟦E_{2} = −3.4 eV⟧، فالطاقة ⟦≈ 1.89 eV⟧ (ضوء أحمر).</span></div>`,
 q: [['استنتج رذرفورد من تجربته أن', ['الذرة كرة مصمتة', 'معظم كتلة الذرة في نواة صغيرة', 'الإلكترونات داخل النواة', 'الذرة متعادلة'], 1, 'ارتداد قليل من جسيمات ألفا دل على نواة صغيرة كثيفة.']] },
 { h: 'الأطياف والليزر', html: `
<p><b>طيف الانبعاث</b> للغاز المتوهج خطوط ملونة محددة، و<b>طيف الامتصاص</b> خطوط معتمة على طيف متصل عند الأطوال الموجية نفسها؛ ولكل عنصر طيف مميز كبصمة يُعرف بها (تحليل تركيب النجوم). والطيف المتصل ينتج من جسم صلب ساخن.</p>
<p><b>الإثارة</b> رفع الإلكترون إلى مستوى أعلى (بالتسخين، أو التصادم، أو امتصاص فوتون)، ثم يعود ويطلق فوتونًا. والضوء <b>المتوهج</b> غير مترابط ومتعدد الأطوال الموجية.</p>
<p><b>الليزر</b> (تضخيم الضوء بالانبعاث المحفَّز): يحفز فوتون ذرة مثارة لتطلق فوتونًا مماثلًا له في التردد والطور والاتجاه، فينتج ضوء <b>أحادي اللون، مترابط (متفق الطور)، شديد التوازي</b>. ويستعمل في الجراحة والاتصالات بالألياف البصرية وقراءة الأقراص والقياس.</p>`,
 q: [['ضوء الليزر', ['متعدد الألوان غير مترابط', 'أحادي اللون ومترابط', 'طولي', 'لا ينتشر في الفراغ'], 1, 'الانبعاث المحفز يعطي فوتونات متماثلة متفقة الطور.']] }],
 cards: [['نموذج رذرفورد', 'نواة صغيرة موجبة ومعظم الذرة فراغ'], ['نموذج بور', 'مستويات طاقة مكمّاة'], ['طاقة الفوتون المنبعث', '⟦hf = E_{i} − E_{f}⟧'], ['مستويات الهيدروجين', '⟦E_{n} = −13.6/n^{2} eV⟧'], ['طيف الانبعاث', 'خطوط مضيئة مميزة للعنصر'], ['خصائص الليزر', 'أحادي اللون، مترابط، متوازٍ'], ['النموذج الكمي', 'سحابة إلكترونية']] },

{ n: '9-3', t: 'إلكترونيات الحالة الصلبة', parts: [
 { h: 'الموصلات والعوازل وأشباه الموصلات', html: `
<p>في الجوامد تتشكل <b>أحزمة طاقة</b>: حزمة التكافؤ وحزمة التوصيل، وبينهما <b>فجوة الطاقة المحظورة</b>.</p>
<ul><li><b>الموصل:</b> الحزمتان متداخلتان أو حزمة التوصيل مملوءة جزئيًا ⇐ إلكترونات حرة كثيرة.</li>
<li><b>العازل:</b> فجوة كبيرة ⇐ لا تنتقل الإلكترونات إلى حزمة التوصيل.</li>
<li><b>شبه الموصل</b> (السيليكون، الجرمانيوم): فجوة صغيرة؛ تزداد موصليته برفع درجة الحرارة (عكس الفلزات)، وتتكون فيه <b>فجوات</b> موجبة.</li></ul>
<p><b>التطعيم (الإشابة):</b> إضافة شوائب لزيادة الموصلية: <b>النوع n</b> بإضافة عنصر خماسي التكافؤ (كالزرنيخ أو الفوسفور) فتزيد الإلكترونات الحرة، و<b>النوع p</b> بإضافة عنصر ثلاثي التكافؤ (كالبورون أو الجاليوم) فتزيد الفجوات.</p>`,
 q: [['تُصنع بلورة سيليكون من النوع n بإضافة', ['البورون', 'الجاليوم', 'الزرنيخ', 'الألومنيوم'], 2, 'الزرنيخ خماسي التكافؤ يوفر إلكترونًا زائدًا.']] },
 { h: 'الثنائي والترانزستور', html: `
<p><b>الثنائي (الدايود)</b> وصلة p-n تسمح بمرور التيار في <b>اتجاه واحد</b>: في <b>الانحياز الأمامي</b> (p متصلة بالطرف الموجب) يمر التيار، وفي <b>العكسي</b> لا يمر تقريبًا. يُستعمل في <b>تقويم</b> التيار المتردد إلى مستمر. و<b>الثنائي الباعث للضوء (LED)</b> يطلق ضوءًا عند مرور التيار فيه.</p>
<p><b>الترانزستور</b> (npn أو pnp): له باعث وقاعدة وجامع، ويعمل <b>مضخمًا</b> للإشارات أو <b>مفتاحًا</b>؛ تيار قاعدة صغير يتحكم في تيار جامع كبير. و<b>الدوائر المتكاملة (الرقائق الدقيقة)</b> تجمع ملايين الترانزستورات على شريحة سيليكون واحدة وهي أساس الحواسيب.</p>`,
 q: [['يُستعمل الثنائي في الدوائر لـ', ['تضخيم الجهد', 'تقويم التيار المتردد', 'تخزين الشحنة', 'زيادة المقاومة'], 1, 'يسمح بالتيار في اتجاه واحد.']] }],
 cards: [['فجوة الطاقة في العازل', 'كبيرة'], ['موصلية شبه الموصل بالتسخين', 'تزداد'], ['النوع n', 'شوائب خماسية التكافؤ (إلكترونات زائدة)'], ['النوع p', 'شوائب ثلاثية التكافؤ (فجوات)'], ['الدايود', 'يمرر التيار في اتجاه واحد (تقويم)'], ['الانحياز الأمامي', 'p على الموجب، يمر التيار'], ['الترانزستور', 'مضخم أو مفتاح']] },

{ n: '9-4', t: 'النواة والإشعاع', parts: [
 { h: 'تركيب النواة وطاقة الربط', html: `
<p>النواة تتكون من <b>بروتونات</b> (العدد الذري Z) و<b>نيوترونات</b> (N)، و<b>العدد الكتلي</b> ⟦A = Z + N⟧، ويُكتب النظير ⟦^{A}_{Z}X⟧. و<b>النظائر</b> ذرات للعنصر نفسه (Z نفسه) تختلف في عدد النيوترونات. وفي الذرة المتعادلة عدد الإلكترونات = Z.</p>
<p><b>القوة النووية القوية</b> تربط النيوكليونات معًا، وهي أقوى من التنافر الكهربائي بين البروتونات لكنها قصيرة المدى جدًا.</p>
<p>كتلة النواة أقل من مجموع كتل مكوناتها منفردة؛ هذا هو <b>النقص الكتلي</b>، ويكافئ <b>طاقة الربط</b>: ⟦E = mc^{2}⟧. وفي وحدات الكتل الذرية ⟦1 u ≈ 931.49 MeV⟧. وطاقة الربط لكل نيوكليون أكبر ما يمكن قرب الحديد، لذلك تتحرر طاقة من انشطار الثقيلة واندماج الخفيفة.</p>`,
 q: [['نواة ⟦^{27}_{13}Al⟧ عدد النيوترونات فيها', ['⟦13⟧', '⟦14⟧', '⟦27⟧', '⟦40⟧'], 1, '⟦N = A − Z = 27 − 13 = 14⟧.']] },
 { h: 'التحلل الإشعاعي وعمر النصف', html: `
<table class="tbl"><tr><th>الإشعاع</th><th>طبيعته</th><th>التغير في النواة</th><th>النفاذ</th></tr>
<tr><td>ألفا ⟦α⟧</td><td>نواة هيليوم ⟦^{4}_{2}He⟧</td><td>A ينقص 4، Z ينقص 2</td><td>الأقل (تُوقفه ورقة)</td></tr>
<tr><td>بيتا ⟦β^{−}⟧</td><td>إلكترون ⟦^{0}_{−1}e⟧</td><td>A ثابت، Z يزداد 1 (نيوترون ⇐ بروتون + إلكترون + نقيض النيوترينو)</td><td>متوسط (تُوقفه صفيحة ألومنيوم)</td></tr>
<tr><td>غاما ⟦γ⟧</td><td>فوتون عالي الطاقة</td><td>لا يتغير A ولا Z</td><td>الأكبر (يحتاج الرصاص أو الخرسانة)</td></tr></table>
<p>في المعادلات النووية: <b>مجموع الأعداد الكتلية ومجموع الأعداد الذرية محفوظان</b> على طرفي المعادلة. مثال: ⟦^{238}_{92}U ⇒ ^{234}_{90}Th + ^{4}_{2}He⟧.</p>
<p><b>عمر النصف</b> الزمن اللازم لتحلل نصف عدد النوى المشعة في العينة. المتبقي بعد n عمر نصف: ⟦N = N_{0}(½)^{n}⟧، و⟦n = t/T_{½}⟧. و<b>النشاط الإشعاعي</b> عدد التحللات في الثانية بوحدة البكريل ⟦Bq⟧. ويستعمل الكربون 14 في تقدير أعمار المواد العضوية.</p>
<div class="box ex"><b>✎ مثال</b>عينة ⟦80 g⟧ عمر النصف لها ⟦5⟧ أيام. كم يبقى بعد ⟦20⟧ يومًا؟<span class="sol">الحل: ⟦n = 20/5 = 4⟧، والمتبقي ⟦80/2^{4} = 5 g⟧.</span></div>`,
 q: [['نواة ⟦^{226}_{88}Ra⟧ أطلقت جسيم ألفا. النواة الناتجة', ['⟦^{222}_{86}Rn⟧', '⟦^{226}_{89}Ac⟧', '⟦^{222}_{88}Ra⟧', '⟦^{224}_{87}Fr⟧'], 0, 'A ينقص 4 وZ ينقص 2.'],
     ['بعد ثلاثة أعمار نصف يبقى من العينة المشعة', ['الثلث', 'السدس', 'الثمن', 'لا شيء'], 2, '⟦(½)^{3} = 1/8⟧.']] }],
 cards: [['العدد الكتلي', '⟦A = Z + N⟧'], ['النظائر', 'Z نفسه وعدد نيوترونات مختلف'], ['النقص الكتلي', 'يكافئ طاقة الربط ⟦E = mc^{2}⟧'], ['⟦1 u⟧', '⟦≈ 931.49 MeV⟧'], ['تحلل ألفا', 'A − 4 ، Z − 2'], ['تحلل بيتا السالب', 'A ثابت ، Z + 1'], ['تحلل غاما', 'لا يتغير A ولا Z'], ['المتبقي بعد n أعمار نصف', '⟦N_{0}(½)^{n}⟧'], ['أكثر الإشعاعات نفاذًا', 'غاما']] },

{ n: '9-5', t: 'التفاعلات النووية والجسيمات الأولية', parts: [
 { h: 'الانشطار والاندماج', html: `
<p><b>الانشطار النووي:</b> انقسام نواة ثقيلة (مثل ⟦^{235}U⟧) بعد امتصاصها نيوترونًا إلى نواتين متوسطتين مع تحرر طاقة كبيرة ونيوترونات جديدة قد تسبب <b>تفاعلًا متسلسلًا</b>. في <b>المفاعل النووي</b> يُضبط التفاعل: <b>المهدئ</b> (الماء أو الجرافيت) يبطئ النيوترونات، و<b>قضبان التحكم</b> (الكادميوم أو البورون) تمتص النيوترونات الزائدة، وتحول الحرارة الماء إلى بخار يدير التوربينات.</p>
<p><b>الاندماج النووي:</b> اتحاد نواتين خفيفتين (نظائر الهيدروجين) لتكوين نواة أثقل مع تحرر طاقة؛ وهو مصدر طاقة الشمس والنجوم، ويحتاج إلى درجات حرارة عالية جدًا للتغلب على التنافر بين النوى.</p>`,
 q: [['مصدر طاقة الشمس', ['الانشطار النووي', 'الاندماج النووي', 'الاحتراق الكيميائي', 'التحلل الإشعاعي'], 1, 'اندماج نوى الهيدروجين إلى هيليوم.']] },
 { h: 'الجسيمات الأولية', html: `
<p>البروتونات والنيوترونات ليست أولية؛ فكل منها مكوَّن من ثلاثة <b>كواركات</b> (البروتون: uud، والنيوترون: udd). أما <b>اللبتونات</b> (مثل الإلكترون والنيوترينو) فجسيمات أولية. ولكل جسيم <b>جسيم مضاد</b> له الكتلة نفسها والشحنة المعاكسة (البوزيترون مضاد الإلكترون)، وعند التقائهما يفنيان ويتحولان إلى طاقة (فوتونات غاما)، والعكس ممكن (إنتاج الأزواج). وتُنقل القوى الأساسية بجسيمات حاملة (الفوتون للقوة الكهرومغناطيسية).</p>
<p>وتُستعمل <b>المسارعات</b> (الخطية والسنكروترون) لتعجيل الجسيمات و<b>الكواشف</b> (غرفة الفقاعات، عداد جايجر) لرصدها.</p>`,
 q: [['البوزيترون هو', ['نيوترون مضاد', 'إلكترون موجب الشحنة (مضاد الإلكترون)', 'بروتون بلا شحنة', 'فوتون'], 1, 'له كتلة الإلكترون وشحنة موجبة.']] }],

window.GEX={"1.1":{"title":"الحركة (مسائل)","qs":[["سقط جسم سقوطًا حرًا من السكون. ما مقدار سرعته المتجهة بعد 1 s؟ (اعتبر g = 10 m/s^{2})",["11 m/s","5 m/s","20 m/s","10 m/s"],3,"من السكون: ⟦v_{f} = gt = 10×1 = 10 m/s⟧"],["جسم سرعته المتجهة الابتدائية 4 m/s ويتسارع بتسارع ثابت 5 m/s^{2}. ما سرعته المتجهة بعد أن يقطع إزاحة 56 m؟",["284 m/s","576 m/s","24 m/s","28 m/s"],2,"لا يوجد زمن، فنستعمل ⟦v_{f}^{2} = v_{i}^{2} + 2aΔd = 16 + 2×5×56 = 576⟧، إذن ⟦v_{f} = 24 m/s⟧"],["سقط جسم من السكون من ارتفاع 45 m بإهمال مقاومة الهواء. ما مقدار سرعته لحظة وصوله إلى الأرض؟ (اعتبر g = 10 m/s^{2})",["90 m/s","45 m/s","30 m/s","900 m/s"],2,"⟦v_{f}^{2} = 2gΔd = 2×10×45 = 900⟧، إذن ⟦v_{f} = 30 m/s⟧"],["ما أصغر محصلة ممكنة لقوتين مقدارهما 5 N و12 N؟",["17 N","8.5 N","60 N","7 N"],3,"أصغر محصلة عندما تكون القوتان متعاكستين: ⟦R = 12 − 5 = 7 N⟧"],["جسم سرعته المتجهة الابتدائية 20 m/s يتسارع بتسارع ثابت 6 m/s^{2}. ما سرعته المتجهة بعد 5 s؟",["30 m/s","50 m/s","31 m/s","106 m/s"],1,"لا توجد إزاحة في السؤال، فنستعمل ⟦v_{f} = v_{i} + at = 20 + 6×5 = 50 m/s⟧"],["جسم يبدأ بسرعة متجهة 10 m/s ويتسارع بتسارع ثابت 2 m/s^{2}. ما إزاحته خلال 2 s؟",["28 m","24 m","4 m","14 m"],1,"لا توجد سرعة نهائية، فنستعمل ⟦Δd = v_{i}t + ½at^{2} = 10×2 + ½×2×2^{2} = 24 m⟧"],["قُذف جسم رأسيًا إلى أعلى بسرعة 30 m/s. بعد كم ثانية يصل إلى أعلى نقطة؟ (اعتبر g = 10 m/s^{2})",["6 s","30 s","3 s","9 s"],2,"عند أعلى نقطة ⟦v_{f} = 0⟧: ⟦t = v_{i}/g = 30/10 = 3 s⟧"],["يمثل منحنى (السرعة المتجهة – الزمن) لجسم خطًا مستقيمًا يبدأ من الصفر ويصل إلى 4 m/s عند t = 6 s. ما إزاحة الجسم خلال هذه المدة؟",["10 m","24 m","2/3 m","12 m"],3,"الإزاحة = المساحة تحت منحنى (السرعة المتجهة – الزمن) = مساحة مثلث: ⟦Δd = ½ × 6 × 4 = 12 m⟧"]]},"1.2":{"title":"الحركة (مفاهيم)","qs":[["وحدة القدرة في النظام الدولي هي",["الأمبير","الجول","النيوتن","الواط"],3,"⟦P = W/t⟧ ووحدتها ⟦J/s⟧ = الواط."],["البادئة «ميكرو» (μ) تعني",["10^{−6}","10^{−3}","10^{−9}","10^{6}"],0,"ميكرو ⟦μ = 10^{−6}⟧ أي جزء من مليون."],["بإهمال مقاومة الهواء، جسمان مختلفان في الكتلة سقطا <script>

  qs.forEach((qe, i) => qe.querySelectorAll('.opt').forEach(b => b.onclick = () => { qe.querySelectorAll('.opt').forEach(x => x.classList.remove('sel')); b.classList.add('sel'); ans[i] = +b.dataset.o; }));
  document.getElementById('showRes').onclick = () => {
    let c = 0; qs.forEach((qe, i) => { if (reveal(qe, ans[i])) c++; });
    document.getElementById('sc').textContent = `نتيجتك: ${c} من ${E.qs.length}`;
    st.ex[id] = Math.max(st.ex[id] || 0, c); save(); progress(); nav(cur);
    document.getElementById('showRes').style.display = 'none'; document.getElementById('again').style.display = '';
  };
  document.getElementById('again').onclick = () => exQuiz(T, id, E);
}
function cards(T, list) {
  let i = 0, order = list.map((_, k) => k);
  const draw = () => {
    const c = list[order[i]];
    T.innerHTML = `<div class="card"><h2>🗂 بطاقات التعلّم</h2><p style="margin:0;color:var(--mut)">اقرأ الوجه الأمامي وحاول التذكر، ثم اضغط على البطاقة لقلبها. (${list.length} بطاقة في هذا الباب)</p>
    <div class="fc" id="fc"><div class="in"><div class="fa">${MZ.html(c[0])}</div><div class="fb">${MZ.html(c[1])}</div></div></div>
    <div class="fcn">${i + 1} / ${list.length} — الدرس ${c[2]}</div><div class="row" style="justify-content:center;margin-top:8px"><button class="btn o" id="pv">→ السابقة</button><button class="btn o" id="sh">خلط</button><button class="btn" id="nx">التالية ←</button></div></div>`;
    document.getElementById('fc').onclick = e => e.currentTarget.classList.toggle('flip');
    document.getElementById('pv').onclick = () => { i = (i - 1 + list.length) % list.length; draw(); };
    document.getElementById('nx').onclick = () => { i = (i + 1) % list.length; draw(); };
    document.getElementById('sh').onclick = () => { order = MZ.shuffle(order); i = 0; draw(); };
  };
  draw();
}
// ---------- اختبار قياس المستوى ----------
function level() {
  const qs = MZ.shuffle(LV.map((q, k) => k));
  const ans = {};
  M.innerHTML = hero('✓', 'اختبار قياس المستوى', '', '20 سؤالًا من أبواب الفيزياء التسعة لتعرف مستواك والأبواب التي تحتاج تركيزًا. الآلة الحاسبة ممنوعة، واعتبر ⟦g = 10 m/s^{2}⟧ ما لم يُذكر غير ذلك.'.replace(/⟦[^⟧]*⟧/g, m => MZ.html(m))) +
    `<div class="card">${qs.map((k, i) => { const q = LV[k]; return qBlock([q[1], q[2], q[3], q[4]], i, C.units[q[0]].title).replace('<div class="q"', `<div class="q" data-k="${k}"`); }).join('')}
    <div class="row"><button class="btn g" id="lvGo">إنهاء الاختبار وعرض النتيجة</button><span id="lvMsg" style="color:var(--mut)"></span></div></div><div id="lvRes"></div>` + navBtns('level') + foot();
  bindNav();
  const qe = [...M.querySelectorAll('.q')];
  qe.forEach(e => e.querySelectorAll('.opt').forEach(b => b.onclick = () => { e.querySelectorAll('.opt').forEach(x => x.classList.remove('sel')); b.classList.add('sel'); ans[e.dataset.k] = +b.dataset.o; document.getElementById('lvMsg').textContent = `أجبت عن ${Object.keys(ans).length} من ${LV.length}`; }));
  document.getElementById('lvGo').onclick = () => {
    const un = LV.length - Object.keys(ans).length;
    if (un && !document.getElementById('lvGo').dataset.sure) { document.getElementById('lvGo').dataset.sure = 1; document.getElementById('lvMsg').textContent = `بقي ${un} دون إجابة. اضغط مرة أخرى للإنهاء.`; return; }
    const per = C.units.map(() => [0, 0]); let c = 0;
    qe.forEach(e => { const k = +e.dataset.k, ok = reveal(e, ans[k]); per[LV[k][0]][1]++; if (ok) { per[LV[k][0]][0]++; c++; } });
    const p = Math.round(100 * c / LV.length);
    st.lvl.push({ d: new Date().toISOString(), p, per }); save(); nav(cur);
    const lv = p >= 85 ? 'ممتاز' : p >= 70 ? 'جيد جدًا' : p >= 50 ? 'متوسط' : 'يحتاج إلى تأسيس';
    const weak = C.units.map((u, i) => [u, per[i]]).filter(([u, r]) => r[0] / r[1] < 0.5);
    const prev = st.lvl.length > 1 ? st.lvl[st.lvl.length - 2] : null;
    document.getElementById('lvRes').innerHTML = `<div class="card"><h2>نتيجتك: ${c} من ${LV.length} (${p}٪) — ${lv}</h2>${prev ? `<p>المحاولة السابقة: ${prev.p}٪ — ${p >= prev.p ? `تحسن بمقدار ${p - prev.p} نقطة` : `انخفاض ${prev.p - p} نقطة`}</p>` : ''}
    <div class="tblwrap"><table class="tbl lvl"><tr><th>الباب</th><th>الأسبوع</th><th>الصحيح</th><th>التوصية</th></tr>${C.units.map((u, i) => { const r = per[i], v = r[0] / r[1]; return `<tr><td>${u.num}. ${u.title}</td><td>${u.week}</td><td>${r[0]} / ${r[1]}</td><td style="color:${v === 1 ? 'var(--ok)' : v >= 0.5 ? '#9a6500' : 'var(--no)'};font-weight:700">${v === 1 ? 'متمكن — راجع سريعًا' : v >= 0.5 ? 'راجع الدروس وحل التمارين' : 'ابدأ به بتركيز'}</td></tr>`; }).join('')}</table></div>
    ${weak.length ? `<p><b>ركّز أولًا على:</b> ${weak.map(([u]) => `<a href="#" data-goU="${u.id}" style="color:var(--b);font-weight:700">${u.title}</a>`).join('، ')}.</p>` : '<p><b>أداء ممتاز في كل الأبواب.</b> تابع الدورة بالترتيب لتثبيت المعلومات.</p>'}
    <p style="color:var(--mut);font-size:14px">صُححت إجاباتك أعلاه مع شرح كل سؤال. هذه نتيجة تشخيصية لتوجيه مذاكرتك وليست درجة رسمية.</p>
    <div class="row"><button class="btn" id="lvAgain">إعادة الاختبار</button><button class="btn g" data-nav="intro">ابدأ الدورة ←</button></div></div>`;
    document.getElementById('lvGo').style.display = 'none';
    bindNav(); document.getElementById('lvAgain').onclick = () => go('level');
    M.querySelectorAll('[data-goU]').forEach(a => a.onclick = e => { e.preventDefault(); go(a.dataset.gou || a.getAttribute('data-goU')); });
    document.getElementById('lvRes').scrollIntoView({ behavior: 'smooth' });
  };
}
function formulas() {
  M.innerHTML = hero('∑', 'ورقة القوانين الشاملة', '', 'جميع قوانين الدورة برموز المنهج في مكان واحد للمراجعة السريعة') +
   `<div class="card"><h2>ورقة القوانين</h2><div class="tblwrap"><table class="tbl"><tr><th style="width:150px">الباب</th><th>القوانين</th></tr>${C.formulas.map(r => `<tr><td><b>${r[0]}</b></td><td style="line-height:2.3">${MZ.html(r[1])}</td></tr>`).join('')}</table></div></div>
   <div class="card"><h2>الثوابت</h2><div class="tblwrap"><table class="tbl"><tr><th>الثابت</th><th>الرمز</th><th>القيمة</th></tr>${C.constants.map(r => `<tr><td>${r[0]}</td><td>${MZ.html(r[1])}</td><td>${MZ.html(r[2])}</td></tr>`).join('')}</table></div></div>` + navBtns('formulas') + foot();
  bindNav();
}
progress(); go('home');

</script>
