<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دورة التحصيلي — الفيزياء | المتميزون</title>
<style>
:root{--b:#0b4a6d;--b2:#0e5d88;--bl:#e8f1f6;--g:#d99b14;--gl:#fbf3e0;--ink:#1d2733;--mut:#5b6876;--line:#dbe4ea;--ok:#1f8a4c;--okl:#e6f5ec;--no:#c0392b;--nol:#fbeceb;--bg:#f5f8fa}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Tajawal','Segoe UI','Noto Sans Arabic','Geeza Pro',Tahoma,Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.85;font-size:16px}
.f,.n{font-family:'Cambria Math','Times New Roman','DejaVu Serif',serif;unicode-bidi:isolate;white-space:nowrap}
.f{background:#f0f5f8;border-radius:5px;padding:0 5px;color:#0a3d5a;white-space:normal;display:inline-block;line-height:1.6;font-size:1.02em}
.n{font-size:1.02em}
sup,sub{font-size:.68em;line-height:0}
header.top{position:sticky;top:0;z-index:30;background:var(--b);color:#fff;display:flex;align-items:center;gap:12px;padding:8px 14px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
header.top img{height:42px;border-radius:6px}
header.top .tt{flex:1;min-width:0}
header.top .tt b{display:block;font-size:17px}
header.top .tt small{opacity:.85;font-size:12.5px}
.prog{width:150px;max-width:30vw}
.prog .bar{height:8px;background:rgba(255,255,255,.25);border-radius:9px;overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--g);width:0;transition:width .4s}
.prog small{font-size:11.5px;opacity:.9}
#menuBtn{display:none;background:none;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:8px;font-size:20px;padding:2px 10px;cursor:pointer}
.wrap{display:flex;max-width:1250px;margin:0 auto}
nav.side{width:290px;flex:none;background:#fff;border-left:1px solid var(--line);height:calc(100vh - 58px);position:sticky;top:58px;overflow:auto;padding:10px 0 30px}
nav.side a{display:flex;gap:8px;align-items:center;padding:8px 16px;color:var(--ink);text-decoration:none;font-size:14.5px;border-right:3px solid transparent;cursor:pointer}
nav.side a:hover{background:var(--bl)}
nav.side a.on{background:var(--bl);border-right-color:var(--g);font-weight:700}
nav.side a .num{width:26px;height:26px;border-radius:50%;background:var(--b);color:#fff;display:inline-grid;place-items:center;font-size:12.5px;flex:none}
nav.side a .ck{margin-inline-start:auto;color:var(--ok);font-weight:700}
nav.side .grp{font-size:12px;color:var(--mut);padding:12px 16px 4px;font-weight:700}
main{flex:1;min-width:0;padding:22px 26px 60px}
.hero{background:linear-gradient(135deg,var(--b),var(--b2));color:#fff;border-radius:16px;padding:22px 24px;position:relative;overflow:hidden;margin-bottom:18px}
.hero .big{position:absolute;left:18px;top:-14px;font-size:110px;font-weight:800;opacity:.12;line-height:1}
.hero h1{margin:0 0 4px;font-size:26px}
.hero .en{color:var(--g);font-weight:700;letter-spacing:.3px;font-size:14px;direction:ltr;text-align:right}
.hero p{margin:6px 0 0;opacity:.95}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 15px;font:inherit;font-size:14.5px;cursor:pointer;color:var(--ink)}
.tabs button.on{background:var(--b);color:#fff;border-color:var(--b)}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:16px}
.card h2{margin:0 0 10px;font-size:20px;color:var(--b);display:flex;align-items:center;gap:10px}
.card h2 .ln{background:var(--g);color:#fff;border-radius:8px;padding:0 9px;font-size:15px}
.card h2 .en{font-size:13px;color:var(--mut);font-weight:400;margin-inline-start:auto;direction:ltr}
table.tbl{width:100%;border-collapse:collapse;margin:10px 0 14px;font-size:15px}
table.tbl th{background:var(--b);color:#fff;font-weight:700;padding:8px 10px;text-align:right}
table.tbl td{border-bottom:1px solid var(--line);padding:8px 10px;vertical-align:top}
table.tbl tr:nth-child(even) td{background:#f8fbfc}
.tblwrap{overflow-x:auto}
.box{border-radius:12px;padding:12px 14px;margin:12px 0;border:1px solid}
.box b{display:block;margin-bottom:4px}
.box.tip{background:var(--gl);border-color:#efd9a6}
.box.warn{background:#fdf0ee;border-color:#f2c9c3}
.box.ex{background:var(--bl);border-color:#c6dbe7}
.box.note{background:#f3f6f8;border-color:var(--line)}
.box .sol{display:block;margin-top:6px;padding-top:6px;border-top:1px dashed #a9c6d6}
.done{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:14.5px;color:var(--mut);cursor:pointer;user-select:none}
.done input{width:18px;height:18px;accent-color:var(--ok)}
.q{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0;background:#fff}
.q .qh{display:flex;gap:10px;align-items:flex-start}
.q .qn{background:var(--b);color:#fff;border-radius:50%;min-width:28px;height:28px;display:grid;place-items:center;font-size:13px;margin-top:2px}
.q .qs{flex:1}
.q .tag{font-size:11.5px;color:var(--mut);background:#f1f4f6;border-radius:6px;padding:0 7px;margin-inline-start:6px;white-space:nowrap}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 4px}
.opt{border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;display:flex;gap:8px;align-items:center;background:#fff;font:inherit;text-align:right;color:inherit}
.opt:hover{border-color:var(--b2)}
.opt .l{color:var(--g);font-weight:800}
.opt.sel{border-color:var(--b);background:var(--bl)}
.opt.ok{border-color:var(--ok);background:var(--okl)}
.opt.no{border-color:var(--no);background:var(--nol)}
.opt[disabled]{cursor:default}
.exp{margin-top:8px;padding:9px 12px;border-radius:10px;background:#f6f9fb;border-inline-start:4px solid var(--g);font-size:15px}
.exp .v{font-weight:800}
.exp .v.ok{color:var(--ok)}.exp .v.no{color:var(--no)}
.btn{background:var(--b);color:#fff;border:0;border-radius:10px;padding:9px 18px;font:inherit;font-size:15px;cursor:pointer;font-weight:700}
.btn.g{background:var(--g)}
.btn.o{background:#fff;color:var(--b);border:1.5px solid var(--b)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.score{font-size:18px;font-weight:800;color:var(--b)}
.fc{perspective:1000px;margin:14px auto;max-width:520px;height:220px;cursor:pointer}
.fc .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.fc.flip .in{transform:rotateY(180deg)}
.fc .fa,.fc .fb{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;display:grid;place-items:center;padding:18px;text-align:center;font-size:20px}
.fc .fa{background:linear-gradient(135deg,var(--b),var(--b2));color:#fff}
.fc .fa .f{background:rgba(255,255,255,.14);color:#fff}
.fc .fb{background:var(--gl);border:2px solid var(--g);transform:rotateY(180deg)}
.fcn{text-align:center;color:var(--mut);font-size:14px}
.grid9{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.uc{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;transition:.2s}
.uc:hover{border-color:var(--g);transform:translateY(-2px)}
.uc .h{display:flex;gap:10px;align-items:center;font-weight:800;color:var(--b)}
.uc .h span{background:var(--g);color:#fff;border-radius:8px;width:30px;height:30px;display:grid;place-items:center}
.uc small{color:var(--mut)}
.mini{height:6px;background:#eef2f5;border-radius:9px;overflow:hidden;margin-top:8px}.mini i{display:block;height:100%;background:var(--ok)}
.links a{display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.part{border-top:1px dashed var(--line);padding-top:12px;margin-top:14px}
.part:first-of-type{border-top:0;margin-top:4px;padding-top:0}
.part h3{margin:0 0 6px;font-size:17.5px;color:var(--b2);display:flex;gap:8px;align-items:center}
.part h3::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--g);flex:none}
.chk{background:#f7fafc;border:1px solid #d5e3ec;border-radius:12px;padding:10px 12px;margin-top:10px}
.chk>b{color:var(--b);font-size:15px}
.chk .q{margin:8px 0 4px}
.hero.home{text-align:center;padding:34px 24px}
.hero.home .ph{font-size:clamp(40px,8vw,72px);font-weight:800;letter-spacing:.18em;color:var(--g);direction:ltr;line-height:1;margin-bottom:10px;font-family:'Segoe UI',Tahoma,Arial,sans-serif}
.hero.home h1{font-size:28px}
.week{font-size:12px;color:#fff;background:var(--g);border-radius:6px;padding:0 8px;margin-inline-start:6px}
.lvl td,.lvl th{text-align:center}.lvl td:first-child{text-align:right}
footer{text-align:center;color:var(--mut);font-size:13.5px;padding:24px 10px 30px;border-top:1px solid var(--line);margin-top:20px}
footer a{color:var(--b);text-decoration:none;font-weight:700;direction:ltr;display:inline-block}
.scrim{display:none}
@media (max-width:900px){
 #menuBtn{display:block}
 nav.side{position:fixed;top:58px;right:0;height:calc(100vh - 58px);z-index:40;transform:translateX(105%);transition:transform .25s;box-shadow:-4px 0 16px rgba(0,0,0,.15)}
 nav.side.open{transform:none}
 .scrim.open{display:block;position:fixed;inset:58px 0 0 0;background:rgba(0,0,0,.3);z-index:35}
 main{padding:16px 12px 50px}
 .opts{grid-template-columns:1fr}
 .prog{display:none}
 .hero h1{font-size:22px}
 table.tbl{font-size:14px}
}
@media print{header.top,nav.side,.tabs,.btn{display:none}main{padding:0}}
</style>
</head>

<script>// أدوات مشتركة: عرض الصيغ والنصوص المختلطة (عربي + رموز لاتينية)
(function () {
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  function supsub(s) {
    let prev;
    do { prev = s; s = s.replace(/\^\{([^{}]*)\}/g, '<sup>$1</sup>').replace(/_\{([^{}]*)\}/g, '<sub>$1</sub>'); } while (s !== prev);
    return s;
  }
  function formula(inner) {
    return '<span class="f" dir="ltr">' + supsub(inner.replace(/⇐/g, '⇒')) + '</span>';
  }
  // نص عادي (من البنك): نغلّف مقاطع الرموز والأرقام اللاتينية باتجاه LTR
  const RUN = /[A-Za-z0-9ΔμλρθαβγπΩ√½′\u0001\u0003−]+(?:[A-Za-z0-9ΔμλρθαβγπΩ√½°%·×=+−\-\/.,:|′' ()\u0001\u0002\u0003\u0004]*[A-Za-z0-9ΔμλρθαβγπΩ√½°%)\u0002\u0004])?/g;
  function plain(s) {
    s = esc(s);
    const store = [];
    s = s.replace(/(\^|_)\{([^{}]*)\}/g, (m, k, c) => { store.push([k, c]); return (k === '^' ? '\u0001' : '\u0003') + (store.length - 1) + (k === '^' ? '\u0002' : '\u0004'); });
    s = s.replace(RUN, m => {
      // وازن الأقواس
      let t = m;
      const open = (t.match(/\(/g) || []).length, close = (t.match(/\)/g) || []).length;
      let tail = '';
      if (close > open && t.endsWith(')')) { t = t.slice(0, -1); tail = ')'; }
      let head = '';
      if (open > close && t.startsWith('(')) { t = t.slice(1); head = '('; }
      if (!/[A-Za-z0-9ΔμλρθαβγπΩ√½\u0001\u0003]/.test(t)) return m;
      return head + '<span class="n" dir="ltr">' + t + '</span>' + tail;
    });
    s = s.replace(/[\u0001\u0003](\d+)[\u0002\u0004]/g, (m, i) => { const [k, c] = store[+i]; return k === '^' ? '<sup>' + c + '</sup>' : '<sub>' + c + '</sub>'; });
    return s;
  }
  // نص فيه ⟦صيغ⟧ (من الدورة أو الشروح)
  function rich(s, isHtml) {
    const parts = String(s).split(/(⟦[^⟧]*⟧)/);
    return parts.map(p => p.startsWith('⟦') ? formula(isHtml ? p.slice(1, -1) : esc(p.slice(1, -1))) : (isHtml ? p : plain(p))).join('');
  }
  window.MZ = {
    esc, plain, rich, supsub,
    html: s => rich(s, true),
    store: {
      get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
      set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } },
      del(k) { try { localStorage.removeItem(k); } catch (e) { } }
    },
    shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; },
    letters: ['أ', 'ب', 'ج', 'د']
  };

<p>أمثلة على الكميات المشتقة: السرعة ⟦m/s⟧، والتسارع ⟦m/s^{2}⟧، والقوة: النيوتن ⟦N = kg·m/s^{2}⟧، والطاقة: الجول ⟦J = N·m = kg·m^{2}/s^{2}⟧، والقدرة: الواط ⟦W = J/s⟧، والضغط: الباسكال ⟦Pa = N/m^{2}⟧.</p>
<div class="box tip"><b>🎯 تحليل الوحدات</b>طرفا أي معادلة فيزيائية صحيحة لهما الوحدة نفسها؛ لذلك تكشف الوحدة خطأ القانون. مثلًا ⟦½mv^{2}⟧ وحدتها ⟦kg·m^{2}/s^{2} = J⟧ فهي طاقة، أما ⟦mv⟧ فوحدتها ⟦kg·m/s⟧ فهي زخم وليست طاقة.</div>`,

     ['الوحدة ⟦kg·m^{2}/s^{2}⟧ تكافئ', ['النيوتن', 'الجول', 'الواط', 'الباسكال'], 1, '⟦J = N·m = (kg·m/s^{2})·m = kg·m^{2}/s^{2}⟧.']] },

 { h: 'الدقة والضبط والأرقام المعنوية', html: `
<p><b>الدقة (Precision):</b> درجة تقارب نتائج القياسات المتكررة بعضها من بعض، وتتحدد بأصغر تدريج في أداة القياس (نصف أصغر تدريج عادة). <b>الضبط (Accuracy):</b> مدى قرب القياس من القيمة المقبولة (الحقيقية). قد يكون القياس دقيقًا غير مضبوط إذا كانت الأداة غير معايرة.</p>
<p><b>مصادر الخطأ:</b> خطأ اختلاف زاوية النظر (البارالاكس) حين لا تنظر إلى التدريج عموديًا، وعدم معايرة الأداة (تُعاير بقياس قيمة معروفة).</p>
<p><b>الأرقام المعنوية:</b> الأرقام الموثوقة في القياس مع آخر رقم مقدَّر. القواعد: (1) الأرقام غير الصفرية معنوية. (2) الأصفار بين أرقام غير صفرية معنوية. (3) الأصفار في البداية غير معنوية. (4) الأصفار في النهاية بعد الفاصلة العشرية معنوية.</p>
<div class="box ex"><b>✎ مثال</b>كم رقمًا معنويًا في ⟦0.00305⟧ وفي ⟦2.500⟧؟<span class="sol">الحل: ⟦0.00305⟧ فيه ثلاثة (3 و0 و5)، و⟦2.500⟧ فيه أربعة لأن الصفرين بعد الفاصلة في النهاية معنويان.</span></div>
<div class="box note"><b>✎ عند الجمع والضرب</b>في الضرب والقسمة يكون للناتج عدد الأرقام المعنوية نفسه الذي في أقل القيم أرقامًا معنوية، وفي الجمع والطرح يُقرَّب إلى أقل عدد من المنازل العشرية.</div>`,
 q: [['أطلق طالب السهام فتجمعت كلها متقاربة بعيدًا عن مركز الهدف. نتائجه', ['دقيقة ومضبوطة', 'دقيقة وغير مضبوطة', 'مضبوطة وغير دقيقة', 'غير دقيقة وغير مضبوطة'], 1, 'التقارب = دقة، والبعد عن المركز (القيمة الحقيقية) = عدم ضبط.']] }],
 cards: [['عدد الكميات الأساسية في SI', 'سبع كميات'], ['⟦N⟧ بالوحدات الأساسية', '⟦kg·m/s^{2}⟧'], ['⟦J⟧ بالوحدات الأساسية', '⟦kg·m^{2}/s^{2}⟧'], ['ميكرو / نانو', '⟦10^{−6}⟧ / ⟦10^{−9}⟧'], ['⟦km/h → m/s⟧', 'اضرب في ⟦5/18⟧'], ['الدقة', 'تقارب القياسات المتكررة'], ['الضبط', 'قرب القياس من القيمة المقبولة'], ['الأصفار في بداية العدد', 'غير معنوية']] },

{ n: '1-2', t: 'المتجهات', parts: [
 { h: 'الكميات القياسية والمتجهة', html: `
<p><b>الكمية القياسية</b> يكفي لوصفها مقدار ووحدة: المسافة، الزمن، الكتلة، درجة الحرارة، الشغل، الطاقة، القدرة، السرعة القياسية. <b>الكمية المتجهة</b> لها مقدار واتجاه: الإزاحة، السرعة المتجهة، التسارع، القوة، الزخم، المجال.</p>
<p>يُمثَّل المتجه بسهم طوله يتناسب مع المقدار واتجاهه هو اتجاه الكمية، ويُكتب بخط غامق أو بسهم فوق الرمز. والمتجه السالب ⟦−A⟧ له المقدار نفسه واتجاه معاكس.</p>`,
 q: [['أي الكميات التالية متجهة؟', ['الكتلة', 'الطاقة', 'التسارع', 'الزمن'], 2, 'التسارع له مقدار واتجاه.']] },
 { h: 'جمع المتجهات على خط واحد', html: `
<p>نختار اتجاهًا موجبًا. المتجهان في الاتجاه نفسه يُجمعان: ⟦R = A + B⟧ وهي <b>أكبر محصلة</b> ممكنة. والمتعاكسان يُطرحان: ⟦R = |A − B|⟧ وهي <b>أصغر محصلة</b>، واتجاهها اتجاه الأكبر. ومحصلة متجهين بأي زاوية تقع بين هاتين القيمتين: ⟦|A − B| ≤ R ≤ A + B⟧.</p>
<div class="box ex"><b>✎ مثال</b>قوتان ⟦8 N⟧ و⟦5 N⟧. ما أكبر وأصغر محصلة لهما؟ وهل يمكن أن تكون المحصلة ⟦2 N⟧؟<span class="sol">الحل: الأكبر ⟦13 N⟧ والأصغر ⟦3 N⟧، و⟦2 N⟧ أقل من ⟦3 N⟧ فلا يمكن.</span></div>`,
 q: [['قوتان ⟦6 N⟧ و⟦10 N⟧. أي القيم التالية لا يمكن أن تكون محصلتهما؟', ['⟦4 N⟧', '⟦10 N⟧', '⟦16 N⟧', '⟦18 N⟧'], 3, 'المحصلة بين ⟦4 N⟧ و⟦16 N⟧، فـ ⟦18 N⟧ مستحيلة.']] },
 { h: 'المتجهات المتعامدة وتحليل المتجه', html: `
<p>إذا كان المتجهان متعامدين فالمحصلة وتر مثلث قائم: ⟦R^{2} = A^{2} + B^{2}⟧، وزاويتها ⟦θ = tan^{−1}(B/A)⟧. ولمتجهين بزاوية θ بينهما نستعمل قانون جيب التمام: ⟦R^{2} = A^{2} + B^{2} − 2AB cos θ_{R}⟧ حيث ⟦θ_{R}⟧ الزاوية المقابلة للمحصلة في المثلث.</p>
<p><b>تحليل المتجه</b> إلى مركبتين متعامدتين: ⟦A_{x} = A cos θ⟧ و⟦A_{y} = A sin θ⟧ (θ مقيسة من المحور x). ولجمع عدة متجهات: نحلل كلًا منها، ونجمع المركبات السينية معًا والصادية معًا، ثم ⟦R = √(R_{x}^{2} + R_{y}^{2})⟧.</p>
<div class="box tip"><b>🎯 قيم مثلثية تحفظها</b>⟦sin 30° = cos 60° = 0.5⟧، ⟦sin 60° = cos 30° ≈ 0.87⟧، ⟦sin 45° = cos 45° ≈ 0.71⟧، ⟦sin 37° ≈ 0.6⟧، ⟦cos 37° ≈ 0.8⟧. والمثلثات الشهيرة: ⟦3-4-5⟧ و⟦6-8-10⟧ و⟦5-12-13⟧.</div>
<div class="box ex"><b>✎ مثال</b>مشى شخص ⟦6 m⟧ شرقًا ثم ⟦8 m⟧ شمالًا. ما إزاحته؟<span class="sol">الحل: ⟦R = √(36 + 64) = 10 m⟧ باتجاه ⟦θ = tan^{−1}(8/6) ≈ 53°⟧ شمال الشرق. والمسافة المقطوعة ⟦14 m⟧.</span></div>
<div class="box ex"><b>✎ مثال</b>قوة ⟦20 N⟧ تميل ⟦30°⟧ فوق الأفقي. ما مركبتاها؟<span class="sol">الحل: ⟦F_{x} = 20 cos 30° ≈ 17.3 N⟧ و⟦F_{y} = 20 sin 30° = 10 N⟧.</span></div>`,
 q: [['متجهان متعامدان مقداراهما ⟦5⟧ و⟦12⟧ وحدة. مقدار محصلتهما', ['⟦7⟧', '⟦13⟧', '⟦17⟧', '⟦60⟧'], 1, '⟦√(25 + 144) = 13⟧.'],
     ['المركبة الرأسية لسرعة ⟦40 m/s⟧ تميل ⟦30°⟧ فوق الأفقي', ['⟦20 m/s⟧', '⟦34.6 m/s⟧', '⟦40 m/s⟧', '⟦10 m/s⟧'], 0, '⟦v_{y} = 40 sin 30° = 20 m/s⟧.']] }],
 cards: [['أكبر محصلة لمتجهين', '⟦A + B⟧ (في الاتجاه نفسه)'], ['أصغر محصلة لمتجهين', '⟦|A − B|⟧ (متعاكسان)'], ['محصلة متعامدين', '⟦R^{2} = A^{2} + B^{2}⟧'], ['المركبة السينية', '⟦A_{x} = A cos θ⟧'], ['المركبة الصادية', '⟦A_{y} = A sin θ⟧'], ['⟦sin 30°⟧', '⟦0.5⟧'], ['زاوية المحصلة', '⟦θ = tan^{−1}(R_{y}/R_{x})⟧']] },

{ n: '1-3', t: 'تمثيل الحركة والسرعة', parts: [
 { h: 'الموقع والمسافة والإزاحة', html: `
<p>نصف الحركة باختيار <b>نظام إحداثي</b>: نقطة أصل واتجاه موجب. <b>الموقع</b> ⟦d⟧ بُعد الجسم عن نقطة الأصل مع اتجاهه. <b>الإزاحة</b> التغير في الموقع ⟦Δd = d_{f} − d_{i}⟧ وهي متجهة، أما <b>المسافة</b> فطول المسار الفعلي وهي قياسية دائمًا موجبة.</p>
<p><b>مخطط الحركة</b> سلسلة صور للجسم بفترات زمنية متساوية، ونموذج <b>الجسيم النقطي</b> يمثل الجسم بنقطة حين يكون حجمه صغيرًا مقارنة بالمسافة. تباعد النقاط بانتظام يعني سرعة ثابتة، وتزايد التباعد يعني تسارعًا.</p>
<div class="box ex"><b>✎ مثال</b>ركض لاعب ⟦100 m⟧ إلى نهاية الملعب ثم عاد ⟦100 m⟧ إلى نقطة البداية. ما المسافة وما الإزاحة؟<span class="sol">الحل: المسافة ⟦200 m⟧، والإزاحة صفر لأن الموقع النهائي هو الموقع الابتدائي.</span></div>`,
 q: [['تحرك جسم ⟦3 m⟧ شرقًا ثم ⟦7 m⟧ غربًا. إزاحته', ['⟦10 m⟧ غربًا', '⟦4 m⟧ غربًا', '⟦4 m⟧ شرقًا', 'صفر'], 1, 'باعتبار الشرق موجبًا: ⟦Δd = 3 − 7 = −4 m⟧ أي ⟦4 m⟧ غربًا، والمسافة ⟦10 m⟧.']] },
 { h: 'السرعة المتوسطة والسرعة المتجهة', html: `
<p><b>السرعة المتجهة المتوسطة</b> ⟦v̄ = Δd/Δt⟧ (الإزاحة ÷ الزمن)، و<b>السرعة القياسية المتوسطة</b> = المسافة الكلية ÷ الزمن الكلي. <b>السرعة اللحظية</b> سرعة الجسم عند لحظة معينة، وهي ما يقرؤه عداد السرعة.</p>
<p>للحركة بسرعة ثابتة: ⟦d_{f} = d_{i} + v̄t⟧. وعندما تتكون الرحلة من مراحل فإن متوسط السرعة لا يساوي متوسط السرعتين إلا إذا تساوت الأزمنة.</p>
<div class="box ex"><b>✎ مثال</b>قطعت سيارة ⟦120 km⟧ بسرعة ⟦60 km/h⟧ ثم ⟦120 km⟧ بسرعة ⟦40 km/h⟧. ما متوسط سرعتها؟<span class="sol">الحل: الزمنان ⟦2 h⟧ و⟦3 h⟧، فالمتوسط ⟦240/5 = 48 km/h⟧ وليس ⟦50 km/h⟧.</span></div>`,
 q: [['قطع جسم ⟦30 m⟧ في ⟦5 s⟧ ثم ⟦50 m⟧ في ⟦15 s⟧. متوسط سرعته', ['⟦4 m/s⟧', '⟦4.67 m/s⟧', '⟦6 m/s⟧', '⟦8 m/s⟧'], 0, '⟦(30 + 50)/(5 + 15) = 80/20 = 4 m/s⟧.']] },
 { h: 'منحنى الموقع – الزمن والحركة النسبية', html: `
<p>في منحنى (الموقع – الزمن): <b>الميل = السرعة المتجهة</b>. الخط المستقيم يعني سرعة ثابتة، والخط الأفقي يعني سكونًا، والميل السالب يعني حركة في الاتجاه السالب، والمنحنى المتقوس يعني تغيرًا في السرعة (تسارعًا). ونقطة تقاطع منحنيي جسمين تعني أنهما في الموقع نفسه في تلك اللحظة.</p>
<p><b>السرعة المتجهة النسبية:</b> سرعة الجسم a بالنسبة إلى c تساوي ⟦v_{a/c} = v_{a/b} + v_{b/c}⟧. شخص يمشي بسرعة ⟦1 m/s⟧ داخل قطار سرعته ⟦20 m/s⟧ في الاتجاه نفسه سرعته بالنسبة إلى الأرض ⟦21 m/s⟧، وإن مشى عكسه فـ ⟦19 m/s⟧. وقارب يعبر نهرًا عموديًا على التيار: سرعته المحصلة ⟦√(v_{قارب}^{2} + v_{ماء}^{2})⟧.</p>`,
 q: [['خط أفقي في منحنى (الموقع – الزمن) يعني أن الجسم', ['يتحرك بسرعة ثابتة', 'ساكن', 'يتسارع', 'يتباطأ'], 1, 'الميل صفر ⇐ السرعة صفر ⇐ الجسم ساكن.'],
     ['قارب سرعته ⟦4 m/s⟧ عموديًا على تيار نهر سرعته ⟦3 m/s⟧. سرعته بالنسبة إلى الشاطئ', ['⟦1 m/s⟧', '⟦5 m/s⟧', '⟦7 m/s⟧', '⟦12 m/s⟧'], 1, '⟦√(16 + 9) = 5 m/s⟧.']] }],
 cards: [['الإزاحة', '⟦Δd = d_{f} − d_{i}⟧ (متجهة)'], ['المسافة', 'طول المسار الفعلي (قياسية)'], ['السرعة المتجهة المتوسطة', '⟦v̄ = Δd/Δt⟧'], ['ميل (الموقع – الزمن)', 'السرعة المتجهة'], ['خط أفقي في (d–t)', 'سكون'], ['متوسط السرعة لرحلة مراحل', 'المسافة الكلية ÷ الزمن الكلي'], ['السرعة النسبية', '⟦v_{a/c} = v_{a/b} + v_{b/c}⟧']] },

{ n: '1-4', t: 'التسارع ومعادلات الحركة', parts: [
 { h: 'التسارع', html: `
<p><b>التسارع</b> معدل تغير السرعة المتجهة: ⟦a = Δv/Δt = (v_{f} − v_{i})/(t_{f} − t_{i})⟧، ووحدته ⟦m/s^{2}⟧. التسارع الثابت يعني أن السرعة تتغير بالمقدار نفسه كل ثانية.</p>
<p><b>إشارة التسارع:</b> إذا كان التسارع في اتجاه السرعة يزداد مقدار السرعة، وإذا عاكسها يتباطأ الجسم. فالجسم المتحرك في الاتجاه السالب بتسارع سالب يزداد مقدار سرعته! ويتسارع الجسم كذلك إذا تغير اتجاه سرعته فقط (كالحركة الدائرية).</p>
<p><b>منحنى (السرعة المتجهة – الزمن):</b> الميل = التسارع، و<b>المساحة تحت المنحنى = الإزاحة</b>. وفي منحنى (التسارع – الزمن) المساحة = التغير في السرعة.</p>
<div class="box ex"><b>✎ مثال</b>زادت سرعة دراجة من ⟦4 m/s⟧ إلى ⟦10 m/s⟧ خلال ⟦3 s⟧. ما تسارعها؟ وما إزاحتها؟<span class="sol">الحل: ⟦a = (10 − 4)/3 = 2 m/s^{2}⟧. الإزاحة = مساحة شبه المنحرف = ⟦½(4 + 10)×3 = 21 m⟧.</span></div>`,
 q: [['جسم سرعته ⟦−8 m/s⟧ وتسارعه ⟦−2 m/s^{2}⟧. مقدار سرعته', ['يتناقص', 'يزداد', 'ثابت', 'يصبح صفرًا بعد ⟦4 s⟧'], 1, 'السرعة والتسارع في الاتجاه نفسه (كلاهما سالب) فيزداد مقدار السرعة.'],
     ['المساحة تحت منحنى (السرعة المتجهة – الزمن) تمثل', ['التسارع', 'الإزاحة', 'الزمن', 'القوة'], 1, 'المساحة ⟦= v × t⟧ = إزاحة.']] },
 { h: 'معادلات الحركة بتسارع ثابت', html: `
<p>يكتبها كتاب المنهج بدلالة الموقع: ⟦v_{f} = v_{i} + a t_{f}⟧، ⟦d_{f} = d_{i} + v_{i}t_{f} + ½at_{f}^{2}⟧، ⟦v_{f}^{2} = v_{i}^{2} + 2a(d_{f} − d_{i})⟧. وبكتابة الإزاحة ⟦Δd⟧:</p>
<table class="tbl"><tr><th>المعادلة</th><th>الكمية الغائبة</th></tr>
<tr><td>⟦v_{f} = v_{i} + at⟧</td><td>الإزاحة</td></tr><tr><td>⟦Δd = v_{i}t + ½at^{2}⟧</td><td>السرعة النهائية</td></tr>
<tr><td>⟦v_{f}^{2} = v_{i}^{2} + 2aΔd⟧</td><td>الزمن</td></tr><tr><td>⟦Δd = ½(v_{i} + v_{f})t⟧</td><td>التسارع</td></tr></table>
<p><b>خطة الحل:</b> اكتب المعطيات الثلاثة والمطلوب، ثم اختر المعادلة التي لا تحتوي الكمية الغائبة. والجسم «يبدأ من السكون» ⇐ ⟦v_{i} = 0⟧، و«يتوقف» ⇐ ⟦v_{f} = 0⟧.</p>
<div class="box ex"><b>✎ مثال: مسافة التوقف</b>سيارة سرعتها ⟦20 m/s⟧ ضغط سائقها الكابح فتباطأت بمعدل ⟦5 m/s^{2}⟧. ما المسافة حتى تتوقف؟ وكم تستغرق؟<span class="sol">الحل: ⟦0 = 400 − 2×5×Δd ⇒ Δd = 40 m⟧. والزمن ⟦t = (0 − 20)/(−5) = 4 s⟧.</span></div>
<div class="box warn"><b>⚠️ زمن رد الفعل</b>إذا ذُكر زمن رد فعل للسائق فالسيارة تقطع خلاله مسافة بسرعة ثابتة ⟦(v × t)⟧ قبل بدء التباطؤ، تُضاف إلى مسافة الكبح.</div>`,
 q: [['جسم بدأ من السكون بتسارع ⟦4 m/s^{2}⟧. إزاحته في أول ⟦5 s⟧', ['⟦20 m⟧', '⟦50 m⟧', '⟦100 m⟧', '⟦10 m⟧'], 1, '⟦Δd = ½×4×25 = 50 m⟧.'],
     ['جسم سرعته ⟦10 m/s⟧ تسارع بانتظام فقطع ⟦24 m⟧ وصارت سرعته ⟦14 m/s⟧. تسارعه', ['⟦1 m/s^{2}⟧', '⟦2 m/s^{2}⟧', '⟦4 m/s^{2}⟧', '⟦0.5 m/s^{2}⟧'], 1, '⟦196 = 100 + 2a×24 ⇒ a = 96/48 = 2 m/s^{2}⟧.']] }],
 cards: [['التسارع', '⟦a = Δv/Δt⟧'], ['ميل (v–t)', 'التسارع'], ['المساحة تحت (v–t)', 'الإزاحة'], ['معادلة بلا إزاحة', '⟦v_{f} = v_{i} + at⟧'], ['معادلة بلا سرعة نهائية', '⟦Δd = v_{i}t + ½at^{2}⟧'], ['معادلة بلا زمن', '⟦v_{f}^{2} = v_{i}^{2} + 2aΔd⟧'], ['معادلة بلا تسارع', '⟦Δd = ½(v_{i} + v_{f})t⟧'], ['تسارع عكس السرعة', 'الجسم يتباطأ']] },

{ n: '1-5', t: 'السقوط الحر', parts: [
 { h: 'تسارع الجاذبية', html: `
<p><b>السقوط الحر</b> حركة جسم تحت تأثير الجاذبية وحدها (بإهمال مقاومة الهواء). كل الأجسام تسقط بالتسارع نفسه ⟦g ≈ 9.8 m/s^{2}⟧ نحو الأسفل (⟦10 m/s^{2}⟧ في أسئلة الاختبار)، <b>مهما اختلفت كتلها</b>؛ لذلك تصل كرة ثقيلة وأخرى خفيفة أُسقطتا معًا من الارتفاع نفسه في الوقت نفسه.</p>
<p>نستعمل معادلات الحركة نفسها مع ⟦a = −g⟧ إذا اعتبرنا الأعلى موجبًا. ومن السكون: ⟦v_{f} = gt⟧، ⟦Δd = ½gt^{2}⟧، ⟦v_{f}^{2} = 2gΔd⟧.</p>

 { h: 'القذف الرأسي', html: `
<p>جسم قُذف رأسيًا إلى أعلى بسرعة ⟦v_{i}⟧: يتباطأ بمعدل g حتى تنعدم سرعته عند أقصى ارتفاع، ثم يعود ويتسارع نحو الأسفل.</p>
<ul><li>زمن الصعود ⟦t = v_{i}/g⟧، وزمن التحليق الكلي (العودة إلى نقطة القذف) ⟦2v_{i}/g⟧.</li><li>أقصى ارتفاع ⟦h = v_{i}^{2}/(2g)⟧.</li><li>يعود إلى نقطة القذف بالسرعة نفسها مقدارًا وعكسها اتجاهًا، وسرعته عند أي ارتفاع متساوية صعودًا ونزولًا.</li></ul>

{ n: '1-6', t: 'حركة المقذوف في بعدين', parts: [
 { h: 'استقلال الحركتين', html: `
<p>المقذوف جسم يتحرك تحت تأثير الجاذبية وحدها بعد إطلاقه، ومساره <b>قطع مكافئ</b>. السر في الحل: الحركة <b>الأفقية</b> مستقلة عن <b>الرأسية</b>:</p>
<ul><li>أفقيًا: لا قوة (بإهمال الهواء) ⇐ سرعة ثابتة ⟦v_{x}⟧ و⟦x = v_{x}t⟧.</li><li>رأسيًا: سقوط حر بتسارع ⟦g⟧.</li></ul>

 q: [['أُطلقت كرتان أفقيًا من الارتفاع نفسه بسرعتين ⟦5 m/s⟧ و⟦10 m/s⟧. أيهما تصل الأرض أولًا؟', ['الأسرع', 'الأبطأ', 'تصلان معًا', 'يعتمد على الكتلة'], 2, 'زمن السقوط يعتمد على الارتفاع فقط.']] },
 { h: 'القذف بزاوية', html: `

<div class="box ex"><b>✎ مثال</b>رُكلت كرة بسرعة ⟦20 m/s⟧ بزاوية ⟦30°⟧. ما زمن تحليقها ومداها وأقصى ارتفاع؟<span class="sol">الحل: ⟦v_{y} = 10 m/s⟧ و⟦v_{x} ≈ 17.3 m/s⟧. زمن التحليق ⟦2 s⟧، والمدى ⟦≈ 34.6 m⟧، وأقصى ارتفاع ⟦100/20 = 5 m⟧.</span></div>`,

 cards: [['مسار المقذوف', 'قطع مكافئ'], ['الحركة الأفقية للمقذوف', 'سرعة ثابتة'], ['الحركة الرأسية للمقذوف', 'سقوط حر'], ['زمن سقوط مقذوف أفقي', '⟦√(2h/g)⟧ يعتمد على الارتفاع فقط'], ['السرعة عند أعلى نقطة', 'المركبة الأفقية فقط'], ['زاوية أكبر مدى', '⟦45°⟧'], ['زاويتان بالمدى نفسه', 'متتامتان (⟦30°⟧ و⟦60°⟧)']] }
]});

{ n: '2-1', t: 'القوة وقوانين نيوتن', parts: [
 { h: 'القوة ومخطط الجسم الحر', html: `
<p><b>القوة</b> دفع أو سحب يؤثر في جسم، وهي متجهة وحدتها النيوتن ⟦N⟧. قوى التلامس (الدفع، الشد، الاحتكاك، القوة العمودية) وقوى المجال التي تؤثر عن بُعد (الجاذبية، الكهربائية، المغناطيسية).</p>
<p><b>مخطط الجسم الحر:</b> نرسم الجسم نقطة، ونرسم كل القوى المؤثرة <b>فيه</b> أسهمًا خارجة منها، ثم نجد <b>القوة المحصلة</b> ⟦F_{محصلة}⟧ = المجموع المتجه لكل القوى.</p>`,
 q: [['أي القوى التالية قوة مجال؟', ['قوة الشد', 'قوة الاحتكاك', 'قوة الجاذبية', 'القوة العمودية'], 2, 'الجاذبية تؤثر عن بُعد دون تلامس.']] },
 { h: 'القانون الأول: القصور الذاتي', html: `
<p>«يبقى الجسم ساكنًا أو متحركًا بسرعة متجهة ثابتة في خط مستقيم ما لم تؤثر فيه قوة محصلة.» <b>القصور الذاتي</b> ممانعة الجسم لتغيير حالته الحركية، ويزداد بزيادة الكتلة.</p>
<p><b>الاتزان:</b> إذا كانت ⟦F_{محصلة} = 0⟧ فالجسم متزن: إما ساكن (اتزان سكوني) أو يتحرك بسرعة متجهة ثابتة (اتزان حركي). لذلك سيارة تسير بسرعة ثابتة على طريق مستقيم محصلة القوى عليها صفر.</p>
<div class="box note"><b>✎ من الحياة</b>يندفع الراكب إلى الأمام عند توقف الحافلة فجأة، لأن جسمه يميل إلى الاستمرار في حركته؛ وحزام الأمان يوفر القوة اللازمة لإيقافه.</div>`,
 q: [['طائرة تطير أفقيًا بسرعة ثابتة في خط مستقيم. القوة المحصلة عليها', ['في اتجاه الحركة', 'صفر', 'إلى الأسفل', 'تساوي وزنها'], 1, 'سرعة متجهة ثابتة ⇐ اتزان ⇐ ⟦F_{محصلة} = 0⟧.']] },
 { h: 'القانون الثاني: ⟦F_{محصلة} = ma⟧', html: `
<p>تسارع الجسم يتناسب طرديًا مع القوة المحصلة وعكسيًا مع كتلته: ⟦a = F_{محصلة}/m⟧، والتسارع في اتجاه القوة المحصلة. ⟦1 N⟧ هي القوة التي تكسب ⟦1 kg⟧ تسارعًا ⟦1 m/s^{2}⟧.</p>
<p><b>خطوات الحل:</b> (1) ارسم مخطط الجسم الحر. (2) اختر اتجاهًا موجبًا (اتجاه الحركة غالبًا). (3) اجمع القوى في كل محور. (4) طبّق ⟦F_{محصلة} = ma⟧.</p>
<div class="box ex"><b>✎ مثال: جسمان مربوطان</b>صندوقان ⟦2 kg⟧ و⟦3 kg⟧ على سطح أملس مربوطان بخيط، وتسحب الأول قوة ⟦20 N⟧. ما التسارع وما الشد في الخيط؟<span class="sol">الحل: للنظام ⟦a = 20/(2 + 3) = 4 m/s^{2}⟧. الخيط وحده يسحب الصندوق الخلفي ⟦(3 kg)⟧: ⟦T = 3×4 = 12 N⟧.</span></div>`,
 q: [['إذا تضاعفت القوة المحصلة على جسم وقلت كتلته إلى النصف، فإن تسارعه يصبح', ['مثليه', 'أربعة أمثاله', 'نصفه', 'كما هو'], 1, '⟦a = F/m = (2F)/(m/2) = 4F/m⟧.']] },
 { h: 'القانون الثالث: الفعل ورد الفعل', html: `
<p>«إذا أثر جسم A في جسم B بقوة، أثر B في A بقوة مساوية لها مقدارًا ومعاكسة اتجاهًا»: ⟦F_{A على B} = −F_{B على A}⟧. هاتان القوتان <b>زوج تأثير متبادل</b>، تؤثران في <b>جسمين مختلفين</b>، ومن النوع نفسه، فلا تلغي إحداهما الأخرى.</p>
<div class="box warn"><b>⚠️ تمييز مهم</b>وزن كتاب على طاولة والقوة العمودية عليه ليستا زوج فعل ورد فعل، لأنهما تؤثران في الجسم نفسه. زوج وزن الكتاب (جذب الأرض للكتاب) هو جذب الكتاب للأرض.</div>
<p><b>الشد:</b> قوة يؤثر بها حبل أو خيط، وفي حبل مهمل الكتلة يكون الشد واحدًا عند طرفيه.</p>`,
 q: [['تجذب الأرض تفاحة بقوة ⟦2 N⟧. التفاحة تجذب الأرض بقوة', ['صفر', 'أقل من ⟦2 N⟧ بكثير', '⟦2 N⟧ نحو التفاحة', '⟦2 N⟧ نحو الأسفل'], 2, 'القانون الثالث: القوتان متساويتان مقدارًا متعاكستان اتجاهًا؛ لكن تسارع الأرض لا يُلاحظ لضخامة كتلتها.']] }],
 cards: [['القانون الأول لنيوتن', 'القصور الذاتي: لا تتغير الحركة إلا بقوة محصلة'], ['الاتزان', '⟦F_{محصلة} = 0⟧ (ساكن أو سرعة ثابتة)'], ['القانون الثاني', '⟦F_{محصلة} = ma⟧'], ['⟦1 N⟧', '⟦1 kg·m/s^{2}⟧'], ['القانون الثالث', '⟦F_{A على B} = −F_{B على A}⟧'], ['زوج الفعل ورد الفعل', 'يؤثران في جسمين مختلفين']] },

{ n: '2-2', t: 'الوزن والقوة العمودية والمصعد', parts: [
 { h: 'الكتلة والوزن', html: `
<p><b>الكتلة</b> مقدار ما في الجسم من مادة ومقياس لقصوره الذاتي، وهي ثابتة لا تتغير بتغير المكان. <b>الوزن (قوة الجاذبية)</b> ⟦F_{g} = mg⟧ يتجه نحو مركز الأرض، ويتغير بتغير g؛ فجسم كتلته ⟦60 kg⟧ وزنه على الأرض ⟦600 N⟧، وعلى القمر (⟦g ≈ 1.6 m/s^{2}⟧) ⟦96 N⟧، وكتلته ⟦60 kg⟧ في الحالتين.</p>
<p>الميزان النابضي يقيس القوة التي يؤثر بها الجسم عليه (الوزن الظاهري)، أما الميزان ذو الكفتين فيقارن الكتل.</p>`,
 q: [['رائد فضاء كتلته ⟦70 kg⟧ على سطح القمر. كتلته هناك', ['أقل من ⟦70 kg⟧', '⟦70 kg⟧', 'صفر', 'أكبر من ⟦70 kg⟧'], 1, 'الكتلة لا تتغير بتغير المكان.']] },
 { h: 'القوة العمودية والوزن الظاهري في المصعد', html: `
<p><b>القوة العمودية</b> ⟦F_{N}⟧ قوة يؤثر بها السطح عموديًا عليه. على سطح أفقي دون قوى رأسية أخرى ⟦F_{N} = mg⟧. وإذا دُفع الجسم نحو السطح زادت، وإذا سُحب بزاوية إلى أعلى قلت.</p>
<p><b>الوزن الظاهري</b> قراءة الميزان = ⟦F_{N}⟧. في المصعد نطبق ⟦F_{N} − mg = ma⟧ (الأعلى موجب):</p>
<table class="tbl"><tr><th>حالة المصعد</th><th>⟦F_{N}⟧</th><th>القراءة</th></tr>
<tr><td>ساكن أو بسرعة ثابتة</td><td>⟦mg⟧</td><td>الوزن الحقيقي</td></tr>
<tr><td>يتسارع إلى أعلى (أو يتباطأ نازلًا)</td><td>⟦m(g + a)⟧</td><td>أكبر</td></tr>
<tr><td>يتسارع إلى أسفل (أو يتباطأ صاعدًا)</td><td>⟦m(g − a)⟧</td><td>أقل</td></tr>
<tr><td>سقوط حر ⟦(a = g)⟧</td><td>صفر</td><td>انعدام الوزن الظاهري</td></tr></table>
<div class="box ex"><b>✎ مثال</b>شخص كتلته ⟦50 kg⟧ في مصعد يتسارع إلى أعلى بـ ⟦2 m/s^{2}⟧. ما قراءة الميزان؟<span class="sol">الحل: ⟦F_{N} = 50(10 + 2) = 600 N⟧ (وزنه الحقيقي ⟦500 N⟧).</span></div>
<div class="box note"><b>✎ انعدام الوزن</b>رواد الفضاء في المحطة يدورون حول الأرض في سقوط حر مستمر مع مركبتهم، فلا يضغط أحدهما على الآخر؛ والجاذبية هناك لا تنعدم (نحو 90٪ من قيمتها على السطح).</div>`,
 q: [['شخص في مصعد يتحرك إلى أسفل بسرعة ثابتة. قراءة الميزان', ['أكبر من وزنه', 'أقل من وزنه', 'تساوي وزنه', 'صفر'], 2, 'السرعة ثابتة ⇐ ⟦a = 0⟧ ⇐ ⟦F_{N} = mg⟧.']] },
 { h: 'السرعة الحدية', html: `
<p>عند سقوط جسم في الهواء تزداد قوة مقاومة الهواء بزيادة سرعته حتى تساوي وزنه، فتصبح المحصلة صفرًا ويسقط بسرعة ثابتة تسمى <b>السرعة الحدية</b>. المظلة تزيد مساحة المقاومة فتقلل السرعة الحدية.</p>`,
 q: [['عندما يصل مظلي إلى سرعته الحدية فإن', ['مقاومة الهواء صفر', 'مقاومة الهواء تساوي وزنه', 'تسارعه ⟦g⟧', 'وزنه صفر'], 1, 'المحصلة صفر ⇐ سرعة ثابتة.']] }],
 cards: [['الوزن', '⟦F_{g} = mg⟧ نحو مركز الأرض'], ['الكتلة', 'ثابتة لا تتغير بتغير المكان'], ['القوة العمودية على سطح أفقي', '⟦F_{N} = mg⟧'], ['مصعد يتسارع لأعلى', '⟦F_{N} = m(g + a)⟧'], ['مصعد يتسارع لأسفل', '⟦F_{N} = m(g − a)⟧'], ['السرعة الحدية', 'مقاومة الهواء = الوزن']] },

{ n: '2-3', t: 'الاحتكاك', parts: [
 { h: 'الاحتكاك السكوني والحركي', html: `
<p><b>الاحتكاك</b> قوة تنشأ بين سطحين متلامسين وتعاكس الحركة النسبية أو محاولتها.</p>
<ul><li><b>الاحتكاك السكوني</b> ⟦f_{s} ≤ μ_{s}F_{N}⟧: يمنع الجسم من الحركة، ويساوي القوة المؤثرة حتى يبلغ حده الأقصى ⟦μ_{s}F_{N}⟧.</li>
<li><b>الاحتكاك الحركي</b> ⟦f_{k} = μ_{k}F_{N}⟧: يؤثر أثناء الانزلاق، وقيمته ثابتة تقريبًا لا تعتمد على السرعة ولا على مساحة التلامس.</li></ul>
<p>⟦μ⟧ معامل الاحتكاك بلا وحدة، ويعتمد على نوع السطحين، وعادة ⟦μ_{s} > μ_{k}⟧؛ لذلك بدء تحريك الجسم أصعب من إبقائه متحركًا.</p>
<div class="box ex"><b>✎ مثال</b>صندوق ⟦10 kg⟧ على أرض أفقية، ⟦μ_{s} = 0.4⟧ و⟦μ_{k} = 0.3⟧. أثرت فيه قوة أفقية ⟦30 N⟧. هل يتحرك؟ وإن أثرت ⟦50 N⟧ فما تسارعه؟<span class="sol">الحل: ⟦F_{N} = 100 N⟧، والحد الأقصى للسكوني ⟦40 N⟧. القوة ⟦30 N⟧ أقل فلا يتحرك (والاحتكاك ⟦30 N⟧). مع ⟦50 N⟧ يتحرك: ⟦f_{k} = 30 N⟧، ⟦a = (50 − 30)/10 = 2 m/s^{2}⟧.</span></div>`,
 q: [['صندوق ساكن على أرض أفقية تؤثر فيه قوة أفقية ⟦12 N⟧ ولا يتحرك. قوة الاحتكاك السكوني', ['صفر', '⟦12 N⟧', 'أكبر من ⟦12 N⟧', '⟦μ_{s}mg⟧ دائمًا'], 1, 'الجسم متزن، فالاحتكاك السكوني يساوي القوة المؤثرة.'],
     ['جسم ⟦5 kg⟧ ينزلق على سطح أفقي ⟦μ_{k} = 0.2⟧ دون قوى أخرى أفقية. مقدار تباطئه', ['⟦0.2 m/s^{2}⟧', '⟦1 m/s^{2}⟧', '⟦2 m/s^{2}⟧', '⟦10 m/s^{2}⟧'], 2, '⟦a = μ_{k}g = 0.2×10 = 2 m/s^{2}⟧ ولا تعتمد على الكتلة.']] }],
 cards: [['الاحتكاك الحركي', '⟦f_{k} = μ_{k}F_{N}⟧'], ['الاحتكاك السكوني', '⟦f_{s} ≤ μ_{s}F_{N}⟧'], ['عادة', '⟦μ_{s} > μ_{k}⟧'], ['هل يعتمد الاحتكاك على مساحة التلامس؟', 'لا'], ['اتجاه الاحتكاك', 'عكس الحركة النسبية'], ['تباطؤ جسم ينزلق أفقيًا', '⟦a = μ_{k}g⟧']] },

{ n: '2-4', t: 'الاتزان والمستوى المائل', parts: [
 { h: 'شروط الاتزان والقوة الموازنة', html: `
<p>للاتزان تحت تأثير عدة قوى: مجموع المركبات السينية صفر ومجموع المركبات الصادية صفر. <b>القوة الموازنة</b> قوة تساوي المحصلة مقدارًا وتعاكسها اتجاهًا، فتجعل الجسم متزنًا.</p>
<div class="box ex"><b>✎ مثال</b>علّقت لوحة وزنها ⟦100 N⟧ بحبلين يصنع كل منهما ⟦30°⟧ مع الأفقي. ما الشد في كل حبل؟<span class="sol">الحل: المركبتان الرأسيتان توازنان الوزن: ⟦2T sin 30° = 100 ⇒ T = 100 N⟧.</span></div>`,
 q: [['قوتان متعامدتان ⟦3 N⟧ و⟦4 N⟧ تؤثران في جسم. القوة الموازنة مقدارها', ['⟦7 N⟧', '⟦5 N⟧', '⟦1 N⟧', '⟦12 N⟧'], 1, 'تساوي المحصلة ⟦5 N⟧ وتعاكسها.']] },
 { h: 'المستوى المائل', html: `
<p>نختار المحور x موازيًا للسطح والمحور y عموديًا عليه، ونحلل الوزن:</p>
<ul><li>موازية للسطح (إلى أسفل المنحدر): ⟦F_{g∥} = mg sin θ⟧.</li><li>عمودية على السطح: ⟦F_{g⊥} = mg cos θ⟧، لذلك ⟦F_{N} = mg cos θ⟧.</li></ul>
<p>على مستوى أملس: ⟦a = g sin θ⟧ (يزداد بزيادة الزاوية ولا يعتمد على الكتلة). ومع الاحتكاك أثناء الانزلاق إلى أسفل: ⟦a = g(sin θ − μ_{k} cos θ)⟧. ويبقى الجسم ساكنًا إذا كان ⟦tan θ ≤ μ_{s}⟧.</p>
<div class="box ex"><b>✎ مثال</b>جسم على مستوى أملس يميل ⟦30°⟧. ما تسارعه؟<span class="sol">الحل: ⟦a = 10 × sin 30° = 5 m/s^{2}⟧ إلى أسفل المستوى.</span></div>`,
 q: [['جسم كتلته ⟦4 kg⟧ على مستوى يميل ⟦30°⟧. مركبة وزنه الموازية للمستوى', ['⟦40 N⟧', '⟦20 N⟧', '⟦34.6 N⟧', '⟦10 N⟧'], 1, '⟦mg sin 30° = 40×0.5 = 20 N⟧.']] }],
 cards: [['شرط الاتزان', 'مجموع القوى في كل محور = صفر'], ['القوة الموازنة', 'تساوي المحصلة وتعاكسها'], ['مركبة الوزن على المستوى', '⟦mg sin θ⟧'], ['القوة العمودية على المستوى', '⟦mg cos θ⟧'], ['تسارع جسم على مستوى أملس', '⟦a = g sin θ⟧']] },

{ n: '2-5', t: 'الحركة الدائرية', parts: [
 { h: 'التسارع المركزي والقوة المركزية', html: `
<p>جسم يتحرك في دائرة بسرعة ثابتة المقدار (<b>حركة دائرية منتظمة</b>) يتسارع لأن اتجاه سرعته يتغير باستمرار. السرعة مماسية للمسار، والتسارع نحو المركز:</p>
<p>⟦a_{c} = v^{2}/r⟧، و⟦v = 2πr/T⟧ حيث T الزمن الدوري، ومنه ⟦a_{c} = 4π^{2}r/T^{2}⟧.</p>
<p><b>القوة المركزية</b> ⟦F_{c} = ma_{c} = mv^{2}/r⟧ ليست قوة جديدة، بل محصلة القوى نحو المركز: الشد في خيط حجر يدور، والاحتكاك لسيارة تنعطف، والجاذبية لقمر يدور حول كوكب.</p>
<div class="box warn"><b>⚠️ لا توجد قوة طاردة</b>ما تشعر به في السيارة عند الانعطاف هو قصورك الذاتي. وعند قطع خيط الحجر يتحرك في اتجاه المماس لا نحو الخارج.</div>
<div class="box ex"><b>✎ مثال</b>سيارة كتلتها ⟦1000 kg⟧ تنعطف بسرعة ⟦10 m/s⟧ في منعطف نصف قطره ⟦50 m⟧. ما القوة المركزية اللازمة؟ وما أقل معامل احتكاك يحققها؟<span class="sol">الحل: ⟦F_{c} = 1000×100/50 = 2000 N⟧، و⟦μ = F_{c}/mg = 2000/10000 = 0.2⟧.</span></div>`,
 q: [['إذا تضاعفت سرعة جسم في مسار دائري ثابت نصف القطر، فإن القوة المركزية', ['تتضاعف', 'تصبح أربعة أمثالها', 'تقل للنصف', 'لا تتغير'], 1, '⟦F_{c} ∝ v^{2}⟧.'],
     ['جسم يدور في دائرة نصف قطرها ⟦2 m⟧ بسرعة ⟦4 m/s⟧. تسارعه المركزي', ['⟦2 m/s^{2}⟧', '⟦8 m/s^{2}⟧', '⟦16 m/s^{2}⟧', '⟦32 m/s^{2}⟧'], 1, '⟦16/2 = 8 m/s^{2}⟧.']] }],
 cards: [['التسارع المركزي', '⟦a_{c} = v^{2}/r⟧ نحو المركز'], ['القوة المركزية', '⟦F_{c} = mv^{2}/r⟧'], ['السرعة في الدائرة', '⟦v = 2πr/T⟧'], ['اتجاه السرعة في الحركة الدائرية', 'مماسي'], ['قطع خيط حجر يدور', 'يتحرك في اتجاه المماس']] },

{ n: '2-6', t: 'الجاذبية وحركة الكواكب', parts: [
 { h: 'قوانين كبلر', html: `
<ol><li><b>الأول:</b> تدور الكواكب في مدارات إهليلجية (بيضاوية) تقع الشمس في إحدى بؤرتيها.</li>
<li><b>الثاني:</b> الخط الواصل بين الشمس والكوكب يمسح مساحات متساوية في أزمنة متساوية؛ فالكوكب أسرع عندما يكون أقرب إلى الشمس.</li>
<li><b>الثالث:</b> ⟦(T_{A}/T_{B})^{2} = (r_{A}/r_{B})^{3}⟧ لجسمين يدوران حول الجسم نفسه.</li></ol>
<div class="box ex"><b>✎ مثال</b>كوكب بُعده عن الشمس ⟦4⟧ أمثال بُعد الأرض. كم سنة زمنه الدوري؟<span class="sol">الحل: ⟦T^{2} = 4^{3} = 64 ⇒ T = 8⟧ سنوات.</span></div>`,
 q: [['حسب قانون كبلر الثاني، سرعة الكوكب في مداره تكون أكبر عندما يكون', ['أبعد عن الشمس', 'أقرب إلى الشمس', 'ثابتة دائمًا', 'في منتصف المسافة'], 1, 'مساحات متساوية في أزمنة متساوية ⇐ أسرع قرب الشمس.']] },
 { h: 'قانون الجذب الكوني والمجال الجاذبي', html: `
<p>⟦F = G m_{A}m_{B}/r^{2}⟧ حيث ⟦G = 6.67×10^{−11} N·m^{2}/kg^{2}⟧ و r المسافة بين المركزين. القوة تجاذب دائمًا، وتتناسب عكسيًا مع مربع المسافة: مضاعفة المسافة ⇐ ربع القوة، وثلاثة أمثالها ⇐ ⟦1/9⟧.</p>
<p><b>المجال الجاذبي:</b> ⟦g = F/m = GM/r^{2}⟧؛ يقل بالبعد عن مركز الأرض. وسرعة قمر صناعي في مدار دائري: ⟦v = √(GM/r)⟧، وزمنه الدوري ⟦T = 2π√(r^{3}/(GM))⟧، ولا يعتمدان على كتلة القمر.</p>
<p><b>كتلة القصور وكتلة الجاذبية</b> متساويتان؛ لذلك تسقط الأجسام كلها بالتسارع نفسه.</p>`,
 q: [['إذا قلّت المسافة بين جسمين إلى النصف، فإن قوة الجاذبية بينهما تصبح', ['نصف ما كانت', 'ضعف ما كانت', 'أربعة أمثالها', 'ربع ما كانت'], 2, '⟦F ∝ 1/r^{2}⟧ ⇐ ⟦1/(½)^{2} = 4⟧.']] }],
 cards: [['كبلر الأول', 'مدارات إهليلجية والشمس في بؤرة'], ['كبلر الثاني', 'مساحات متساوية في أزمنة متساوية'], ['كبلر الثالث', '⟦(T_{A}/T_{B})^{2} = (r_{A}/r_{B})^{3}⟧'], ['الجذب الكوني', '⟦F = G m_{A}m_{B}/r^{2}⟧'], ['المجال الجاذبي', '⟦g = GM/r^{2}⟧'], ['سرعة قمر صناعي', '⟦v = √(GM/r)⟧'], ['مضاعفة المسافة', 'القوة تصبح الربع']] }
]});

COURSE.units.push({ id: 'u3', week: 2, num: '3', title: 'الحركة الدورانية والزخم والطاقة', en: 'Rotation, Momentum & Energy', d: 2, ex: ['3.1', '3.2'],
sub: 'العزم والاتزان الدوراني، الزخم والدفع والتصادمات، الشغل والقدرة، الطاقة وحفظها، الآلات البسيطة',
lessons: [
{ n: '3-1', t: 'الحركة الدورانية والعزم', parts: [
 { h: 'وصف الحركة الدورانية', html: `
<p>نقيس الدوران بالزاوية بالراديان: الدورة الكاملة ⟦2π rad = 360°⟧. <b>الإزاحة الزاوية</b> ⟦θ⟧، و<b>السرعة الزاوية</b> ⟦ω = Δθ/Δt⟧ بوحدة ⟦rad/s⟧، و<b>التسارع الزاوي</b> ⟦α = Δω/Δt⟧ بوحدة ⟦rad/s^{2}⟧.</p>
<p>العلاقة بين الحركة الخطية لنقطة على بعد r من المحور والحركة الزاوية: ⟦d = rθ⟧، ⟦v = rω⟧، ⟦a = rα⟧. فكل نقاط الجسم الصلب لها السرعة الزاوية نفسها، لكن السرعة الخطية تزداد بالبعد عن المحور.</p>`,
 q: [['نقطتان على قرص دوّار، الأولى على بعد ⟦10 cm⟧ والثانية على بعد ⟦20 cm⟧ من المحور. السرعة الخطية للثانية', ['نصف الأولى', 'تساوي الأولى', 'ضعف الأولى', 'أربعة أمثال الأولى'], 2, '⟦v = rω⟧ و⟦ω⟧ واحدة لكل النقاط.']] },
 { h: 'العزم وذراع القوة', html: `
<p><b>العزم</b> ⟦τ⟧ مقياس قدرة القوة على إحداث الدوران: ⟦τ = F r sin θ = F L⟧، حيث ⟦L = r sin θ⟧ <b>ذراع القوة</b> (البعد العمودي بين محور الدوران وخط عمل القوة)، ووحدته ⟦N·m⟧. أكبر عزم عندما تكون القوة عمودية على الذراع ⟦(θ = 90°)⟧، والعزم صفر إذا مر خط عمل القوة بالمحور. لذلك مقبض الباب بعيد عن المفصلات.</p>
<p><b>عزم القصور الذاتي</b> ⟦I⟧ ممانعة الجسم لتغيير حركته الدورانية، ويعتمد على الكتلة وتوزيعها حول المحور (كلما بعدت الكتلة عن المحور زاد). والقانون الثاني للدوران: ⟦α = τ_{محصلة}/I⟧.</p>
<div class="box ex"><b>✎ مثال</b>مفتاح ربط طوله ⟦0.25 m⟧ أُثرت عند طرفه قوة ⟦40 N⟧ عمودية عليه. ما العزم؟<span class="sol">الحل: ⟦τ = 40 × 0.25 = 10 N·m⟧.</span></div>`,
 q: [['لزيادة العزم الذي تحدثه القوة نفسها على صامولة نستعمل', ['مفتاحًا أقصر', 'مفتاحًا أطول ونؤثر عموديًا عليه', 'قوة موازية للمفتاح', 'قوة تمر بمحور الدوران'], 1, '⟦τ = F r sin θ⟧: زيادة r وجعل ⟦θ = 90°⟧.']] },
 { h: 'الاتزان الدوراني ومركز الكتلة', html: `
<p><b>مركز الكتلة</b> النقطة التي تتحرك كما لو أن كتلة الجسم كلها مركزة فيها. ويكون الجسم <b>مستقرًا</b> إذا وقع مركز كتلته فوق قاعدته؛ وخفض مركز الكتلة وتوسيع القاعدة يزيدان الاستقرار.</p>
<p><b>شرطا الاتزان التام:</b> (1) محصلة القوى صفر ⟦F_{محصلة} = 0⟧ (اتزان انتقالي). (2) محصلة العزوم حول أي نقطة صفر ⟦τ_{محصلة} = 0⟧ (اتزان دوراني)، أي مجموع العزوم مع عقارب الساعة = مجموعها عكسها.</p>
<div class="box ex"><b>✎ مثال: الأرجوحة (الميزان)</b>طفل وزنه ⟦300 N⟧ يجلس على بعد ⟦2 m⟧ من نقطة الارتكاز. أين يجلس طفل وزنه ⟦400 N⟧ في الجهة الأخرى لتتزن؟<span class="sol">الحل: ⟦300×2 = 400×r ⇒ r = 1.5 m⟧.</span></div>
<p><b>الزخم الزاوي</b> ⟦L = Iω⟧، ويُحفظ إذا كان العزم المحصلة الخارجي صفرًا؛ لذلك يدور المتزلج أسرع عندما يضم ذراعيه (يقل I فيزداد ω).</p>`,
 q: [['متزلج يدور على الجليد ثم ضم ذراعيه إلى جسمه. سرعته الزاوية', ['تقل', 'تزداد', 'لا تتغير', 'تنعدم'], 1, 'حفظ الزخم الزاوي ⟦Iω⟧: يقل I فيزداد ω.']] }],
 cards: [['السرعة الزاوية', '⟦ω = Δθ/Δt⟧ ⟦(rad/s)⟧'], ['العلاقة الخطية', '⟦v = rω⟧'], ['العزم', '⟦τ = F r sin θ⟧ ⟦(N·m)⟧'], ['ذراع القوة', 'البعد العمودي بين المحور وخط عمل القوة'], ['شرطا الاتزان', '⟦F_{محصلة} = 0⟧ و⟦τ_{محصلة} = 0⟧'], ['الزخم الزاوي', '⟦L = Iω⟧'], ['الاستقرار', 'مركز الكتلة منخفض وفوق القاعدة']] },

{ n: '3-2', t: 'الزخم والدفع', parts: [
 { h: 'الزخم ونظرية الدفع والزخم', html: `
<p><b>الزخم</b> ⟦p = mv⟧ كمية متجهة في اتجاه السرعة، وحدتها ⟦kg·m/s⟧. <b>الدفع</b> حاصل ضرب القوة في زمن تأثيرها ⟦FΔt⟧ بوحدة ⟦N·s⟧، و<b>نظرية الدفع – الزخم</b>: ⟦FΔt = p_{f} − p_{i} = Δp⟧. والقانون الثاني بصيغته العامة: ⟦F = Δp/Δt⟧.</p>
<p>في منحنى (القوة – الزمن): المساحة تحت المنحنى = الدفع.</p>
<p><b>تطبيقات:</b> الوسائد الهوائية وثني الركبتين عند القفز ومواد التغليف تزيد زمن التوقف ⟦Δt⟧ فتقل القوة المؤثرة للتغير نفسه في الزخم. وعلى العكس، متابعة الضرب في الرياضة تطيل زمن التلامس فيزيد الدفع والسرعة.</p>
<div class="box ex"><b>✎ مثال</b>كرة ⟦0.5 kg⟧ تتحرك بـ ⟦10 m/s⟧ ارتدت عن جدار بـ ⟦8 m/s⟧ في الاتجاه المعاكس، وكان زمن التلامس ⟦0.05 s⟧. ما التغير في الزخم ومتوسط القوة؟<span class="sol">الحل: ⟦Δp = 0.5(−8 − 10) = −9 kg·m/s⟧، و⟦F = −9/0.05 = −180 N⟧ (أي ⟦180 N⟧ بعيدًا عن الجدار).</span></div>
<div class="box warn"><b>⚠️ إشارة الارتداد</b>عند ارتداد الجسم تتغير إشارة سرعته؛ فالتغير في الزخم مجموع المقدارين لا فرقهما. وإن ارتد بالسرعة نفسها ⟦Δp = 2mv⟧.</div>`,
 q: [['الهدف من الوسادة الهوائية في السيارة', ['تقليل التغير في زخم الراكب', 'زيادة زمن التوقف لتقليل القوة', 'زيادة القوة على الراكب', 'تقليل كتلة الراكب'], 1, '⟦FΔt = Δp⟧: Δp نفسه، وبزيادة Δt تقل F.'],
     ['قوة ⟦50 N⟧ أثرت في جسم ساكن كتلته ⟦5 kg⟧ مدة ⟦2 s⟧. سرعته النهائية', ['⟦10 m/s⟧', '⟦20 m/s⟧', '⟦25 m/s⟧', '⟦50 m/s⟧'], 1, '⟦Δp = 100 kg·m/s ⇒ v = 100/5 = 20 m/s⟧.']] }],
 cards: [['الزخم', '⟦p = mv⟧ متجه'], ['الدفع', '⟦FΔt = Δp⟧ ⟦(N·s)⟧'], ['المساحة تحت (F–t)', 'الدفع'], ['زيادة زمن التصادم', 'تقلل القوة'], ['ارتداد بالسرعة نفسها', '⟦Δp = 2mv⟧']] },

{ n: '3-3', t: 'حفظ الزخم والتصادمات', parts: [
 { h: 'قانون حفظ الزخم', html: `
<p>في <b>نظام مغلق معزول</b> (لا تدخله كتلة ولا تخرج منه، ومحصلة القوى الخارجية عليه صفر) يبقى الزخم الكلي ثابتًا: ⟦p_{Ai} + p_{Bi} = p_{Af} + p_{Bf}⟧. القوى الداخلية بين أجزاء النظام (أزواج القانون الثالث) لا تغير زخمه الكلي.</p>
<table class="tbl"><tr><th>الحالة</th><th>المعادلة</th></tr>
<tr><td>تصادم يلتحم فيه الجسمان</td><td>⟦m_{A}v_{A} + m_{B}v_{B} = (m_{A} + m_{B})v_{f}⟧</td></tr>
<tr><td>انفجار أو ارتداد من السكون</td><td>⟦0 = m_{A}v_{A} + m_{B}v_{B}⟧ ⇐ سرعتان متعاكستان</td></tr>
<tr><td>تصادم في بعدين</td><td>الزخم محفوظ في كل محور على حدة</td></tr></table>
<div class="box ex"><b>✎ مثال: ارتداد بندقية</b>بندقية ⟦4 kg⟧ أطلقت رصاصة ⟦0.02 kg⟧ بسرعة ⟦400 m/s⟧. ما سرعة ارتداد البندقية؟<span class="sol">الحل: ⟦0 = 0.02×400 + 4v ⇒ v = −2 m/s⟧ أي ⟦2 m/s⟧ للخلف.</span></div>
<div class="box ex"><b>✎ مثال: التحام</b>عربة ⟦2 kg⟧ سرعتها ⟦6 m/s⟧ اصطدمت بعربة ⟦1 kg⟧ ساكنة والتحمتا. ما سرعتهما؟<span class="sol">الحل: ⟦12 = 3v_{f} ⇒ v_{f} = 4 m/s⟧.</span></div>
<p><b>الصواريخ</b> تعمل بحفظ الزخم: تُقذف الغازات للخلف فيكتسب الصاروخ زخمًا للأمام، ولا يحتاج إلى هواء يدفعه.</p>`,
 q: [['شخصان ساكنان على جليد أملس، كتلتاهما ⟦50 kg⟧ و⟦100 kg⟧، دفع أحدهما الآخر. إذا تحرك الأخف بـ ⟦2 m/s⟧ فإن الأثقل يتحرك بـ', ['⟦2 m/s⟧', '⟦1 m/s⟧', '⟦4 m/s⟧', '⟦0.5 m/s⟧'], 1, '⟦50×2 = 100×v ⇒ v = 1 m/s⟧ في الاتجاه المعاكس.']] },
 { h: 'أنواع التصادمات', html: `
<p>الزخم محفوظ في كل التصادمات (في نظام معزول)، أما الطاقة الحركية:</p>
<ul><li><b>التصادم المرن:</b> تُحفظ الطاقة الحركية أيضًا (تصادم كرات البلياردو تقريبًا، وتصادم الجزيئات).</li>
<li><b>التصادم غير المرن:</b> تتحول بعض الطاقة الحركية إلى أشكال أخرى (حرارة، صوت، تشوه)، وأكبر فقد عندما يلتحم الجسمان (عديم المرونة).</li></ul>
<div class="box ex"><b>✎ مثال</b>في مثال العربتين السابق: الطاقة الحركية قبل ⟦½×2×36 = 36 J⟧ وبعد ⟦½×3×16 = 24 J⟧، فُقد ⟦12 J⟧، فالتصادم غير مرن.</div>`,
 q: [['في التصادم المرن يُحفظ', ['الزخم فقط', 'الطاقة الحركية فقط', 'الزخم والطاقة الحركية', 'السرعة'], 2, 'المرن: الزخم والطاقة الحركية معًا.']] }],
 cards: [['حفظ الزخم', '⟦p_{i} = p_{f}⟧ في نظام مغلق معزول'], ['تصادم التحامي', '⟦m_{A}v_{A} + m_{B}v_{B} = (m_{A} + m_{B})v_{f}⟧'], ['انفجار من السكون', 'مجموع الزخم بعده صفر'], ['التصادم المرن', 'يُحفظ الزخم والطاقة الحركية'], ['التصادم غير المرن', 'يُحفظ الزخم فقط'], ['مبدأ عمل الصاروخ', 'حفظ الزخم']] },

{ n: '3-4', t: 'الشغل والقدرة', parts: [
 { h: 'الشغل', html: `
<p>تبذل القوة <b>شغلًا</b> على جسم إذا أزاحته: ⟦W = Fd cos θ⟧، حيث θ الزاوية بين القوة والإزاحة، ووحدته الجول ⟦J = N·m⟧ وهو كمية قياسية.</p>
<table class="tbl"><tr><th>الزاوية</th><th>الشغل</th><th>مثال</th></tr>
<tr><td>⟦θ = 0°⟧</td><td>⟦W = Fd⟧ (أكبر ما يمكن)</td><td>دفع صندوق في اتجاه حركته</td></tr>
<tr><td>⟦θ = 90°⟧</td><td>صفر</td><td>حمل حقيبة والمشي أفقيًا، القوة المركزية</td></tr>
<tr><td>⟦θ = 180°⟧</td><td>⟦W = −Fd⟧ (سالب)</td><td>الاحتكاك</td></tr></table>
<p>لا يُبذل شغل إذا لم تحدث إزاحة مهما كانت القوة كبيرة (دفع جدار ثابت). وفي منحنى (القوة – الإزاحة) المساحة = الشغل؛ ومنه شغل استطالة نابض ⟦½kx^{2}⟧.</p>
<p><b>نظرية الشغل – الطاقة:</b> الشغل المحصل = التغير في الطاقة الحركية: ⟦W = ΔKE = ½mv_{f}^{2} − ½mv_{i}^{2}⟧.</p>
<div class="box ex"><b>✎ مثال</b>سُحب صندوق ⟦10 m⟧ بحبل يصنع ⟦60°⟧ مع الأفقي بقوة ⟦50 N⟧. ما الشغل؟<span class="sol">الحل: ⟦W = 50×10×cos 60° = 250 J⟧.</span></div>`,
 q: [['قمر صناعي يدور في مدار دائري. الشغل الذي تبذله الجاذبية عليه', ['موجب', 'سالب', 'صفر', 'يساوي طاقته الحركية'], 2, 'القوة نحو المركز عمودية على الإزاحة المماسية ⟦(θ = 90°)⟧.']] },
 { h: 'القدرة', html: `
<p><b>القدرة</b> المعدل الزمني لبذل الشغل أو نقل الطاقة: ⟦P = W/t⟧، ووحدتها الواط ⟦W = J/s⟧، و⟦1 kW = 1000 W⟧. ولجسم يتحرك بسرعة ثابتة بتأثير قوة: ⟦P = Fv⟧.</p>
<div class="box ex"><b>✎ مثال</b>رافعة ترفع ⟦200 kg⟧ مسافة ⟦15 m⟧ خلال ⟦10 s⟧. ما قدرتها؟<span class="sol">الحل: ⟦W = mgh = 200×10×15 = 30000 J⟧، و⟦P = 30000/10 = 3000 W = 3 kW⟧.</span></div>
<div class="box warn"><b>⚠️ رمز W</b>الحرف W يدل على الشغل، ووحدة القدرة (الواط) رمزها W أيضًا؛ ميّز من السياق.</div>`,
 q: [['محرك يبذل ⟦6000 J⟧ في دقيقة. قدرته', ['⟦100 W⟧', '⟦600 W⟧', '⟦6000 W⟧', '⟦360 kW⟧'], 0, '⟦6000/60 = 100 W⟧.']] }],
 cards: [['الشغل', '⟦W = Fd cos θ⟧ ⟦(J)⟧'], ['شغل قوة عمودية على الإزاحة', 'صفر'], ['شغل الاحتكاك', 'سالب'], ['المساحة تحت (F–d)', 'الشغل'], ['نظرية الشغل والطاقة', '⟦W = ΔKE⟧'], ['القدرة', '⟦P = W/t = Fv⟧ ⟦(W)⟧']] },

{ n: '3-5', t: 'الطاقة وحفظها', parts: [
 { h: 'الطاقة الحركية وطاقة الوضع', html: `
<p><b>الطاقة</b> القدرة على إحداث تغيير، وحدتها الجول.</p>
<ul><li><b>الطاقة الحركية</b> ⟦KE = ½mv^{2}⟧: مضاعفة السرعة تجعلها أربعة أمثالها، ومضاعفة الكتلة تضاعفها. وبدلالة الزخم ⟦KE = p^{2}/(2m)⟧.</li>
<li><b>طاقة الوضع الناتجة عن الجاذبية</b> ⟦PE = mgh⟧ بالنسبة إلى <b>مستوى إسناد</b> نختاره (قيمتها نسبية، أما التغير فيها فلا يعتمد على المستوى).</li>
<li><b>طاقة الوضع المرونية</b> ⟦PE_{sp} = ½kx^{2}⟧ في نابض مضغوط أو مشدود مسافة x.</li></ul>
<p>وتشمل أشكال الطاقة: الحرارية والكيميائية والكهربائية والنووية والضوئية والصوتية. وطاقة السكون ⟦E_{0} = mc^{2}⟧ تبين أن الكتلة نفسها صورة من الطاقة.</p>`,
 q: [['جسم ⟦2 kg⟧ يتحرك بسرعة ⟦3 m/s⟧. طاقته الحركية', ['⟦3 J⟧', '⟦6 J⟧', '⟦9 J⟧', '⟦18 J⟧'], 2, '⟦½×2×9 = 9 J⟧.']] },
 { h: 'حفظ الطاقة الميكانيكية', html: `
<p><b>الطاقة الميكانيكية</b> ⟦E = KE + PE⟧. في نظام معزول بلا احتكاك تبقى ثابتة: ⟦KE_{i} + PE_{i} = KE_{f} + PE_{f}⟧. ومنه سرعة جسم سقط أو انزلق على سطح أملس من ارتفاع h: ⟦v = √(2gh)⟧، ولا تعتمد على الكتلة ولا على شكل المسار.</p>
<p><b>البندول:</b> عند أعلى نقطة طاقة وضع قصوى وحركية صفر، وعند أدنى نقطة العكس. والمجموع ثابت بإهمال الاحتكاك.</p>
<p>مع وجود الاحتكاك: الطاقة الكلية محفوظة، لكن جزءًا من الميكانيكية يتحول إلى حرارية: ⟦KE_{i} + PE_{i} = KE_{f} + PE_{f} + |W_{احتكاك}|⟧.</p>
<div class="box ex"><b>✎ مثال</b>كرة ⟦0.5 kg⟧ سقطت من ⟦20 m⟧. ما طاقتها الحركية وسرعتها عند ارتفاع ⟦5 m⟧؟<span class="sol">الحل: النقص في طاقة الوضع ⟦0.5×10×15 = 75 J⟧ = طاقتها الحركية، و⟦v = √(2×10×15) ≈ 17.3 m/s⟧.</span></div>`,
 q: [['بندول يتأرجح بلا احتكاك. عند أدنى نقطة تكون', ['طاقة الوضع أكبر ما يمكن', 'الطاقة الحركية أكبر ما يمكن', 'الطاقة الميكانيكية صفرًا', 'السرعة صفرًا'], 1, 'أدنى نقطة: أقل طاقة وضع وأكبر طاقة حركية.']] }],
 cards: [['الطاقة الحركية', '⟦KE = ½mv^{2}⟧'], ['طاقة الوضع (الجاذبية)', '⟦PE = mgh⟧'], ['طاقة الوضع المرونية', '⟦PE_{sp} = ½kx^{2}⟧'], ['حفظ الطاقة الميكانيكية', '⟦KE_{i} + PE_{i} = KE_{f} + PE_{f}⟧'], ['سرعة السقوط من h', '⟦v = √(2gh)⟧'], ['مضاعفة السرعة', 'الطاقة الحركية × 4'], ['طاقة السكون', '⟦E_{0} = mc^{2}⟧']] },

{ n: '3-6', t: 'الآلات البسيطة', parts: [
 { h: 'الفائدة الميكانيكية والكفاءة', html: `
<p>الآلة لا توفر الشغل، بل تسهّل العمل بتغيير مقدار القوة أو اتجاهها. نسمي القوة التي نؤثر بها <b>القوة المسلطة</b> ⟦F_{e}⟧ والقوة التي تؤثر بها الآلة <b>قوة المقاومة</b> ⟦F_{r}⟧.</p>
<table class="tbl"><tr><th>الكمية</th><th>القانون</th></tr>
<tr><td>الفائدة الميكانيكية</td><td>⟦MA = F_{r}/F_{e}⟧</td></tr>
<tr><td>الفائدة الميكانيكية المثالية</td><td>⟦IMA = d_{e}/d_{r}⟧ (المسافتان)</td></tr>
<tr><td>الكفاءة</td><td>⟦e = (W_{o}/W_{i})×100 = (MA/IMA)×100⟧</td></tr></table>
<p>الكفاءة أقل من ⟦100٪⟧ دائمًا في الآلات الحقيقية بسبب الاحتكاك، وفي الآلة المثالية ⟦MA = IMA⟧. الفائدة الميكانيكية الأكبر من 1 تعني تقليل القوة مقابل زيادة المسافة.</p>
<p><b>الآلات البسيطة الست:</b> الرافعة، البكرة، العجلة والمحور، المستوى المائل، الوتد، اللولب. و<b>الآلة المركبة</b> مكونة من أكثر من آلة بسيطة (كالدراجة)، وفائدتها الميكانيكية حاصل ضرب الفوائد.</p>
<div class="box ex"><b>✎ مثال</b>رُفع حمل ⟦600 N⟧ بقوة ⟦200 N⟧ باستعمال بكرات، فتحرك الحبل ⟦4 m⟧ وارتفع الحمل ⟦1 m⟧. احسب MA وIMA والكفاءة.<span class="sol">الحل: ⟦MA = 600/200 = 3⟧، ⟦IMA = 4/1 = 4⟧، ⟦e = 3/4 × 100 = 75٪⟧.</span></div>`,
 q: [['آلة كفاءتها ⟦80٪⟧ بُذل عليها شغل ⟦500 J⟧. الشغل الناتج', ['⟦400 J⟧', '⟦580 J⟧', '⟦625 J⟧', '⟦100 J⟧'], 0, '⟦W_{o} = 0.8×500 = 400 J⟧.'],
     ['الفائدة الميكانيكية المثالية لمستوى مائل طوله ⟦6 m⟧ وارتفاعه ⟦2 m⟧', ['⟦2⟧', '⟦3⟧', '⟦12⟧', '⟦1/3⟧'], 1, '⟦IMA = d_{e}/d_{r} = 6/2 = 3⟧.']] }],
